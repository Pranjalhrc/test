<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Test – UP Assistant Professor (Maths)</title>
    <!-- MathJax for LaTeX rendering -->
    <script>
        MathJax = {
            tex: { inlineMath: [['\\(', '\\)'], ['$', '$']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .app-container {
            width: 1400px;
            max-width: 100%;
            height: 90vh;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: #1e293b;
            color: white;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .timer {
            background: #334155;
            padding: 8px 18px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            font-variant-numeric: tabular-nums;
        }

        /* Main content */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 15px;
            gap: 15px;
            background: #f8fafc;
        }

        /* Left: question area */
        .question-area {
            flex: 3;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background: #ffffff;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
            min-width: 0;
        }

        .question-number {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .question-text {
            font-size: 1.25rem;
            line-height: 1.6;
            color: #0f172a;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 30px;
        }
        .option {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 14px 18px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .option:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }
        .option.selected {
            background: #e0f2fe;
            border-color: #0284c7;
            box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15);
        }
        .option-letter {
            background: #e2e8f0;
            color: #1e293b;
            font-weight: 700;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.9rem;
        }
        .option.selected .option-letter {
            background: #0284c7;
            color: white;
        }
        .option-text {
            flex: 1;
            color: #1e293b;
            font-size: 1.05rem;
            line-height: 1.5;
            word-break: break-word;
        }

        /* Navigation buttons */
        .nav-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: auto;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.15s;
            background: #f1f5f9;
            color: #1e293b;
            border: 1px solid #cbd5e1;
        }
        .btn:hover {
            background: #e2e8f0;
        }
        .btn.primary {
            background: #1e293b;
            color: white;
            border-color: #1e293b;
        }
        .btn.primary:hover {
            background: #0f172a;
        }
        .btn.warning {
            background: #f59e0b;
            color: white;
            border-color: #f59e0b;
        }
        .btn.warning:hover {
            background: #d97706;
        }
        .btn.danger {
            background: #dc2626;
            color: white;
            border-color: #dc2626;
        }
        .btn.danger:hover {
            background: #b91c1c;
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Right: Palette */
        .palette-area {
            flex: 1;
            min-width: 260px;
            max-width: 320px;
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .palette-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-shrink: 0;
        }
        .palette-header h3 {
            font-size: 1rem;
            color: #0f172a;
            font-weight: 600;
        }
        .palette-stats {
            font-size: 0.8rem;
            color: #64748b;
        }
        .palette-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            overflow-y: auto;
            padding-right: 4px;
            flex: 1;
        }
        .palette-btn {
            aspect-ratio: 1 / 1;
            border-radius: 8px;
            border: 2px solid transparent;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
            color: #1e293b;
            background: #f1f5f9;
            border-color: #e2e8f0;
        }
        .palette-btn:hover {
            transform: scale(1.05);
        }
        .palette-btn.answered {
            background: #22c55e;
            color: white;
            border-color: #16a34a;
        }
        .palette-btn.not-answered {
            background: #f87171;
            color: white;
            border-color: #ef4444;
        }
        .palette-btn.marked {
            background: #a855f7;
            color: white;
            border-color: #9333ea;
        }
        .palette-btn.not-visited {
            background: #e2e8f0;
            color: #64748b;
            border-color: #cbd5e1;
        }
        .palette-btn.current {
            box-shadow: 0 0 0 3px #0ea5e9;
            border-color: #0ea5e9;
        }

        /* Legend */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid #e2e8f0;
            font-size: 0.7rem;
            flex-shrink: 0;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }
        .legend-color.answered { background: #22c55e; }
        .legend-color.not-answered { background: #f87171; }
        .legend-color.marked { background: #a855f7; }
        .legend-color.not-visited { background: #e2e8f0; }

        /* Overlay / Results */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }
        .overlay.show {
            display: flex;
        }
        .result-card {
            background: white;
            border-radius: 20px;
            width: 900px;
            max-width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .result-header {
            padding: 20px 25px;
            background: #1e293b;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            flex-shrink: 0;
        }
        .result-header h2 {
            font-size: 1.4rem;
            font-weight: 600;
        }
        .result-stats {
            display: flex;
            gap: 20px;
            font-size: 0.95rem;
        }
        .result-stats span {
            background: #334155;
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 500;
        }

        .filter-bar {
            display: flex;
            gap: 8px;
            padding: 12px 25px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .filter-btn {
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid #cbd5e1;
            background: white;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }
        .filter-btn.active {
            background: #1e293b;
            color: white;
            border-color: #1e293b;
        }
        .filter-btn:hover:not(.active) {
            background: #f1f5f9;
        }

        .review-list {
            overflow-y: auto;
            padding: 20px 25px;
            flex: 1;
        }
        .review-item {
            border-bottom: 1px solid #e2e8f0;
            padding: 16px 0;
        }
        .review-item:last-child {
            border-bottom: none;
        }
        .review-question {
            font-weight: 600;
            margin-bottom: 8px;
            color: #0f172a;
            line-height: 1.5;
        }
        .review-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 20px;
            font-size: 0.92rem;
            margin-bottom: 6px;
        }
        .review-opt {
            padding: 4px 8px;
            border-radius: 6px;
            line-height: 1.4;
        }
        .review-opt.correct {
            background: #dcfce7;
            color: #166534;
            font-weight: 500;
        }
        .review-opt.wrong {
            background: #fee2e2;
            color: #991b1b;
        }
        .review-opt.selected {
            border: 2px solid #0ea5e9;
        }
        .review-meta {
            font-size: 0.85rem;
            color: #475569;
            display: flex;
            gap: 20px;
            margin-top: 4px;
        }
        .review-meta span {
            font-weight: 500;
        }
        .badge-correct { color: #16a34a; font-weight: 700; }
        .badge-wrong { color: #dc2626; font-weight: 700; }
        .badge-skipped { color: #d97706; font-weight: 700; }

        .result-footer {
            padding: 15px 25px;
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex-shrink: 0;
        }

        .hidden {
            display: none !important;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        @media (max-width: 900px) {
            .main-content {
                flex-direction: column;
            }
            .palette-area {
                max-width: 100%;
                min-width: 100%;
                max-height: 250px;
            }
            .review-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app-container" id="app">
        <!-- Header -->
        <div class="header">
            <h1>📝 UP Assistant Professor – Mathematics (Test)</h1>
            <div class="timer" id="timerDisplay">⏳ 70:00</div>
        </div>

        <!-- Main content -->
        <div class="main-content">
            <!-- Question area (left) -->
            <div class="question-area" id="questionArea">
                <div class="question-number" id="qNumber">Question 1 of 70</div>
                <div class="question-text" id="qText"></div>
                <div class="options" id="optionsContainer"></div>
                <div class="nav-buttons">
                    <button class="btn" id="prevBtn" disabled>◀ Previous</button>
                    <button class="btn" id="nextBtn">Next ▶</button>
                    <button class="btn" id="clearBtn">🗑 Clear Response</button>
                    <button class="btn warning" id="markBtn">🔖 Mark for Review</button>
                    <button class="btn danger" id="submitBtn">✅ Submit Test</button>
                </div>
            </div>

            <!-- Palette (right) -->
            <div class="palette-area">
                <div class="palette-header">
                    <h3>Question Palette</h3>
                    <span class="palette-stats" id="paletteStats"></span>
                </div>
                <div class="palette-grid" id="paletteGrid"></div>
                <div class="legend">
                    <div class="legend-item"><span class="legend-color answered"></span> Answered</div>
                    <div class="legend-item"><span class="legend-color not-answered"></span> Not Answered</div>
                    <div class="legend-item"><span class="legend-color marked"></span> Marked</div>
                    <div class="legend-item"><span class="legend-color not-visited"></span> Not Visited</div>
                </div>
            </div>
        </div>

        <!-- Results overlay -->
        <div class="overlay" id="resultOverlay">
            <div class="result-card">
                <div class="result-header">
                    <h2>📊 Performance & Solutions</h2>
                    <div class="result-stats">
                        <span id="scoreDisplay">Score: 0</span>
                        <span id="accuracyDisplay">Accuracy: 0%</span>
                    </div>
                </div>
                <div class="filter-bar">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="correct">✅ Correct</button>
                    <button class="filter-btn" data-filter="incorrect">❌ Incorrect</button>
                    <button class="filter-btn" data-filter="unattempted">⬜ Unattempted</button>
                </div>
                <div class="review-list" id="reviewList"></div>
                <div class="result-footer">
                    <button class="btn primary" id="downloadBtn">⬇ Download Report</button>
                    <button class="btn" id="closeOverlayBtn">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. DATA – exactly as provided in the documentclass{article} file
        // ============================================================
        const questions = [
            { id: 1, text: "The upper Reimann sum \\(U(P, f)\\) of the function \\(f(x) = 2x + 1\\) with respect to partition \\(P = [0, \\frac{1}{4}, \\frac{1}{2}, \\frac{3}{4}, 1]\\) of the interval \\([0, 1]\\) is", options: ["\\(\\frac{9}{4}\\)", "\\(\\frac{11}{4}\\)", "\\(\\frac{1}{4}\\)", "\\(\\frac{3}{4}\\)"], correct: 0 },
            { id: 2, text: "The maximum value of \\(\\sin x \\cdot \\sin y \\cdot \\sin(x + y)\\) is attained at", options: ["\\((\\frac{2\\pi}{3}, \\frac{2\\pi}{3})\\)", "\\((\\frac{\\pi}{4}, \\frac{\\pi}{4})\\)", "\\((\\frac{3\\pi}{4}, \\frac{3\\pi}{4})\\)", "\\((\\frac{\\pi}{3}, \\frac{\\pi}{3})\\)"], correct: 3 },
            { id: 3, text: "Which one of the following functions is a part of complementary function of the differential equation \\((x + 2)\\frac{d^2 y}{dx^2} - (2x + 5)\\frac{dy}{dx} + 2y = (x + 1)e^x\\)?", options: ["\\(y = e^{2x}\\)", "\\(y = x\\)", "\\(y = e^x\\)", "\\(y = x^2\\)"], correct: 0 },
            { id: 4, text: "Consider the following statements for \\(f(z) = \\frac{1}{z}\\sin\\frac{1}{z}\\) and \\(g(z) = f(z)\\sin z\\):<br>I. \\(f(z)\\) has an essential singularity at \\(z = 0\\)<br>II. \\(g(z)\\) has a removable singularity at \\(z = 0\\)<br>Which of the above statements is/are true?", options: ["Both I and II", "Only I", "Neither I nor II", "Only II"], correct: 1 },
            { id: 5, text: "If \\(W_1\\) and \\(W_2\\) are 3-dimensional subspaces of a 4-dimensional vector space \\(V\\), then the smallest possible dimension of \\(W_1 \\cap W_2\\) will be", options: ["3", "1", "4", "2"], correct: 3 },
            { id: 6, text: "The angle between pair of planes \\(2x^2 - 6y^2 - 12z^2 + 18yz + 2xz + xy = 0\\) is", options: ["\\(\\cos^{-1}(\\frac{16}{21})\\)", "\\(\\cos^{-1}(\\frac{5}{21})\\)", "\\(\\sin^{-1}(\\frac{16}{25})\\)", "\\(\\tan^{-1}(\\frac{5}{21})\\)"], correct: 0 },
            { id: 7, text: "With reference to the motion of a rigid body moving into two dimensions about centre of inertia, match List - I with List - II and choose the correct answer using the code given below the lists.<br><br><b>List - I</b> &nbsp;&nbsp;&nbsp; <b>List - II</b><br>A. Equation of motion &nbsp;&nbsp;&nbsp; 1. \\(\\frac{1}{2}mk^2 \\dot{\\theta}^2\\)<br>B. Moment of momentum &nbsp;&nbsp;&nbsp; 2. \\(mk^2 \\dot{\\theta}\\)<br>C. Kinetic energy of the body &nbsp;&nbsp;&nbsp; 3. \\(M\\ddot{x} = \\sum X, M\\ddot{y} = \\sum Y\\)<br>D. Motion of centre of inertia &nbsp;&nbsp;&nbsp; 4. \\(M k^2 \\ddot{\\theta} = L\\)<br><br>Code:", options: ["A-2, B-1, C-3, D-4", "A-4, B-1, C-2, D-3", "A-4, B-2, C-1, D-3", "A-4, B-1, C-3, D-2"], correct: 2 },
            { id: 8, text: "In Cauchy's Mean Value theorem for the functions \\(f(x) = e^x\\) and \\(g(x) = e^{-x}\\) the value of \\(c\\) is such that", options: ["\\(c\\) is the harmonic mean between \\(a\\) and \\(b\\)", "\\(c\\) is the arithmetic mean between \\(a\\) and \\(b\\)", "\\(c\\) is the geometric mean between \\(a\\) and \\(b\\)", "none of the above"], correct: 1 },
            { id: 9, text: "The infinite series \\(1 + \\frac{1}{2(\\log 2)^p} + \\frac{1}{3(\\log 3)^p} + \\dots + \\frac{1}{n(\\log n)^p} + \\dots \\text{ to } \\infty\\) is convergent if", options: ["\\(p \\le 1\\)", "\\(p < 1\\)", "\\(p > 1\\)", "\\(p = 1\\)"], correct: 2 },
            { id: 10, text: "Putting \\(x = e^t\\) and denoting \\(\\frac{d}{dt}\\) by \\(\\theta\\), then the differential equation \\(x^3 \\frac{d^3y}{dx^3} + 3x^2 \\frac{d^2y}{dx^2} + x \\frac{dy}{dx} + y = \\log x\\) is transformed to", options: ["\\((\\theta^3 - 1)y = t\\)", "\\(\\theta^3 y = t\\)", "\\((\\theta^3 + 3\\theta + 1)y = t\\)", "\\((\\theta^3 + 1)y = t\\)"], correct: 3 },
            { id: 11, text: "If the Lagrangian does NOT depend on time explicitly, then", options: ["The Hamiltonian is constant", "Hamiltonian is not constant", "Potential energy is constant", "The kinetic energy is constant"], correct: 0 },
            { id: 12, text: "Which one of the following is true?", options: ["There is a field of 64 elements", "There is a field of 45 elements", "There is a field of 80 elements", "There is a field of 48 elements"], correct: 0 },
            { id: 13, text: "If \\(p\\) is a prime number and \\(G\\) is a non-abelian group of order \\(p^3\\), then the centre of \\(G\\) has exactly", options: ["\\(p+1\\) elements", "\\(p-1\\) elements", "\\(p^2\\) elements", "\\(p\\) elements"], correct: 3 },
            { id: 14, text: "If \\(S\\) denotes the surface of the cube bounded by the planes \\(x=0\\), \\(x=1\\), \\(y=0\\), \\(y=1\\), \\(z=0\\), \\(z=1\\), then the normal surface integral of \\(\\vec{F} = (x^3 - yz)\\hat{i} - 2x^2 y\\hat{j} + 2\\hat{k}\\) over \\(S\\) is", options: ["\\(\\frac{1}{5}\\)", "1", "\\(\\frac{1}{6}\\)", "\\(\\frac{1}{3}\\)"], correct: 3 },
            { id: 15, text: "The number of group homomorphisms from the group \\(\\mathbb{Z}_8\\) to group \\(\\mathbb{Z}_{20}\\) is", options: ["3", "4", "2", "None"], correct: 1 },
            { id: 16, text: "The mean and variance of a binomial distribution are 4 and \\(\\frac{4}{3}\\) respectively. Find the probability of 3 or more than 3 successes.", options: ["\\(\\frac{656}{729}\\)", "\\(\\frac{20}{243}\\)", "\\(\\frac{73}{729}\\)", "\\(\\frac{716}{729}\\)"], correct: 3 },
            { id: 17, text: "Consider a planet of mass \\(m\\) orbiting around the sun under inverse square law of acceleration \\(\\frac{\\mu m}{r^2}\\). If the position of the planet at time \\(t\\) given by the polar coordinates \\((r, \\theta)\\), then the Lagrangian \\(L\\) of the system is given by", options: ["\\(\\frac{m}{2}(\\dot{r}^2 + \\dot{\\theta}^2) + \\frac{\\mu m}{r^2}\\)", "\\(\\frac{m}{2}(\\dot{r}^2 + r^2 \\dot{\\theta}^2) - \\frac{\\mu m}{r}\\)", "\\(\\frac{m}{2}(\\dot{r}^2 + \\dot{\\theta}^2) - \\frac{\\mu m}{r^2}\\)", "\\(\\frac{1}{2}(\\dot{r}^2 + r^2 \\dot{\\theta}^2) + \\frac{\\mu m}{r}\\)"], correct: 3 },

            currentIndex: 0,
            answers: new Array(TOTAL_QUESTIONS).fill(null), // selected option index or null

            visited: new Array(TOTAL_QUESTIONS).fill(false),
            timer: TIME_LIMIT_SECONDS,
            timerInterval: null,
            submitted: false,
            filter: 'all' // 'all', 'correct', 'incorrect', 'unattempted'
        };

            timerDisplay: document.getElementById('timerDisplay'),
            qNumber: document.getElementById('qNumber'),

        // ============================================================
        // 4. RENDER FUNCTIONS
        // ============================================================
        function renderQuestion() {
            const idx = state.currentIndex;
            const q = questions[idx];
            state.visited[idx] = true;

            el.qNumber.textContent = `Question ${idx + 1} of ${TOTAL_QUESTIONS}`;
            el.qText.innerHTML = q.text;

            // Render options
            el.optionsContainer.innerHTML = '';
            const letters = ['A', 'B', 'C', 'D'];
            q.options.forEach((opt, i) => {
                const div = document.createElement('div');
                div.className = 'option' + (state.answers[idx] === i ? ' selected' : '');
                div.dataset.optionIndex = i;
                div.innerHTML = `
                    <div class="option-letter">${letters[i]}</div>
                    <div class="option-text">${opt}</div>
                `;
                div.addEventListener('click', () => selectOption(i));
                el.optionsContainer.appendChild(div);
            });

            // Update nav buttons
            el.prevBtn.disabled = idx === 0;
            el.nextBtn.disabled = idx === TOTAL_QUESTIONS - 1;

            // Update palette
            renderPalette();
            updatePaletteStats();

            // Mark button state
            if (state.marked[idx]) {
                el.markBtn.textContent = '🔖 Unmark Review';
                el.markBtn.classList.add('danger');
                el.markBtn.classList.remove('warning');
            } else {
                el.markBtn.textContent = '🔖 Mark for Review';
                el.markBtn.classList.add('warning');
                el.markBtn.classList.remove('danger');
            }

            // Re-render MathJax
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([el.qText, el.optionsContainer]).catch(err => console.warn(err));
            }
        }

        function renderPalette() {
            el.paletteGrid.innerHTML = '';
            for (let i = 0; i < TOTAL_QUESTIONS; i++) {
                const btn = document.createElement('button');
                btn.className = 'palette-btn';
                btn.textContent = i + 1;
                btn.dataset.index = i;

                // Determine state class
                if (state.answers[i] !== null) {
                    btn.classList.add('answered');
                } else if (state.visited[i]) {
                    btn.classList.add('not-answered');
                } else {
                    btn.classList.add('not-visited');
                }

                if (state.marked[i]) {
                    btn.classList.add('marked');
                }

                if (i === state.currentIndex) {
                    btn.classList.add('current');
                }

                btn.addEventListener('click', () => {
                    state.currentIndex = i;
                    renderQuestion();
                });

                el.paletteGrid.appendChild(btn);
            }
        }

        function updatePaletteStats() {
            const answered = state.answers.filter(a => a !== null).length;
            el.paletteStats.textContent = `${answered} / ${TOTAL_QUESTIONS} answered`;
        }

        // ============================================================
        // 5. INTERACTIONS
        // ============================================================
        function selectOption(optionIndex) {
            const idx = state.currentIndex;
            if (state.answers[idx] === optionIndex) {
                // Deselect
                state.answers[idx] = null;
            } else {
                state.answers[idx] = optionIndex;
            }
            // Re-render just options and palette
            const q = questions[idx];
            el.optionsContainer.innerHTML = '';
            const letters = ['A', 'B', 'C', 'D'];
            q.options.forEach((opt, i) => {
                const div = document.createElement('div');
                div.className = 'option' + (state.answers[idx] === i ? ' selected' : '');
                div.dataset.optionIndex = i;
                div.innerHTML = `
                    <div class="option-letter">${letters[i]}</div>
                    <div class="option-text">${opt}</div>
                `;
                div.addEventListener('click', () => selectOption(i));
                el.optionsContainer.appendChild(div);
            });
            renderPalette();
            updatePaletteStats();
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([el.optionsContainer]).catch(err => console.warn(err));
            }
        }

        // ============================================================
        // 6. TIMER
        // ============================================================
        function startTimer() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            state.timerInterval = setInterval(() => {
                state.timer--;
                if (state.timer <= 0) {
                    state.timer = 0;
                    updateTimerDisplay();
                    clearInterval(state.timerInterval);
                    submitTest(true);
                    return;
                }
                updateTimerDisplay();
            }, 1000);
        }

        function updateTimerDisplay() {
            const m = Math.floor(state.timer / 60);
            const s = state.timer % 60;
            el.timerDisplay.textContent = `⏳ ${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        // ============================================================
        // 7. SUBMISSION & RESULTS
        // ============================================================
        function submitTest(auto = false) {
            if (state.submitted) return;
            state.submitted = true;
            clearInterval(state.timerInterval);

            // Calculate score
            let score = 0;
            let correctCount = 0;
            let wrongCount = 0;
            let skippedCount = 0;

            for (let i = 0; i < TOTAL_QUESTIONS; i++) {
                const ans = state.answers[i];
                if (ans === null) {
                    skippedCount++;
                } else if (ans === questions[i].correct) {
                    score += 3;
                    correctCount++;
                } else {
                    score -= 1;
                    wrongCount++;
                }
            }

            const totalAttempted = correctCount + wrongCount;
            const accuracy = totalAttempted > 0 ? ((correctCount / totalAttempted) * 100).toFixed(2) : '0.00';

            el.scoreDisplay.textContent = `Score: ${score}`;
            el.accuracyDisplay.textContent = `Accuracy: ${accuracy}%`;

            // Build review list
            renderReviewList();

            // Show overlay
            el.resultOverlay.classList.add('show');

            // Re-render MathJax
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([el.reviewList]).catch(err => console.warn(err));
            }
        }

        function renderReviewList() {
            const filter = state.filter;
            el.reviewList.innerHTML = '';

            for (let i = 0; i < TOTAL_QUESTIONS; i++) {
                const q = questions[i];
                const userAns = state.answers[i];
                const isCorrect = userAns === q.correct;
                const isSkipped = userAns === null;

                // Apply filter
                if (filter === 'correct' && !isCorrect) continue;
                if (filter === 'incorrect' && (isCorrect || isSkipped)) continue;
                if (filter === 'unattempted' && !isSkipped) continue;

                const div = document.createElement('div');
                div.className = 'review-item';

                let badgeClass = '';
                let badgeText = '';
                if (isSkipped) {
                    badgeClass = 'badge-skipped';
                    badgeText = '⬜ Skipped';
                } else if (isCorrect) {
                    badgeClass = 'badge-correct';
                    badgeText = '✅ Correct';
                } else {
                    badgeClass = 'badge-wrong';
                    badgeText = '❌ Incorrect';
                }

                const letters = ['A', 'B', 'C', 'D'];
                let optionsHtml = '<div class="review-options">';
                q.options.forEach((opt, j) => {
                    let cls = '';
                    if (j === q.correct) cls = 'correct';
                    else if (j === userAns) cls = 'wrong';
                    if (j === userAns && j === q.correct) cls = 'correct';
                    if (j === userAns && j !== q.correct) cls = 'wrong selected';
                    const isSelected = j === userAns;
                    optionsHtml += `<div class="review-opt ${cls}" style="${isSelected ? 'border:2px solid #0ea5e9;' : ''}">${letters[j]}. ${opt}</div>`;
                });
                optionsHtml += '</div>';

                div.innerHTML = `
                    <div class="review-question">Q${i+1}. ${q.text}</div>
                    ${optionsHtml}
                    <div class="review-meta">
                        <span>Your answer: ${userAns !== null ? letters[userAns] : 'Not attempted'}</span>
                        <span>Correct answer: ${letters[q.correct]}</span>
                        <span class="${badgeClass}">${badgeText}</span>
                    </div>
                `;
                el.reviewList.appendChild(div);
            }

            // Re-render MathJax
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([el.reviewList]).catch(err => console.warn(err));
            }
        }

        // ============================================================
        // 8. DOWNLOAD REPORT
        // ============================================================
        function downloadReport() {
            let content = '';
            content += '============================================\n';
            content += '   UP Assistant Professor – Mathematics (Test)\n';
            content += '   Performance & Solutions Report\n';
            content += '============================================\n\n';

            let correctCount = 0, wrongCount = 0, skippedCount = 0, score = 0;
            for (let i = 0; i < TOTAL_QUESTIONS; i++) {
                const ans = state.answers[i];
                if (ans === null) skippedCount++;
                else if (ans === questions[i].correct) { correctCount++; score += 3; }
                else { wrongCount++; score -= 1; }
            }
            const attempted = correctCount + wrongCount;
            const accuracy = attempted > 0 ? ((correctCount / attempted) * 100).toFixed(2) : '0.00';

            content += `Score: ${score}   |   Accuracy: ${accuracy}%   |   Correct: ${correctCount}   |   Wrong: ${wrongCount}   |   Skipped: ${skippedCount}\n\n`;
            content += '--------------------------------------------\n\n';

            for (let i = 0; i < TOTAL_QUESTIONS; i++) {
                const q = questions[i];
                const userAns = state.answers[i];
                const isCorrect = userAns === q.correct;
                const isSkipped = userAns === null;
                const letters = ['A', 'B', 'C', 'D'];

                // Strip HTML tags and basic latex for plain text download
                let cleanText = q.text.replace(/<br>/g, '\n').replace(/<[^>]+>/g, '');
                cleanText = cleanText.replace(/\\\(/g, '(').replace(/\\\)/g, ')').replace(/\\\[/g, '[').replace(/\\\]/g, ']');
                
                content += `Q${i+1}. ${cleanText}\n`;
                q.options.forEach((opt, j) => {
                    let cleanOpt = opt.replace(/<[^>]+>/g, '');
                    cleanOpt = cleanOpt.replace(/\\\(/g, '(').replace(/\\\)/g, ')').replace(/\\\[/g, '[').replace(/\\\]/g, ']');
                    let marker = '   ';
                    if (j === q.correct) marker = ' * ';
                    else if (j === userAns) marker = ' - ';
                    content += `  ${marker}${letters[j]}. ${cleanOpt}\n`;
                });
                content += `  Your answer: ${userAns !== null ? letters[userAns] : 'Not attempted'}\n`;
                content += `  Correct answer: ${letters[q.correct]}\n`;
                if (isSkipped) content += `  Status: Skipped\n`;
                else if (isCorrect) content += `  Status: Correct ✅\n`;
                else content += `  Status: Incorrect ❌\n`;
                content += '\n';
            }

            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'UP_Assistant_Professor_Math_Report.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ============================================================
        // 9. EVENT LISTENERS
        // ============================================================
        el.prevBtn.addEventListener('click', () => {
            if (state.currentIndex > 0) {
                state.currentIndex--;
                renderQuestion();
            }
        });

        el.nextBtn.addEventListener('click', () => {
            if (state.currentIndex < TOTAL_QUESTIONS - 1) {
                state.currentIndex++;
                renderQuestion();
            }
        });

        el.clearBtn.addEventListener('click', () => {
            const idx = state.currentIndex;
            state.answers[idx] = null;
            renderQuestion();
            updatePaletteStats();
        });

        el.markBtn.addEventListener('click', () => {
            const idx = state.currentIndex;
            state.marked[idx] = !state.marked[idx];
            renderQuestion();
        });

        el.submitBtn.addEventListener('click', () => {
            if (!state.submitted) {
                if (confirm('Are you sure you want to submit the test?')) {
                    submitTest();
                }
            }
        });

        el.closeOverlayBtn.addEventListener('click', () => {
            el.resultOverlay.classList.remove('show');
        });

        el.downloadBtn.addEventListener('click', downloadReport);

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.filter = btn.dataset.filter;
                renderReviewList();
            });
        });

        // ============================================================
        // 10. INIT
        // ============================================================
        function init() {
            renderQuestion();
            updateTimerDisplay();
            startTimer();

            // Re-render MathJax on initial load
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([el.qText, el.optionsContainer, el.reviewList]).catch(err => console.warn(err));
            }
        }

        // Wait for MathJax to be ready
        if (window.MathJax && MathJax.startup) {
            MathJax.startup.promise.then(() => {
                init();
            });
        } else {
            // Fallback
            window.addEventListener('load', () => {
                setTimeout(init, 500);
            });
        }
    </script>
</body>
</html>
