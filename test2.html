<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCS iON style MCQ Test · 120 Questions</title>
    <!-- MathJax for LaTeX rendering -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: #f4f7fc;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ---------- TCS iON style header ---------- */
        .header {
            background: #0b2a4a;
            color: white;
            padding: 0.9rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        .logo {
            font-weight: 800;
            font-size: 1.7rem;
            letter-spacing: 1px;
            color: #f9a826;
        }
        .logo span {
            color: white;
            font-weight: 300;
        }
        .timer {
            background: #1e3a5f;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1.4rem;
            color: #f9a826;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border: 1px solid #f9a82644;
        }
        .timer i {
            font-style: normal;
            font-size: 1.2rem;
        }
        .header-right {
            display: flex;
            gap: 1rem;
        }
        .btn-outline-light {
            background: transparent;
            border: 1.5px solid #f9a826;
            color: #f9a826;
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-outline-light:hover {
            background: #f9a826;
            color: #0b2a4a;
        }

        /* ---------- Main layout ---------- */
        .main-container {
            display: flex;
            flex: 1;
            padding: 1.5rem 2rem;
            gap: 1.8rem;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        /* ---------- Question card (left) ---------- */
        .question-section {
            flex: 3;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            padding: 2rem 2rem 1.8rem;
            display: flex;
            flex-direction: column;
            min-height: 500px;
        }
        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #eef2f7;
            padding-bottom: 0.8rem;
        }
        .q-number {
            font-weight: 700;
            color: #0b2a4a;
            background: #eef2f7;
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            font-size: 1.1rem;
        }
        .q-status-badge {
            background: #f9a82622;
            color: #b16f00;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .q-text {
            font-size: 1.25rem;
            line-height: 1.7;
            margin: 1rem 0 2rem;
            color: #1a2b3c;
            font-weight: 500;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            margin-bottom: 2rem;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: #f9fbfe;
            border: 2px solid #e2e9f2;
            border-radius: 14px;
            padding: 1rem 1.5rem;
            cursor: pointer;
            transition: 0.15s;
            font-size: 1.1rem;
        }
        .option:hover {
            background: #eef4ff;
            border-color: #b8cbe0;
        }
        .option.selected {
            background: #0b2a4a0c;
            border-color: #0b2a4a;
            box-shadow: 0 0 0 1px #0b2a4a;
        }
        .option .opt-label {
            font-weight: 700;
            color: #0b2a4a;
            min-width: 28px;
            text-align: center;
        }
        .option .opt-text {
            flex: 1;
        }

        /* ---------- Action buttons ---------- */
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: auto;
            padding-top: 1.5rem;
            border-top: 2px solid #eef2f7;
        }
        .btn {
            padding: 0.7rem 1.6rem;
            border-radius: 40px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-primary {
            background: #0b2a4a;
            color: white;
        }
        .btn-primary:hover {
            background: #123b63;
        }
        .btn-warning {
            background: #f9a826;
            color: #0b2a4a;
        }
        .btn-warning:hover {
            background: #e6951a;
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid #cbd6e3;
            color: #2c3e50;
        }
        .btn-outline:hover {
            background: #f0f4fa;
            border-color: #9aaec2;
        }
        .btn-danger {
            background: #c0392b;
            color: white;
        }
        .btn-danger:hover {
            background: #a93226;
        }
        .btn-success {
            background: #1e7e34;
            color: white;
        }
        .btn-success:hover {
            background: #16642a;
        }
        .spacer {
            flex: 1;
        }

        /* ---------- Palette (right) ---------- */
        .palette-section {
            flex: 1;
            min-width: 280px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            padding: 1.8rem 1.5rem;
            display: flex;
            flex-direction: column;
            max-height: 85vh;
            overflow-y: auto;
        }
        .palette-title {
            font-weight: 700;
            color: #0b2a4a;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
        }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem 1.2rem;
            font-size: 0.75rem;
            margin-bottom: 1.5rem;
            color: #4a5c6e;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .legend-box {
            width: 16px;
            height: 16px;
            border-radius: 6px;
        }
        .palette-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.7rem;
            margin-bottom: 1.5rem;
        }
        .palette-btn {
            aspect-ratio: 1/1;
            border-radius: 10px;
            border: 2px solid transparent;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: #f0f4fa;
            color: #2c3e50;
            transition: 0.1s;
        }
        .palette-btn:hover {
            transform: scale(1.05);
            border-color: #0b2a4a44;
        }
        /* palette states */
        .palette-btn.not-visited {
            background: #eef2f7;
            color: #6b7b8c;
        }
        .palette-btn.answered {
            background: #1e7e34;
            color: white;
        }
        .palette-btn.not-answered {
            background: #c0392b;
            color: white;
        }
        .palette-btn.marked {
            background: #f9a826;
            color: #0b2a4a;
        }
        .palette-btn.answered-marked {
            background: #f9a826;
            color: #0b2a4a;
            border: 2px solid #1e7e34;
        }
        .palette-btn.current {
            border: 3px solid #0b2a4a;
            box-shadow: 0 0 0 2px #f9a826;
        }

        .palette-stats {
            font-size: 0.9rem;
            color: #2c3e50;
            border-top: 1px solid #dce5ef;
            padding-top: 1rem;
            margin-top: auto;
        }
        .palette-stats p {
            display: flex;
            justify-content: space-between;
            margin: 0.3rem 0;
        }

        /* ---------- Overlay / Result ---------- */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            z-index: 1000;
            overflow-y: auto;
        }
        .overlay.active {
            display: flex;
        }
        .result-card {
            background: white;
            border-radius: 32px;
            max-width: 1100px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem 2.5rem;
            box-shadow: 0 30px 50px rgba(0,0,0,0.4);
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #eef2f7;
            padding-bottom: 1rem;
        }
        .result-header h2 {
            color: #0b2a4a;
            font-weight: 700;
        }
        .score-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.2rem;
            background: #f8fafd;
            border-radius: 24px;
            padding: 1.8rem;
            margin-bottom: 2rem;
            border: 1px solid #dfe8f2;
        }
        .stat {
            text-align: center;
        }
        .stat .label {
            color: #4a5c6e;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .stat .value {
            font-size: 2.5rem;
            font-weight: 800;
            color: #0b2a4a;
        }
        .stat .value.small {
            font-size: 1.8rem;
        }
        .stat .value.green {
            color: #1e7e34;
        }
        .stat .value.red {
            color: #c0392b;
        }

        .review-section {
            margin-top: 2rem;
        }
        .review-item {
            border-left: 6px solid #dfe8f2;
            padding: 1rem 1.5rem;
            margin-bottom: 1rem;
            border-radius: 0 14px 14px 0;
            background: #fbfdff;
        }
        .review-item.correct {
            border-left-color: #1e7e34;
            background: #f0faf2;
        }
        .review-item.wrong {
            border-left-color: #c0392b;
            background: #fdf1f0;
        }
        .review-item.skipped {
            border-left-color: #8e9eae;
            background: #f7f9fc;
        }
        .review-q {
            font-weight: 600;
            color: #1a2b3c;
            margin-bottom: 0.6rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .review-choices {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem 2rem;
            font-size: 0.95rem;
        }
        .choice-badge {
            display: inline-block;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
        }
        .choice-badge.user-correct {
            background: #1e7e34;
            color: white;
        }
        .choice-badge.user-wrong {
            background: #c0392b;
            color: white;
        }
        .choice-badge.correct-ans {
            background: #0b2a4a;
            color: white;
        }
        .choice-badge.neutral {
            background: #dce5ef;
            color: #1a2b3c;
        }

        .download-btn {
            background: #f9a826;
            color: #0b2a4a;
            padding: 0.8rem 2rem;
            border-radius: 40px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: 0.2s;
        }
        .download-btn:hover {
            background: #e6951a;
            transform: translateY(-2px);
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
                padding: 1rem;
            }
            .palette-section {
                max-height: 400px;
            }
            .header {
                padding: 0.8rem 1rem;
                flex-direction: column;
                gap: 0.6rem;
                align-items: stretch;
            }
            .header-left {
                justify-content: space-between;
            }
            .timer {
                font-size: 1.1rem;
                padding: 0.3rem 1rem;
            }
            .result-card {
                padding: 1.5rem;
            }
            .q-text {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

<!-- ========== HEADER ========== -->
<header class="header">
    <div class="header-left">
        <div class="logo">TCS <span>iON</span></div>
        <div class="timer"><i>⏳</i> <span id="timerDisplay">120:00</span></div>
    </div>
    <div class="header-right">
        <button class="btn-outline-light" id="submitTopBtn">Submit Test</button>
    </div>
</header>

<!-- ========== MAIN ========== -->
<div class="main-container">
    <!-- Question section -->
    <div class="question-section">
        <div class="q-header">
            <span class="q-number" id="qNumberLabel">Question 1 of 120</span>
            <span class="q-status-badge" id="qStatusLabel">Not Visited</span>
        </div>
        <div class="q-text" id="questionText">Loading...</div>
        <div class="options" id="optionsContainer"></div>

        <div class="action-buttons">
            <button class="btn btn-outline" id="prevBtn">◀ Previous</button>
            <button class="btn btn-outline" id="clearBtn">Clear Response</button>
            <button class="btn btn-warning" id="markBtn">⚑ Mark for Review</button>
            <button class="btn btn-primary" id="nextBtn">Next ▶</button>
            <div class="spacer"></div>
            <button class="btn btn-danger" id="submitBottomBtn">Submit</button>
        </div>
    </div>

    <!-- Palette section -->
    <div class="palette-section">
        <div class="palette-title">
            <span>Question Palette</span>
            <span id="paletteProgress">1/120</span>
        </div>
        <div class="legend">
            <div class="legend-item"><span class="legend-box" style="background:#1e7e34;"></span> Answered</div>
            <div class="legend-item"><span class="legend-box" style="background:#c0392b;"></span> Not Answered</div>
            <div class="legend-item"><span class="legend-box" style="background:#f9a826;"></span> Marked</div>
            <div class="legend-item"><span class="legend-box" style="background:#eef2f7;"></span> Not Visited</div>
        </div>
        <div class="palette-grid" id="paletteGrid"></div>
        <div class="palette-stats">
            <p><span>Answered</span> <strong id="statAnswered">0</strong></p>
            <p><span>Not Answered</span> <strong id="statNotAnswered">0</strong></p>
            <p><span>Marked</span> <strong id="statMarked">0</strong></p>
            <p><span>Not Visited</span> <strong id="statNotVisited">120</strong></p>
        </div>
    </div>
</div>

<!-- ========== RESULT OVERLAY ========== -->
<div class="overlay" id="resultOverlay">
    <div class="result-card" id="resultCard">
        <div class="result-header">
            <h2>📋 Performance & Solutions</h2>
            <button class="download-btn" id="downloadBtn">⬇ Download Report</button>
        </div>
        <div id="resultSummary"></div>
        <div id="resultReview"></div>
        <div style="text-align: center; margin-top: 2rem;">
            <button class="btn btn-primary" id="closeOverlayBtn">Close Review</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // 1. QUESTION BANK (120 questions: 30 GK + 30 Maths + 60 Maths)
    // ============================================================
    const questions = [
        // ==================== GK (30 QUESTIONS) ====================
        // Unit-1: Current Affairs
        { text: "The G20 Leaders' Summit 2023, a major international event, was hosted by which country?", options: ["Indonesia", "Brazil", "India", "South Africa"], correct: 2 },
        { text: "Chandrayaan-3 is a historic space mission launched by ISRO to explore which celestial body?", options: ["Mars", "The Moon", "Venus", "Jupiter"], correct: 1 },
        { text: "Which country's men's team won the ICC Cricket World Cup in 2023?", options: ["India", "Australia", "England", "New Zealand"], correct: 1 },
        { text: "Who among the following is the current Secretary-General of the United Nations?", options: ["Ban Ki-moon", "Kofi Annan", "António Guterres", "Tedros Adhanom Ghebreyesus"], correct: 2 },
        { text: "The BRICS group of nations recently expanded. Which of the following was NOT an original member before South Africa joined in 2010?", options: ["Brazil", "Russia", "India", "South Africa"], correct: 3 },
        // Unit-2: Teaching and Research Aptitude
        { text: "Which of the following is considered a learner-centered teaching method?", options: ["Lecture method", "Demonstration method", "Team teaching", "Project work"], correct: 3 },
        { text: "A \"null hypothesis\" in research typically posits that:", options: ["There is a significant difference between two variables", "The researcher's prediction is perfectly accurate", "There is no significant relationship or difference between variables", "The research design is flawed"], correct: 2 },
        { text: "A researcher distributes a structured questionnaire to 500 college students to gather their opinions. This is a method of collecting:", options: ["Secondary data", "Primary data", "Historical data", "Tertiary data"], correct: 1 },
        { text: "The core mandate of the University Grants Commission (UGC) in India is:", options: ["Conducting school board examinations", "Regulating secondary education", "Coordination, determination, and maintenance of standards of university education", "Managing elementary school funding"], correct: 2 },
        { text: "Summative evaluation is best described as an assessment that takes place:", options: ["Continuously during the learning process", "Before a course begins to check baseline knowledge", "At the end of a course or program to measure overall achievement", "Whenever a student asks a question in class"], correct: 2 },
        // Unit-3: ICT
        { text: "In computer terminology, what does RAM stand for?", options: ["Read Access Memory", "Random Access Memory", "Rapid Action Memory", "Readable Applied Memory"], correct: 1 },
        { text: "What is the full form of MOOC, a significant development in online education?", options: ["Massive Open Online Course", "Multiple Online Open Classes", "Modern Online Operating Computer", "Main Objective Online Course"], correct: 0 },
        { text: "When writing an email, where do deleted messages temporarily go before being permanently erased?", options: ["Drafts", "Spam", "Outbox", "Trash/Bin"], correct: 3 },
        { text: "Which of the following is an example of a web browser?", options: ["Google Chrome", "Windows 11", "Microsoft Word", "Python"], correct: 0 },
        { text: "1 Gigabyte (GB) of digital storage is equal to:", options: ["1024 Bytes", "1024 Kilobytes (KB)", "1024 Megabytes (MB)", "1024 Terabytes (TB)"], correct: 2 },
        // Unit-4: People and Environment
        { text: "The international agreement known as the Kyoto Protocol was primarily adopted to:", options: ["Protect endangered flora and fauna", "Reduce greenhouse gas emissions", "Regulate international maritime trade", "Ban plastic pollution in oceans"], correct: 1 },
        { text: "Minamata disease, a severe neurological syndrome, is caused by severe poisoning from:", options: ["Lead", "Cadmium", "Arsenic", "Mercury"], correct: 3 },
        { text: "Who is credited with first coining the term \"ecosystem\" in 1935?", options: ["Charles Darwin", "A.G. Tansley", "Ernst Haeckel", "Rachel Carson"], correct: 1 },
        { text: "The headquarters of the United Nations Environment Programme (UNEP) is located in:", options: ["Geneva, Switzerland", "New York, USA", "Nairobi, Kenya", "Paris, France"], correct: 2 },
        { text: "Which of the following is considered a renewable source of energy?", options: ["Coal", "Natural Gas", "Petroleum", "Wind power"], correct: 3 },
        // Unit-5: Indian History and Geography
        { text: "The famous slogan \"Swaraj is my birthright and I shall have it\" was coined by:", options: ["Mahatma Gandhi", "Jawaharlal Nehru", "Subhas Chandra Bose", "Bal Gangadhar Tilak"], correct: 3 },
        { text: "The highest mountain peak in the Western Ghats (and South India) is:", options: ["Doddabetta", "Anamudi", "Mahendragiri", "Kodaikanal"], correct: 1 },
        { text: "The Ajanta Caves, renowned for their ancient mural paintings, are predominantly associated with which religion?", options: ["Hinduism", "Jainism", "Buddhism", "Sikhism"], correct: 2 },
        { text: "The main asteroid belt in our solar system is located between the orbits of which two planets?", options: ["Earth and Mars", "Mars and Jupiter", "Jupiter and Saturn", "Venus and Earth"], correct: 1 },
        { text: "The tragic Jallianwala Bagh massacre occurred in Amritsar in which year?", options: ["1905", "1919", "1922", "1930"], correct: 1 },
        // Unit-6: Indian Constitution and Economy
        { text: "In the Indian Constitution, the 'Right to Equality' is guaranteed under which cluster of Articles?", options: ["Articles 12-13", "Articles 14-18", "Articles 19-22", "Articles 23-24"], correct: 1 },
        { text: "Which institution is responsible for formulating and implementing the monetary policy in India?", options: ["State Bank of India (SBI)", "Ministry of Finance", "NITI Aayog", "Reserve Bank of India (RBI)"], correct: 3 },
        { text: "The Chief Election Commissioner of India holds office for a term of:", options: ["5 years or up to 60 years of age", "6 years or up to 65 years of age", "4 years or up to 62 years of age", "During the pleasure of the President"], correct: 1 },
        { text: "In the Indian bicameral parliamentary system, the Rajya Sabha is also known as the:", options: ["House of the People", "Legislative Assembly", "Council of States", "Lower House"], correct: 2 },
        { text: "In 2015, the Government of India replaced the Planning Commission with a new policy think tank called:", options: ["National Development Council", "Finance Commission", "NITI Aayog", "NAFED"], correct: 2 },

        // ==================== MATHS Q1–Q30 (from second file) ====================
        { text: "The condition that the straight line \\(\\frac{l}{r} = A\\cos \\theta +B\\sin \\theta\\) may touch the circle \\(r = 2a\\cos \\theta\\) is", options: ["\\(B^{2}a^{2} + A^{2}a^{2} = 1\\)", "\\(B^{2}a^{2} - A^{2}a^{2} = 1\\)", "\\(B^{2}a^{2} - 2Ala = 1\\)", "\\(B^{2}a^{2} + 2Ala = 1\\)"], correct: 3 },
        { text: "The polar equation of the parabola is equal to", options: ["\\(r = l\\sec^{2}\\frac{\\theta}{2}\\)", "\\(r = \\frac{1}{2}\\sec^{2}\\frac{\\theta}{2}\\)", "\\(r = \\sec^{2}\\frac{\\theta}{2}\\)", "\\(r = 2a\\sec^{2}\\frac{\\theta}{2}\\)"], correct: 0 },
        { text: "The \\(PSP^{\\prime}\\) is a chord of a conic \\(\\frac{l}{r} = 1 + e\\cos \\theta\\), whose focus is \\(S\\) and semi latus rectum is \\(l\\), then \\(\\frac{1}{SP} +\\frac{1}{SP^{\\prime}}\\) is equal to", options: ["\\(\\frac{1}{2l}\\)", "\\(\\frac{1}{l}\\)", "\\(\\frac{2}{l}\\)", "\\(\\frac{4}{l}\\)"], correct: 2 },

        { text: "Two spheres of radii \\(r_1\\) and \\(r_2\\) cut orthogonally, then the radius of their common circle is", options: ["\\(\\frac{r_1r_2}{\\sqrt{r_1^2 + r_2^2}}\\)", "\\(\\frac{r_1 + r_2}{\\sqrt{r_1^2 + r_2^2}}\\)", "\\(\\frac{r_1r_2}{r_1^2 + r_2^2}\\)", "\\(\\frac{2r_1r_2}{\\sqrt{r_1^2 + r_2^2}}\\)"], correct: 0 },

        { text: "If \\(d\\) be the distance between the centres of two spheres of radii \\(r_1\\) and \\(r_2\\), then the angle between them is equal to", options: ["\\(\\cos^{-1}\\left(\\frac{r_1^2 + r_2^2 - d^2}{2r_1r_2}\\right)\\)", "\\(\\cos^{-1}\\left(\\frac{r_1^2 + r_2^2 + d^2}{2r_1r_2}\\right)\\)", "\\(\\cos^{-1}\\left(\\frac{r_1^2 - r_2^2 - d^2}{2r_1r_2}\\right)\\)", "\\(\\sin^{-1}\\left(\\frac{r_1^2 + r_2^2 - d^2}{2r_1r_2}\\right)\\)"], correct: 0 },
        { text: "The equation of the cone generated by the line passing through \\((\\alpha,\\beta,\\gamma)\\) and intersecting the parabola \\(z^2 = 4ax, y = 0\\) is", options: ["\\((\\beta z - \\gamma y)^2 = a(\\beta -y)(\\beta x - \\alpha y)\\)", "\\((\\beta z - \\gamma y)^2 = 2a(\\beta +y)(\\beta x - \\alpha y)\\)", "\\((\\beta z - \\gamma y)^3 = 4a(\\beta -y)(\\beta x - \\alpha y)\\)", "\\((\\beta z - \\gamma y)^2 = 2a(\\beta -y)(\\beta x - \\alpha y)\\)"], correct: 2 },
        { text: "The vertex of the cone \\(4x^2 - y^2 + 2z^2 + 2xy - 3yz + 12x - 11y + 6z + 4 = 0\\) is", options: ["\\((-1, -2,3)\\)", "\\((-1, -2, -3)\\)", "\\((1, -2, -3)\\)", "\\((-1,2, -3)\\)"], correct: 1 },
        { text: "The equation of the cylinder whose generators are parallel to z-axis, and whose guiding curve is \\(x^2 + y^2 + z^2 = 1; x + y + z = 1\\), will be", options: ["\\(x^2 +y^2 +xy - x - y = 0\\)", "\\(x^2 +y^2 +xy + x + y = 0\\)", "\\(x^2 +y^2 -xy - x - y = 0\\)", "\\(x^2 +y^2 -xy + x + y = 0\\)"], correct: 0 },

        { text: "The locus of the centres of the sections of \\(ax^2 + by^2 + cz^2 = 1\\), which touches \\(\\alpha x^2 + \\beta y^2 + \\gamma z^2 = 1\\), will be", options: ["\\(\\frac{a^2x^2}{\\alpha} + \\frac{b^2y^2}{\\beta} + \\frac{c^2z^2}{\\gamma} = (ax^2 + by^2 + cz^2)^2\\)", "\\(\\frac{a^2x^2}{\\alpha} + \\frac{b^2y^2}{\\beta} + \\frac{c^2z^2}{\\gamma} = \\frac{1}{2}(ax^2 + by^2 + cz^2)^2\\)", "\\(\\frac{ax}{\\alpha} + \\frac{by}{\\beta} + \\frac{cz}{\\gamma} = (ax^2 + by^2 + cz^2)^2\\)", "\\(\\frac{ax}{\\alpha} + \\frac{by}{\\beta} + \\frac{cz}{\\gamma} = (a^2x^2 + b^2y^2 + c^2z^2)\\)"], correct: 0 },
        { text: "The tangent planes to the ellipsoid \\(\\frac{x^2}{a^2} + \\frac{y^2}{b^2} + \\frac{z^2}{c^2} = 1\\) meets the co-ordinate axes at points A, B and C, then the locus of the centroid of the triangle ABC will be", options: ["\\(\\frac{a^2}{x^2} + \\frac{b^2}{y^2} + \\frac{c^2}{z^2} = 3\\)", "\\(\\left(\\frac{a}{x}\\right)^2 + \\left(\\frac{b}{y}\\right)^2 + \\left(\\frac{c}{z}\\right)^2 = 3\\)", "\\(\\frac{a^2}{x^2} + \\frac{b^2}{y^2} + \\frac{c^2}{z^2} = 9\\)", "\\(\\frac{a^2}{x^2} + \\frac{b^2}{y^2} + \\frac{c^2}{z^2} = 1\\)"], correct: 2 },

        { text: "The locus of the point of intersection of three mutually perpendicular tangent planes to a central conicoid \\(ax^{2} + by^{2} + cz^{2} = 1\\) is", options: ["\\(x^{2} + y^{2} + z^{2} = 1 + \\frac{1}{a} +\\frac{1}{b} +\\frac{1}{c}\\)", "\\(x^{2} + y^{2} + z^{2} = a + b + c\\)", "\\(x^{2} + y^{2} + z^{2} = \\frac{1}{a} +\\frac{1}{b} +\\frac{1}{c}\\)", "\\(x^{2} + y^{2} + z^{2} = (a + b + c)^{2}\\)"], correct: 2 },
        { text: "If \\(\\vec{r} = r\\hat{r}\\), where \\(\\hat{r}\\) is a unit vector, then \\(\\int \\vec{r}\\times \\frac{d\\vec{r}}{dt} dt\\) is equal to", options: ["\\(\\int r^{2}\\left(\\hat{r}\\times \\frac{d\\hat{r}}{dt}\\right)dt\\)", "\\(\\int \\left(\\hat{r}\\times \\frac{d\\hat{r}}{dt}\\right)dt\\)", "\\(\\left(\\hat{r}\\times \\frac{d\\hat{r}}{dt}\\right)dt\\)", "\\(\\int r\\left(\\hat{r}\\times \\frac{d\\hat{r}}{dt}\\right)dt\\)"], correct: 0 },

        { text: "If \\(\\vec{a}\\) is a constant vector and \\(\\vec{r}\\) is a position vector, then \\(\\operatorname{curl}(\\vec{a}\\times\\vec{r})\\) is equal to", options: ["\\(0\\)", "\\(\\vec{a}\\)", "\\(2\\vec{a}\\)", "\\(\\vec{r}\\)"], correct: 2 },

        { text: "If \\(S\\) is the curved surface of the cylinder \\(x^2 + y^2 = a^2, 0 \\leq z \\leq b\\), then \\(\\iint_{S}\\vec{r}\\cdot d\\vec{S}\\) is equal to", options: ["\\(2\\pi ab\\)", "\\(2\\pi a^2b\\)", "\\(\\pi a^2b\\)", "\\(\\pi ab\\)"], correct: 1 },

    // ============================================================
    // 2. STATE
    // ============================================================
    const TOTAL = questions.length; // 120
    let currentIndex = 0;
    let userAnswers = new Array(TOTAL).fill(null);
    let marked = new Array(TOTAL).fill(false);
    let visited = new Array(TOTAL).fill(false);

    let timerInterval = null;
    let timeLeft = 120 * 60; // 120 minutes
    let testSubmitted = false;

    // ============================================================
    // 3. DOM ELEMENTS
    // ============================================================
    const qNumberLabel = document.getElementById('qNumberLabel');
    const qStatusLabel = document.getElementById('qStatusLabel');
    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const clearBtn = document.getElementById('clearBtn');
    const markBtn = document.getElementById('markBtn');
    const submitTopBtn = document.getElementById('submitTopBtn');
    const submitBottomBtn = document.getElementById('submitBottomBtn');
    const timerDisplay = document.getElementById('timerDisplay');
    const paletteGrid = document.getElementById('paletteGrid');
    const paletteProgress = document.getElementById('paletteProgress');
    const statAnswered = document.getElementById('statAnswered');
    const statNotAnswered = document.getElementById('statNotAnswered');
    const statMarked = document.getElementById('statMarked');
    const statNotVisited = document.getElementById('statNotVisited');
    const resultOverlay = document.getElementById('resultOverlay');
    const resultSummary = document.getElementById('resultSummary');
    const resultReview = document.getElementById('resultReview');
    const closeOverlayBtn = document.getElementById('closeOverlayBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    // ============================================================
    // 4. RENDER
    // ============================================================
    function renderQuestion() {
        if (testSubmitted) return;
        const q = questions[currentIndex];
        qNumberLabel.textContent = `Question ${currentIndex + 1} of ${TOTAL}`;

        let status = 'Not Visited';
        if (visited[currentIndex]) {
            if (userAnswers[currentIndex] !== null) status = 'Answered';
            else status = 'Not Answered';
            if (marked[currentIndex]) status = 'Marked for Review';
            if (userAnswers[currentIndex] !== null && marked[currentIndex]) status = 'Answered & Marked';
        }
        qStatusLabel.textContent = status;

        questionText.innerHTML = q.text;
        optionsContainer.innerHTML = '';
        const letters = ['A', 'B', 'C', 'D'];
        q.options.forEach((opt, idx) => {
            const div = document.createElement('div');
            div.className = 'option' + (userAnswers[currentIndex] === idx ? ' selected' : '');
            div.innerHTML = `<span class="opt-label">${letters[idx]}</span><span class="opt-text">${opt}</span>`;
            div.addEventListener('click', () => selectOption(idx));
            optionsContainer.appendChild(div);
        });

        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise([questionText, optionsContainer]).catch(() => {});
        }

        if (!visited[currentIndex]) visited[currentIndex] = true;
        updatePalette();
        updateNavButtons();
    }

    function selectOption(idx) {
        if (testSubmitted) return;
        if (userAnswers[currentIndex] === idx) userAnswers[currentIndex] = null;
        else userAnswers[currentIndex] = idx;
        renderQuestion();
    }

    function clearResponse() {
        if (testSubmitted) return;
        userAnswers[currentIndex] = null;
        renderQuestion();
    }

    function toggleMark() {
        if (testSubmitted) return;
        marked[currentIndex] = !marked[currentIndex];
        renderQuestion();
    }

    function goPrev() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }
    function goNext() { if (currentIndex < TOTAL - 1) { currentIndex++; renderQuestion(); } }
    function goToQuestion(idx) { if (idx >= 0 && idx < TOTAL) { currentIndex = idx; renderQuestion(); } }

    function updateNavButtons() {
        prevBtn.disabled = currentIndex === 0;
        nextBtn.disabled = currentIndex === TOTAL - 1;
        prevBtn.style.opacity = prevBtn.disabled ? 0.5 : 1;
        nextBtn.style.opacity = nextBtn.disabled ? 0.5 : 1;
    }

    // ============================================================
    // 5. PALETTE
    // ============================================================
    function buildPalette() {
        paletteGrid.innerHTML = '';
        for (let i = 0; i < TOTAL; i++) {
            const btn = document.createElement('button');
            btn.className = 'palette-btn';
            btn.textContent = i + 1;
            btn.addEventListener('click', () => goToQuestion(i));
            paletteGrid.appendChild(btn);
        }
    }

    function updatePalette() {
        const buttons = paletteGrid.querySelectorAll('.palette-btn');
        let answeredCount = 0, notAnsweredCount = 0, markedCount = 0, notVisitedCount = 0;

        buttons.forEach((btn, i) => {
            btn.classList.remove('not-visited', 'answered', 'not-answered', 'marked', 'answered-marked', 'current');
            const isAnswered = userAnswers[i] !== null;
            const isMarked = marked[i];
            const isVisited = visited[i];

            if (!isVisited) { btn.classList.add('not-visited'); notVisitedCount++; }
            else if (isAnswered && isMarked) { btn.classList.add('answered-marked'); answeredCount++; markedCount++; }
            else if (isAnswered) { btn.classList.add('answered'); answeredCount++; }
            else if (isMarked) { btn.classList.add('marked'); markedCount++; }
            else if (isVisited) { btn.classList.add('not-answered'); notAnsweredCount++; }

            if (i === currentIndex) btn.classList.add('current');
        });

        statAnswered.textContent = answeredCount;
        statNotAnswered.textContent = notAnsweredCount;
        statMarked.textContent = markedCount;
        statNotVisited.textContent = notVisitedCount;
        paletteProgress.textContent = `${currentIndex + 1}/${TOTAL}`;
    }

    // ============================================================
    // 6. TIMER
    // ============================================================
    function startTimer() {
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) { clearInterval(timerInterval); autoSubmit(); }
        }, 1000);
    }

    function updateTimerDisplay() {
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        if (timeLeft < 300) timerDisplay.style.color = '#ff6b6b';
    }

    function autoSubmit() {
        if (!testSubmitted) {
            alert('⏰ Time is up! The test will be submitted automatically.');
            submitTest();
        }
    }

    // ============================================================
    // 7. SUBMIT & RESULT
    // ============================================================
    function submitTest() {
        if (testSubmitted) return;
        testSubmitted = true;
        clearInterval(timerInterval);

        let correct = 0, wrong = 0, skipped = 0;
        const details = [];
        for (let i = 0; i < TOTAL; i++) {
            const ua = userAnswers[i];
            const ca = questions[i].correct;
            let status;
            if (ua === null) { skipped++; status = 'skipped'; }
            else if (ua === ca) { correct++; status = 'correct'; }
            else { wrong++; status = 'wrong'; }
            details.push({ index: i, userAnswer: ua, correctAnswer: ca, status });
        }

        const score = correct * 3 - wrong * 1;
        const attempted = correct + wrong;
        const accuracy = attempted > 0 ? ((correct / attempted) * 100).toFixed(1) : '0.0';

        resultSummary.innerHTML = `
            <div class="score-summary">
                <div class="stat"><div class="label">Score</div><div class="value ${score >= 0 ? 'green' : 'red'}">${score}</div></div>
                <div class="stat"><div class="label">Correct</div><div class="value green">${correct}</div></div>
                <div class="stat"><div class="label">Wrong</div><div class="value red">${wrong}</div></div>
                <div class="stat"><div class="label">Skipped</div><div class="value">${skipped}</div></div>
                <div class="stat"><div class="label">Accuracy</div><div class="value small">${accuracy}%</div></div>
                <div class="stat"><div class="label">Total</div><div class="value small">${TOTAL}</div></div>
            </div>
        `;

        const letters = ['A', 'B', 'C', 'D'];
        let reviewHTML = '<div class="review-section"><h3 style="color:#0b2a4a; margin-bottom:1rem;">📝 Solution Review</h3>';
        details.forEach((d, i) => {
            const q = questions[i];
            const userChoiceText = d.userAnswer !== null ? `${letters[d.userAnswer]}. ${q.options[d.userAnswer]}` : 'Not Attempted';
            const correctChoiceText = `${letters[d.correctAnswer]}. ${q.options[d.correctAnswer]}`;
            let badgeClass = d.status === 'correct' ? 'user-correct' : d.status === 'wrong' ? 'user-wrong' : 'neutral';
            let statusIcon = d.status === 'correct' ? '✅' : d.status === 'wrong' ? '❌' : '⏭️';

            reviewHTML += `
                <div class="review-item ${d.status}">
                    <div class="review-q">
                        <span>${statusIcon} <strong>Q${i + 1}.</strong> ${q.text}</span>
                    </div>
                    <div class="review-choices">
                        <span>Your answer: <span class="choice-badge ${badgeClass}">${userChoiceText}</span></span>
                        <span>Correct answer: <span class="choice-badge correct-ans">${correctChoiceText}</span></span>
                    </div>
                </div>
            `;
        });
        reviewHTML += '</div>';
        resultReview.innerHTML = reviewHTML;

        resultOverlay.classList.add('active');
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise([resultSummary, resultReview]).catch(() => {});
        }
    }

    // ============================================================

        details.forEach((d, i) => {
            const q = questions[i];
            const userText = d.userAnswer !== null ? `${letters[d.userAnswer]}. ${q.options[d.userAnswer]}` : 'Not Attempted';
            const correctText = `${letters[d.correctAnswer]}. ${q.options[d.correctAnswer]}`;
            const cls = d.status.toLowerCase();
            const badge = d.status === 'Correct' ? 'user-correct' : d.status === 'Wrong' ? 'user-wrong' : 'neutral';
            html += `<div class="review-item ${cls}">
                <div class="q-text">Q${i + 1}. ${q.text}</div>
                <div>Your answer: <span class="choice-badge ${badge}">${userText}</span></div>
                <div>Correct answer: <span class="choice-badge correct-ans">${correctText}</span></div>
            </div>`;
        });

        html += `</body></html>`;
        const blob = new Blob([html], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'TCS_iON_Test_Report.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
