<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form · Send to Email</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }
    body {
      background: linear-gradient(145deg, #f6f9fc 0%, #e9f1f8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      width: 100%;
      max-width: 560px;
      padding: 2.25rem 2rem;
      border-radius: 2rem;
      box-shadow: 0 25px 40px -12px rgba(0, 20, 40, 0.25),
                  inset 0 1px 2px rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.5);
      transition: transform 0.2s;
    }
    .card:hover {
      transform: scale(1.005);
    }
    h1 {
      font-size: 2rem;
      font-weight: 600;
      color: #0b2a3c;
      margin-bottom: 0.35rem;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    h1 span {
      background: #1e6f9f;
      color: white;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.2rem 0.7rem;
      border-radius: 40px;
      letter-spacing: 0.3px;
    }
    .subhead {
      color: #4c6b7e;
      font-size: 0.95rem;
      margin-bottom: 2rem;
      border-left: 4px solid #1e6f9f;
      padding-left: 1rem;
      background: rgba(30, 111, 159, 0.06);
      border-radius: 0 12px 12px 0;
      line-height: 1.4;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      font-weight: 500;
      font-size: 0.9rem;
      color: #1a4056;
      margin-bottom: 0.5rem;
      letter-spacing: 0.2px;
    }
    label i {
      font-style: normal;
      color: #1e6f9f;
      font-weight: 600;
      margin-right: 4px;
    }
    input, select {
      width: 100%;
      padding: 0.85rem 1.2rem;
      font-size: 1rem;
      background: #ffffff;
      border: 1.5px solid #cbdae6;
      border-radius: 14px;
      outline: none;
      transition: all 0.2s;
      color: #0b2a3c;
      font-weight: 450;
    }
    input:focus, select:focus {
      border-color: #1e6f9f;
      box-shadow: 0 0 0 4px rgba(30, 111, 159, 0.15);
      background: #fefefe;
    }
    .flex-row {
      display: flex;
      gap: 1rem;
      align-items: flex-end;
    }
    .flex-row .form-group {
      flex: 1;
      margin-bottom: 0;
    }
    .radio-group {
      display: flex;
      gap: 1.8rem;
      align-items: center;
      padding: 0.2rem 0 0.4rem;
    }
    .radio-group label {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-weight: 450;
      color: #1a4056;
      margin-bottom: 0;
      cursor: pointer;
    }
    .radio-group input[type="radio"] {
      width: auto;
      accent-color: #1e6f9f;
      transform: scale(1.1);
      margin-right: 2px;
    }
    .age-section, .dob-section {
      transition: opacity 0.2s;
    }
    .hidden {
      display: none !important;
    }
    .hint {
      font-size: 0.8rem;
      color: #668197;
      margin-top: 0.3rem;
      margin-left: 0.2rem;
    }
    button {
      width: 100%;
      background: #0b2a3c;
      color: white;
      font-weight: 600;
      font-size: 1.1rem;
      padding: 1rem 1.5rem;
      border: none;
      border-radius: 14px;
      margin-top: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 12px 18px -8px rgba(11, 42, 60, 0.3);
      letter-spacing: 0.3px;
    }
    button:hover {
      background: #1e4b66;
      box-shadow: 0 16px 22px -8px rgba(11, 42, 60, 0.4);
    }
    button:active {
      transform: scale(0.98);
      background: #0a1f2e;
    }
    .email-note {
      text-align: center;
      font-size: 0.8rem;
      color: #668197;
      margin-top: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      background: #e2edf6;
      padding: 0.6rem 1rem;
      border-radius: 50px;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }
    .email-note strong {
      color: #0b2a3c;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>
      📬 Contact form
      <span>→ email</span>
    </h1>
    <div class="subhead">
      Fill in your details — the information will be sent to <strong>pranjalhrcdu@gmail.com</strong>
    </div>

    <!-- 
      Using FormSubmit.co to forward the form data to the specified email.
      No backend required. For production, please verify your email with FormSubmit.
    -->
    <form action="https://formsubmit.co/pranjalhrcdu@gmail.com" method="POST">
      <!-- Disable captcha and set a nice subject -->
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_subject" value="New form submission from website">
      
      <!-- Name field -->
      <div class="form-group">
        <label><i>👤</i> Full name</label>
        <input type="text" name="name" placeholder="e.g. Pranjal Sharma" required>
      </div>

      <!-- Age / DOB selector (radio + dynamic inputs) -->
      <div class="form-group">
        <label><i>🎂</i> Age or Date of Birth</label>
        <div class="radio-group">
          <label>
            <input type="radio" name="age_or_dob" value="age" id="radioAge" checked> Age
          </label>
          <label>
            <input type="radio" name="age_or_dob" value="dob" id="radioDob"> Date of Birth
          </label>
        </div>
      </div>

      <!-- Age input (visible by default) -->
      <div id="ageField" class="form-group age-section">
        <label><i>🔢</i> Your age</label>
        <input type="number" name="age" id="ageInput" placeholder="e.g. 28" min="1" max="120" step="1" value="">
      </div>

      <!-- DOB input (hidden by default) -->
      <div id="dobField" class="form-group dob-section hidden">
        <label><i>📅</i> Date of birth</label>
        <input type="date" name="dob" id="dobInput" value="">
        <div class="hint">Select your birth date</div>
      </div>

      <!-- Father's name -->
      <div class="form-group">
        <label><i>👨‍👦</i> Father's name</label>
        <input type="text" name="father_name" placeholder="e.g. Rajesh Sharma" required>
      </div>

      <!-- Hidden field to indicate which option was chosen (age/dob) — will be included automatically as name="age_or_dob" via radio, but we also want the value. Already present via radio. Good. -->

      <!-- Submit button -->
      <button type="submit">
        ✉️ Send information
      </button>

      <div class="email-note">
        <span>📨</span> Delivered to <strong>pranjalhrcdu@gmail.com</strong>
      </div>
    </form>
  </div>

  <script>
    (function() {
      const radioAge = document.getElementById('radioAge');
      const radioDob = document.getElementById('radioDob');
      const ageField = document.getElementById('ageField');
      const dobField = document.getElementById('dobField');
      const ageInput = document.getElementById('ageInput');
      const dobInput = document.getElementById('dobInput');

      // Function to update visibility and required attributes based on selected radio
      function updateForm() {
        if (radioAge.checked) {
          // Age selected: show age, hide DOB
          ageField.classList.remove('hidden');
          dobField.classList.add('hidden');
          // Make age input required, remove required from DOB
          ageInput.required = true;
          dobInput.required = false;
          // Clear DOB value (optional, but prevents sending both)
          dobInput.value = '';
          // Also ensure dob name attribute doesn't interfere: but we keep it, but value empty -> FormSubmit may send empty.
          // Better: we can disable dob input when hidden to avoid sending it.
          dobInput.disabled = true;
          ageInput.disabled = false;
        } else {
          // DOB selected: show DOB, hide age
          ageField.classList.add('hidden');
          dobField.classList.remove('hidden');
          ageInput.required = false;
          dobInput.required = true;
          // Clear age value
          ageInput.value = '';
          // Disable age input to avoid sending age field
          ageInput.disabled = true;
          dobInput.disabled = false;
        }
      }

      // Initial call: set default (Age selected in HTML)
      // But also sync with radio state: radioAge is checked from start
      // However, to ensure consistency we call updateForm
      updateForm();

      // Add event listeners to radio buttons
      radioAge.addEventListener('change', updateForm);
      radioDob.addEventListener('change', updateForm);

      // Additional: ensure that when disabled, no value is sent. 
      // Also, when age is selected and user types age, that's fine.
      // For DOB: we also want to clear age input if they switch to DOB and back? Not necessary.
      // But if user fills age, then switches to DOB, age is cleared and disabled. That's fine.

      // Edge: if user selects DOB, fills date, then switches back to age, dob input will be disabled and cleared.
      // The DOB value is cleared when switching to age (in updateForm). Good.

      // Also make sure that on page load, if DOB radio had been checked by browser (e.g. back button), 
      // we sync correctly. But updateForm runs on load.

      // Also, if someone selects DOB, then manually re-selects Age, age field becomes required and visible.
      // Form validation will work.

      // For extra clarity: when DOB is selected and date is required, but we also want to enforce that if DOB is selected
      // but empty, the browser will block submit due to required.

      // Also, if age is selected and empty, required blocks.

      // One small issue: the radio group name="age_or_dob" will be sent with value 'age' or 'dob'. 
      // That's perfect to know which method was used. 
      // The hidden fields (disabled inputs) won't be submitted.

      // Also, to prevent DOB field from sending empty value when age is selected, we disabled it.
      // Similarly, age field disabled when dob is selected. Good.

      // Additional: what if user selects DOB, but doesn't pick a date? The required attribute on date input works.
      // Also, for age input, we set required dynamically. Good.

      // We also want to make sure the initial state matches the radio checked. 
      // Radio "Age" is checked in HTML, so updateForm sets age visible, required, enabled; dob hidden, disabled.
      // Perfect.

      // But note: when the form is submitted, disabled fields are not sent. So no problem.
      // Also, the radio button sends "age" or "dob" as part of form data.

      // For safety, we could also clear the value of the hidden field, but updateForm already clears the inactive one.
    })();
  </script>

  <!-- 
    Note: FormSubmit.co requires first-time activation. 
    After the first submission, you'll receive a confirmation email at pranjalhrcdu@gmail.com.
    Click the activation link to start receiving submissions.
    This is a free service and works without any backend.
  -->
</body>
</html>
