        startTimer();
        attachEvents();
        updateAnsweredCount();
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (testSubmitted) return;
            timeLeft--;
            updateTimerDisplay();
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                autoSubmit();
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        if (timeLeft < 300) timerDisplay.style.color = '#ef4444';
        else timerDisplay.style.color = '#facc15';
    }

    // ============================================================
    // 4. RENDER QUESTION
    // ============================================================
    function loadQuestion(index) {
        if (index < 0 || index >= totalQuestions) return;
        currentIndex = index;
        const q = questions[index];

        // Mark visited
        if (!visited[index]) visited[index] = true;

        // Counter
        qCounter.textContent = `Question ${index + 1} of ${totalQuestions}`;

        // Status badge
        if (marked[index]) qStatusBadge.textContent = '🔶 Marked for review';
        else if (userAnswers[index] !== null) qStatusBadge.textContent = '✅ Answered';
        else qStatusBadge.textContent = '⬜ Not answered';

        // Question text (LaTeX)
        questionText.innerHTML = q.q;

        // Options
        optionsContainer.innerHTML = '';
        q.options.forEach((opt, optIdx) => {
            const div = document.createElement('div');
            div.className = 'option' + (userAnswers[index] === optIdx ? ' selected' : '');
            div.dataset.optIndex = optIdx;
            div.innerHTML = `<span class="option-prefix">${String.fromCharCode(65 + optIdx)}.</span> <span>${opt}</span>`;
            div.addEventListener('click', (e) => {
                e.stopPropagation();
                selectOption(optIdx);
            });
            optionsContainer.appendChild(div);
        });

        // Re-render MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise([questionText, optionsContainer]).catch(() => {});
        }

        // Update palette
        updatePalette();
        updateNavButtons();
    }

    function selectOption(optIdx) {
        if (testSubmitted) return;
        if (userAnswers[currentIndex] === optIdx) {
            // Deselect
            userAnswers[currentIndex] = null;
        } else {
            userAnswers[currentIndex] = optIdx;
        }
        // Re-render options
        const options = optionsContainer.children;
        for (let i = 0; i < options.length; i++) {
            options[i].classList.toggle('selected', userAnswers[currentIndex] === i);
        }
        // Update status badge & palette
        updateStatusBadge();
        updatePalette();
        updateAnsweredCount();
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise([optionsContainer]).catch(() => {});
        }
    }

    function updateStatusBadge() {
        if (marked[currentIndex]) qStatusBadge.textContent = '🔶 Marked for review';
        else if (userAnswers[currentIndex] !== null) qStatusBadge.textContent = '✅ Answered';
        else qStatusBadge.textContent = '⬜ Not answered';
    }

    // ============================================================
    // 5. PALETTE
    // ============================================================
    function renderPalette() {
        paletteGrid.innerHTML = '';
        for (let i = 0; i < totalQuestions; i++) {
            const btn = document.createElement('button');
            btn.className = 'palette-btn';
            btn.textContent = i + 1;
            btn.dataset.index = i;
            btn.addEventListener('click', () => {
                loadQuestion(i);
                updatePalette();
            });
            paletteGrid.appendChild(btn);
        }
    }

    function updatePalette() {
        const btns = paletteGrid.children;
        for (let i = 0; i < totalQuestions; i++) {
            const btn = btns[i];
            btn.className = 'palette-btn';
            if (i === currentIndex) btn.classList.add('current');
            if (marked[i]) btn.classList.add('marked');
            else if (userAnswers[i] !== null) btn.classList.add('answered');
            else if (visited[i]) btn.classList.add('not-answered');
            else btn.classList.add('not-visited');
        }
    }

    function updateAnsweredCount() {
        const count = userAnswers.filter(a => a !== null).length;
        answeredCount.textContent = `${count}/${totalQuestions}`;
    }

    // ============================================================
    // 6. NAVIGATION
    // ============================================================
    function updateNavButtons() {
        prevBtn.disabled = currentIndex === 0;
        nextBtn.disabled = currentIndex === totalQuestions - 1;
    }

    function attachEvents() {
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) loadQuestion(currentIndex - 1);
            updatePalette();
        });
        nextBtn.addEventListener('click', () => {
            if (currentIndex < totalQuestions - 1) loadQuestion(currentIndex + 1);
            updatePalette();
        });
        clearBtn.addEventListener('click', () => {
            if (testSubmitted) return;
            userAnswers[currentIndex] = null;
            const options = optionsContainer.children;
            for (let i = 0; i < options.length; i++) options[i].classList.remove('selected');
            updateStatusBadge();
            updatePalette();
            updateAnsweredCount();
        });
        markBtn.addEventListener('click', () => {
            if (testSubmitted) return;
            marked[currentIndex] = !marked[currentIndex];
            updateStatusBadge();
            updatePalette();
        });
        submitBtn.addEventListener('click', () => {
            if (testSubmitted) return;
            if (confirm('Are you sure you want to submit the test?')) {
                submitTest();
            }
        });
        closeOverlayBtn.addEventListener('click', () => {
            resultOverlay.classList.remove('active');
        });
        downloadReportBtn.addEventListener('click', downloadReport);
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderReview(btn.dataset.filter);
            });
        });
    }

    // ============================================================
    // 7. SUBMIT & SCORE
    // ============================================================
    function autoSubmit() {
        if (testSubmitted) return;
        alert('⏰ Time is up! Auto-submitting.');
        submitTest();
    }

    function submitTest() {
        if (testSubmitted) return;
        testSubmitted = true;
        clearInterval(timerInterval);
        let correct = 0, incorrect = 0, unattempted = 0;
        for (let i = 0; i < totalQuestions; i++) {
            if (userAnswers[i] === null) unattempted++;
            else if (userAnswers[i] === questions[i].correct) correct++;
            else incorrect++;
        }
        const score = correct * 3 - incorrect * 1;
        scoreVal.textContent = score;
        // Show overlay
        resultOverlay.classList.add('active');
        // Activate 'all' filter
        filterBtns.forEach(b => b.classList.remove('active'));
        document.querySelector('[data-filter="all"]').classList.add('active');
        renderReview('all');
        // Re-render MathJax in review
        setTimeout(() => {
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([reviewList]).catch(() => {});
            }
        }, 100);
    }

    // ============================================================
    // 8. REVIEW & FILTER
    // ============================================================
    function renderReview(filter = 'all') {
        reviewList.innerHTML = '';
        let itemsHtml = '';
        for (let i = 0; i < totalQuestions; i++) {
            const q = questions[i];
            const userAns = userAnswers[i];
            const isCorrect = userAns === q.correct;
            const isUnattempted = userAns === null;

            // Apply filter
            if (filter === 'correct' && !isCorrect) continue;
            if (filter === 'incorrect' && (isCorrect || isUnattempted)) continue;
            if (filter === 'unattempted' && !isUnattempted) continue;

            let statusClass = 'unattempted';
            if (!isUnattempted) statusClass = isCorrect ? 'correct' : 'incorrect';

            let optionsHtml = '';
            q.options.forEach((opt, optIdx) => {
                let optClass = 'review-opt';
                if (optIdx === q.correct) optClass += ' correct-opt';
                else if (optIdx === userAns && !isCorrect) optClass += ' wrong-opt';
                optionsHtml += `<div class="${optClass}">${String.fromCharCode(65 + optIdx)}. ${opt}</div>`;
            });

            const userChoiceText = isUnattempted ? 'Not attempted' : String.fromCharCode(65 + userAns);
            const correctChoiceText = String.fromCharCode(65 + q.correct);

            itemsHtml += `
                <div class="review-item ${statusClass}">
                    <div class="review-question">Q${i + 1}. ${q.q}</div>
                    <div class="review-options">${optionsHtml}</div>
                    <div class="review-meta">
                        <span>Your answer: <strong>${userChoiceText}</strong></span>
                        <span>Correct answer: <strong>${correctChoiceText}</strong></span>
                        <span>${isUnattempted ? '⏭️ Skipped' : (isCorrect ? '✅ Correct (+3)' : '❌ Incorrect (−1)')}</span>
                    </div>
                </div>
            `;
        }
        reviewList.innerHTML = itemsHtml || '<p style="text-align:center;color:#94a3b8;padding:40px;">No questions match this filter.</p>';
        // Re-render MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise([reviewList]).catch(() => {});
        }
    }

    // ============================================================
    // 9. DOWNLOAD REPORT
    // ============================================================
    function downloadReport() {
        let correct = 0, incorrect = 0, unattempted = 0;
        for (let i = 0; i < totalQuestions; i++) {
            if (userAnswers[i] === null) unattempted++;
            else if (userAnswers[i] === questions[i].correct) correct++;
            else incorrect++;
        }
        const score = correct * 3 - incorrect * 1;
        const totalMarks = totalQuestions * 3;
        const accuracy = (correct + incorrect) > 0 ? ((correct / (correct + incorrect)) * 100).toFixed(1) : '0.0';

        let html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Performance Report</title>
        <script>MathJax = { tex: { inlineMath: [['$','$']] } };<\/script>
        <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async><\/script>
        <style>body{font-family:Segoe UI,Roboto,sans-serif;padding:30px;max-width:1000px;margin:auto;}
        h1{color:#1e293b;} .summary{display:flex;gap:30px;background:#f1f5f9;padding:20px;border-radius:16px;flex-wrap:wrap;margin:20px 0;}
        .summary div{font-size:1.1rem;} .summary span{font-weight:700;color:#2563eb;}
        .item{border:1px solid #e2e8f0;border-radius:14px;padding:16px 20px;margin-bottom:14px;}
        .correct{border-left:6px solid #16a34a;} .incorrect{border-left:6px solid #dc2626;} .unattempted{border-left:6px solid #94a3b8;}
        .opt{padding:6px 10px;border-radius:8px;margin:3px 0;background:#f8fafc;}
        .correct-opt{background:#dcfce7;border:1px solid #16a34a;} .wrong-opt{background:#fee2e2;border:1px solid #dc2626;}
        .meta{font-size:0.9rem;color:#475569;margin-top:8px;padding-top:6px;border-top:1px solid #e2e8f0;}</style></head><body>
        <h1>📊 Performance & Solutions Report</h1>
        <div class="summary">
            <div>Score: <span>${score}</span> / ${totalMarks}</div>
            <div>Correct: <span>${correct}</span></div>
            <div>Incorrect: <span>${incorrect}</span></div>
            <div>Unattempted: <span>${unattempted}</span></div>
            <div>Accuracy: <span>${accuracy}%</span></div>
        </div>`;

        for (let i = 0; i < totalQuestions; i++) {
            const q = questions[i];
            const userAns = userAnswers[i];
            const isCorrect = userAns === q.correct;
            const isUnattempted = userAns === null;
            let statusClass = isUnattempted ? 'unattempted' : (isCorrect ? 'correct' : 'incorrect');
            let optionsHtml = '';
            q.options.forEach((opt, optIdx) => {
                let optClass = 'opt';
                if (optIdx === q.correct) optClass += ' correct-opt';
                else if (optIdx === userAns && !isCorrect) optClass += ' wrong-opt';
                optionsHtml += `<div class="${optClass}">${String.fromCharCode(65 + optIdx)}. ${opt}</div>`;
            });
            const userChoiceText = isUnattempted ? 'Not attempted' : String.fromCharCode(65 + userAns);
            const correctChoiceText = String.fromCharCode(65 + q.correct);
            html += `<div class="item ${statusClass}">
                <div><strong>Q${i + 1}.</strong> ${q.q}</div>
                <div>${optionsHtml}</div>
                <div class="meta">Your answer: <strong>${userChoiceText}</strong> | Correct: <strong>${correctChoiceText}</strong> | 
                ${isUnattempted ? 'Skipped' : (isCorrect ? '✅ +3' : '❌ −1')}</div>
            </div>`;
        }
        html += `</body></html>`;

        const blob = new Blob([html], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'performance_report.html';
        a.click();
        URL.revokeObjectURL(url);
    }

    // ============================================================
    // 10. START
    // ============================================================
    window.addEventListener('DOMContentLoaded', () => {
        init();
        // Render MathJax after initial load
        setTimeout(() => {
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([questionText, optionsContainer]).catch(() => {});
            }
        }, 300);
    });

    // Ensure MathJax re-renders when palette scrolls etc.
    window.addEventListener('load', () => {
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise([questionText, optionsContainer]).catch(() => {});
        }
    });

</script>
</body>
</html>
