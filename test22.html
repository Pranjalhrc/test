<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Test · 120 Questions</title>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
    <style>
        * { box-sizing: border-box; margin: 0; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
        body { background: #f0f4f8; display: flex; justify-content: center; padding: 20px; }
        .app { max-width: 1400px; width: 100%; display: flex; gap: 24px; position: relative; }
        .main-panel { flex: 1; background: white; border-radius: 28px; box-shadow: 0 12px 30px rgba(0,0,0,0.08); display: flex; flex-direction: column; padding: 28px 32px; min-height: 85vh; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #e9edf4; padding-bottom: 16px; }
        .timer { font-size: 1.8rem; font-weight: 700; color: #1e3c72; background: #eef3fe; padding: 8px 22px; border-radius: 60px; letter-spacing: 1px; }
        .q-counter { font-size: 1.1rem; color: #3a4b6e; background: #e9effb; padding: 6px 20px; border-radius: 40px; font-weight: 600; }
        .question-area { flex: 1; display: flex; flex-direction: column; margin: 12px 0 20px; overflow-y: auto; max-height: 58vh; padding-right: 6px; }
        .question-text { font-size: 1.25rem; line-height: 1.6; margin-bottom: 28px; font-weight: 500; color: #0b1e3a; }
        .options { display: flex; flex-direction: column; gap: 14px; margin-bottom: 12px; }
        .option { display: flex; align-items: flex-start; gap: 14px; background: #f9fcff; border: 2px solid #dbe2ec; border-radius: 18px; padding: 14px 20px; cursor: pointer; transition: 0.15s; font-size: 1.1rem; line-height: 1.5; }
        .option:hover { background: #eef4fe; border-color: #b0c7e9; }
        .option.selected { background: #d9e8ff; border-color: #1e5fbf; box-shadow: 0 0 0 2px rgba(30,95,191,0.15); }
        .option-letter { font-weight: 700; color: #1e3c72; min-width: 28px; }
        .nav-buttons { display: flex; flex-wrap: wrap; gap: 12px; margin-top: auto; padding-top: 18px; border-top: 2px solid #e9edf4; }
        .btn { padding: 12px 24px; border-radius: 60px; border: none; font-weight: 600; font-size: 0.95rem; cursor: pointer; background: white; border: 2px solid #cbd6e6; color: #1e2f4a; transition: 0.1s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn:hover { background: #f0f6ff; border-color: #8ba9d4; }
        .btn-primary { background: #1e5fbf; border-color: #1e5fbf; color: white; }
        .btn-primary:hover { background: #164a9c; border-color: #164a9c; }
        .btn-warning { background: #f7b731; border-color: #f7b731; color: #1e1e1e; }
        .btn-warning:hover { background: #e5a61f; border-color: #e5a61f; }
        .btn-danger { background: #d64545; border-color: #d64545; color: white; }
        .btn-danger:hover { background: #b83232; border-color: #b83232; }
        .palette { width: 300px; background: white; border-radius: 28px; box-shadow: 0 12px 30px rgba(0,0,0,0.08); padding: 24px 16px; display: flex; flex-direction: column; height: 85vh; position: sticky; top: 20px; }
        .palette h3 { text-align: center; margin-bottom: 16px; color: #1e3c72; font-weight: 600; font-size: 1.2rem; }
        .legend { display: flex; flex-wrap: wrap; gap: 10px 16px; justify-content: center; margin-bottom: 16px; font-size: 0.75rem; color: #2e405b; }
        .legend span::before { content: "●"; margin-right: 4px; font-size: 1rem; vertical-align: middle; }
        .legend .answered::before { color: #2ecc71; }
        .legend .not-answered::before { color: #e74c3c; }
        .legend .marked::before { color: #f39c12; }
        .legend .not-visited::before { color: #b0bedb; }
        .palette-grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 6px 4px; align-content: start; }
        .palette-item { aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-weight: 600; font-size: 0.9rem; background: #eef2f8; color: #30445c; border: 2px solid transparent; cursor: pointer; transition: 0.08s; }
        .palette-item.answered { background: #2ecc71; color: white; border-color: #27ae60; }
        .palette-item.not-answered { background: #e74c3c; color: white; border-color: #c0392b; }
        .palette-item.marked { background: #f39c12; color: white; border-color: #d68910; }
        .palette-item.not-visited { background: #d5deec; color: #3a4b6e; }
        .palette-item.current { outline: 3px solid #1e5fbf; outline-offset: 2px; }
        .overlay { position: fixed; inset: 0; background: rgba(10, 20, 40, 0.7); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; padding: 30px; z-index: 1000; }
        .overlay.active { display: flex; }
        .result-card { background: white; max-width: 1200px; width: 100%; max-height: 90vh; border-radius: 32px; padding: 32px 36px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 30px 50px rgba(0,0,0,0.4); }
        .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 16px; }
        .score-badge { font-size: 2rem; font-weight: 800; background: #1e3c72; color: white; padding: 10px 32px; border-radius: 60px; }
        .filter-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 18px; border-radius: 40px; border: 2px solid #cbd6e6; background: white; font-weight: 600; cursor: pointer; transition: 0.1s; }
        .filter-btn.active { background: #1e5fbf; border-color: #1e5fbf; color: white; }
        .review-list { overflow-y: auto; flex: 1; padding-right: 8px; display: flex; flex-direction: column; gap: 14px; margin-bottom: 16px; }
        .review-item { border-left: 8px solid #b0bedb; background: #f9fcff; border-radius: 16px; padding: 16px 20px; font-size: 0.98rem; line-height: 1.5; }
        .review-item.correct { border-left-color: #2ecc71; background: #f0fff6; }
        .review-item.incorrect { border-left-color: #e74c3c; background: #fff5f5; }
        .review-item.skipped { border-left-color: #b0bedb; background: #f5f7fb; }
        .review-q { font-weight: 600; color: #0b1e3a; }
        .review-ans { margin-top: 6px; display: flex; gap: 24px; flex-wrap: wrap; font-size: 0.92rem; }
        .review-ans span { font-weight: 500; }
        .correct-text { color: #1e7e34; font-weight: 700; }
        .wrong-text { color: #b71c1c; font-weight: 700; }
        .download-btn { background: #1e5fbf; border: none; color: white; padding: 10px 28px; border-radius: 40px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .download-btn:hover { background: #164a9c; }
    </style>
</head>
<body>
<div class="app" id="app">
    <div class="main-panel">
        <div class="header">
            <div class="q-counter" id="qCounter">Question 1 / 120</div>
            <div class="timer" id="timerDisplay">120:00</div>
        </div>
        <div class="question-area" id="questionArea">
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsContainer"></div>
        </div>
        <div class="nav-buttons">
            <button class="btn" id="prevBtn" onclick="prevQuestion()">← Previous</button>
            <button class="btn btn-warning" id="markBtn" onclick="toggleMark()">⭐ Mark for Review</button>
            <button class="btn" id="clearBtn" onclick="clearResponse()">✖ Clear Response</button>
            <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">Next →</button>
            <button class="btn btn-danger" id="submitBtn" onclick="submitTest()" style="margin-left:auto;">✅ Submit</button>
        </div>
    </div>
    <div class="palette">
        <h3>Question Palette</h3>
        <div class="legend">
            <span class="answered">Answered</span>
            <span class="not-answered">Not Answered</span>
            <span class="marked">Marked</span>
            <span class="not-visited">Not Visited</span>
        </div>
        <div class="palette-grid" id="paletteGrid"></div>
    </div>
</div>
<div class="overlay" id="resultOverlay">
    <div class="result-card">
        <div class="result-header">
            <div>
                <span class="score-badge" id="scoreDisplay">0</span>
                <span style="margin-left:18px;font-weight:600;color:#1e3c72;" id="accuracyDisplay">Accuracy: 0%</span>
            </div>
            <div class="filter-buttons" id="filterButtons">
                <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">All</button>
                <button class="filter-btn" data-filter="correct" onclick="setFilter('correct')">✅ Correct</button>
                <button class="filter-btn" data-filter="incorrect" onclick="setFilter('incorrect')">❌ Incorrect</button>
                <button class="filter-btn" data-filter="unattempted" onclick="setFilter('unattempted')">⏭️ Unattempted</button>
            </div>
            <button class="download-btn" onclick="downloadReview()">⬇ Download Review</button>
        </div>
        <div class="review-list" id="reviewList"></div>
    </div>
</div>

<script>
    // =======================  QUESTION DATA (1-90 Maths, 91-120 GK) =======================
    const questions = [
        // ---------- MATHEMATICS (1-90) ----------
        { text: "Equation of the plane through the point P on y-axis, which is equidistant from the points A (4,-3, 7) and $B=(2,-1,1)$ is", options: ["$x+y-3y-17=0$", "$x-y+3z-17=0$", "$x-y+3z-34=0$", "$x+y-3z-34=0$"], correct: 1 },
        { text: "The equation to the plane through the points (2, 2, 1) and (9, 3, 6) and perpendicular to the plane $2x+6y+6z=9$ is", options: ["$3x-4y-5z=9$", "$3x+4y+5z=9$", "$3x+4y+5z+9=0$", "$3x+4y-5z=9$"], correct: 3 },
        { text: "A plane meets the coordinate axes in A, B, C and the centroid of the triangle ABC is (a, b, c). The equation of the plane is", options: ["$\\frac{x}{a}+\\frac{y}{b}+\\frac{z}{c}=3$", "$\\frac{x}{a}+\\frac{y}{b}+\\frac{z}{c}=1$", "$ax+by+cz=3$", "$3ax+3by+3cz=1$"], correct: 1 },
        { text: "The foot of the perpendicular from the origin to a plane is (2, 3, 4). The equation of the plane is", options: ["$2x-3y+4z=11$", "$2x+3y+4z=11$", "$2x-3y+4z=29$", "$2x+3y+4z=29$"], correct: 2 },
        { text: "Equation to the plane through the line of intersection of $x-2y-z+3=0$ and $-3x-5y+2z+1=0$ and perpendicular to the yz-plane is", options: ["$11y+z+10=0$", "$11y+z=10$", "$11y-z+10=0$", "$11y-z=10$"], correct: 1 },
        { text: "The angle between the pair of planes represented by the equation $2x^{2}-y^{2}+2z^{2}-yz-5zx+xy=0$ is", options: ["$\\frac{\\pi}{4}$", "$\\frac{\\pi}{2}$", "$\\frac{\\pi}{6}$", "$\\frac{\\pi}{3}$"], correct: 3 },
        { text: "The distance between the parallel planes represented by the equation $x^{2}+4y^{2}+4z^{2}+4xy+8yz+4zx-9x-18y-18z+18=0$ is", options: ["3", "$\\frac{1}{3}$", "1", "$\\frac{1}{2}$"], correct: 2 },
        { text: "The image of the point (1, 3, 4) in the plane $2x-y+z+3=0$ is", options: ["(-3, 5, 2)", "(-1, 5, 3)", "(-3, 11, 2)", "(-3, 5, 10)"], correct: 0 },
        { text: "If L is the line $\\frac{x-2}{1}=\\frac{y+3}{-2}=\\frac{z+4}{5}$ and $\\pi$ is the plane $3x+4y+z=4$ then", options: ["L lies on $\\pi$", "L is perpendicular to $\\pi$", "L is parallel to $\\pi$", "L makes an angle $60^{\\circ}$ with $\\pi$"], correct: 2 },
        { text: "The equation to the plane containing the line $\\frac{x+1}{-3}=\\frac{y-3}{2}=\\frac{z+2}{1}$ and the point (0, 7, -7) is", options: ["$7x-8y+7z-45=0$", "$x+y+z=0$", "$7x+8y-7z-45=0$", "$x+y-z=0$"], correct: 1 },
        { text: "The line joining (2, 3, 1) and (3, 4, 5) intersects the plane $2x+y+z=7$ in the point", options: ["(3,-2, 7)", "(1, 4, 7)", "(1,-2,-5)", "(1,-2, 7)"], correct: 3 },
        { text: "The equation of the plane containing the line $\\frac{x-1}{2}=\\frac{y+1}{-1}=\\frac{z-3}{4}$ and is perpendicular to the plane $x+2y+z-12=0$ is", options: ["$9x-2y-5z+4=0$", "$9x-2y+5z+4=0$", "$9x+2y+5z+4=0$", "$9x-2y+5z-4=0$"], correct: 0 },
        { text: "The length of the perpendicular from the point (2, 4, -1) from the line through the point (-5, -3, 6) whose d.c's are 1, 4, -9 is", options: ["21", "$\\frac{\\sqrt{7}}{\\sqrt{3}}$", "7", "$7\\sqrt{3}$"], correct: 2 },
        { text: "The volume of the tetrahedron with vertices (0, 0, 0), (-1, 1, 1), (1, 1, -1) and (1,-1, 1) in cubic unity is", options: ["1", "$\\frac{1}{3}$", "$\\frac{2}{3}$", "3"], correct: 2 },
        { text: "The radius and centre of the Sphere through (0, 0, 0) and making intercepts 3, 4, 5 on the axes is", options: ["$\\frac{5}{\\sqrt{2}},(\\frac{-3}{2},-2,\\frac{-5}{2})$", "$5,(\\frac{-3}{2},-2,\\frac{-5}{2})$", "$\\frac{5}{\\sqrt{2}},(\\frac{3}{2},2,\\frac{5}{2})$", "$5,(\\frac{3}{2},2,\\frac{5}{2})$"], correct: 2 },
        { text: "The equation of the sphere with (1, 2, 3) and (2, 3, 4) as the ends of a diameter is", options: ["$x^{2}+y^{2}+z^{2}-3x-5y-7z+21=0$", "$x^{2}+y^{2}+z^{2}+3x+5y+7z+21=0$", "$x^{2}+y^{2}+z^{2}-3x-5y-7z+20=0$", "$x^{2}+y^{2}+z^{2}+3x+5y+7z+20=0$"], correct: 2 },
        { text: "The point of contact of the plane $x-2y+z+12=0$ and the sphere $x^{2}+y^{2}+z^{2}-2x-4y+2z-3=0$", options: ["(-1,0,-2)", "(-1,4,-2)", "(3,4,-2)", "(-1,4, 0)"], correct: 1 },
        { text: "The pole of the plane $x-y+5z-3=0$ with respect to the sphere $x^{2}+y^{2}+z^{2}=9$ is", options: ["(1,-5,5)", "$(\\frac{1}{3},\\frac{-1}{3},\\frac{5}{3})$", "(3, -3, 5)", "(3,-3, 15)"], correct: 3 },
        { text: "The limit points of the coaxial system of spheres of which two members are $x^{2}+y^{2}+z^{2}+3x-3y+6=0$ and $x^{2}+y^{2}+z^{2}-6y-6z+6=0$ are", options: ["(-2, 1, 1) (-1,-2, 1)", "(-2, 1,-1), (1,-2,-1)", "(-2, 1, -1), (-1,-2, 1)", "(-2, 1, -1), (-1, 2, 1)"], correct: 0 },
        { text: "The equation to the cone which contains the three coordinate axes and the lines $\\frac{x}{1}=\\frac{y}{-2}=\\frac{z}{3};\\frac{x}{-1}=\\frac{y}{1}=\\frac{z}{1}$ is", options: ["$5yz-8zx-3xy=0$", "$5yz-8zx+3xy=0$", "$5yz+8zx-3xy=0$", "$5yz+8zx+3xy=0$"], correct: 3 },
        { text: "The equation of the cone with vertex of the origin and whose base curve is $z=2,x^{2}+y^{2}=4$ is", options: ["$x^{2}+y^{2}=z^{2}$", "$x^{2}+y^{2}+z^{2}=0$", "$x^{2}+y^{2}=4z^{2}$", "$4(x^{2}+y^{2})=z^{2}$"], correct: 0 },
        { text: "The equation of the cone with vertex of the origin and whose base curve is $z=2,x^{2}+y^{2}=x^{2}+2x-2y=2$ with vertex at (1, 1, 1) is", options: ["$3x^{2}+y-4xy+10x-2y+4z+6=0$", "$3x^{2}-y^{2}-4zx+10x+2y-4z+6=0$", "$3x^{2}-y^{2}+4xy-10x+2y-4z+6=0$", "$3x^{2}-y^{2}+4zx-10x+2y-4z+6=0$"], correct: 3 },
        { text: "Let (C, +, .) and (R, +, .) be the field of complex numbers and the field of real numbers respectively. The $\\text{dim}_R C =$", options: ["1", "2", "4", "$\\infty$"], correct: 1 },

        { text: "Let $M_{2}(C)=\\{(\\begin{matrix}a & b\\\\ c & d\\end{matrix}) \\mid a,b,c,d \\in C\\}$ where C is the field of complex numbers. Then the dimension of the vector space $M_{2}(C)$ over the field of real numbers is", options: ["8", "4", "2", "$\\infty$"], correct: 0 },
        { text: "Let $S=\\{v_{1},v_{2},......,v_{n}\\}$ be a set of linearly independent vector in a vector space V over a field F. Which of the following statements is false ?", options: ["None of the vectors in S is a linear combination of other vectors.", "Some vector in S is a linear combination of other vectors in S.", "None of the vectors in S is a zero vector.", "S can be extended to a basis of V over F."], correct: 1 },
        { text: "Which of the following sets in $R^{2}$ is not a basis of $R^{2}$ over the field R of real numbers ?", options: ["\\{(1,0), (0,-1)\\}", "\\{(1, 1), (-1, 1)\\}", "\\{(-2, 1), (1, 0)\\}", "\\{(1,-1), (-2, 2)\\}"], correct: 3 },
        { text: "The dimension of the subspace $W=[\\begin{matrix}x_{i} & -x \\\\ y_{i} & z\\end{matrix} \\mid x_{i}, y, z \\in R]$. If the vector space.", options: ["4", "3", "2", "1"], correct: 1 },
        { text: "If $W_{1}$ and $W_{2}$ are subspaces of the vector space of $M_{2}(R)$ of $2\\times2$ matrices over the field R of real numbers then $\\text{dim}_R(W_{1}+W_{2})=$", options: ["1", "2", "3", "4"], correct: 3 },
        { text: "If $T: R^{2}\\rightarrow R^{2}$ is a linear transformation defined by $T(1,0)=(1,-1)$ and $T(0,1)=(1,2)$ then $T(-3, 4)=$", options: ["(1, 11)", "(7,5)", "(7, 11)", "(1,5)"], correct: 0 },

        { text: "Which of the following is an indirect tax?", options: ["Income tax", "Goods and Services Tax (GST)", "Corporate tax", "Wealth tax"], correct: 1 },
        { text: "The \"Service Sector\" in India includes:", options: ["Only agriculture", "Trade, transport, communication, finance and IT", "Only mining", "Only construction"], correct: 1 }
    ];

    // =======================  STATE  =======================
    let currentIndex = 0;
    let userAnswers = new Array(120).fill(null);
    let marked = new Array(120).fill(false);
    let visited = new Array(120).fill(false);
    let timeLeft = 120 * 60;
    let timerInterval = null;
    let testSubmitted = false;

    // =======================  ELEMENTS  =======================
    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const qCounter = document.getElementById('qCounter');
    const timerDisplay = document.getElementById('timerDisplay');
    const paletteGrid = document.getElementById('paletteGrid');
    const markBtn = document.getElementById('markBtn');
    const resultOverlay = document.getElementById('resultOverlay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const accuracyDisplay = document.getElementById('accuracyDisplay');
    const reviewList = document.getElementById('reviewList');

    // =======================  RENDER  =======================
    function renderQuestion() {
        if (testSubmitted) return;
        const q = questions[currentIndex];
        questionText.innerHTML = `Q${currentIndex + 1}. ${q.text}`;
        let html = '';
        q.options.forEach((opt, idx) => {
            const selected = userAnswers[currentIndex] === idx;
            html += `<div class="option ${selected ? 'selected' : ''}" onclick="selectOption(${idx})">
                <span class="option-letter">${String.fromCharCode(65 + idx)}.</span>
                <span>${opt}</span>
            </div>`;
        });
        optionsContainer.innerHTML = html;
        qCounter.textContent = `Question ${currentIndex + 1} / 120`;
        if (marked[currentIndex]) {
            markBtn.style.background = '#f39c12';
            markBtn.style.borderColor = '#d68910';
            markBtn.style.color = 'white';
        } else {
            markBtn.style.background = 'white';
            markBtn.style.borderColor = '#cbd6e6';
            markBtn.style.color = '#1e2f4a';
        }
        visited[currentIndex] = true;
        updatePalette();
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise([questionText, optionsContainer]);
        }
    }

    function updatePalette() {
        paletteGrid.innerHTML = '';
        for (let i = 0; i < 120; i++) {
            const div = document.createElement('div');
            div.className = 'palette-item';
            if (userAnswers[i] !== null) div.classList.add('answered');
            else if (visited[i]) div.classList.add('not-answered');
            else div.classList.add('not-visited');
            if (marked[i]) div.classList.add('marked');
            if (i === currentIndex) div.classList.add('current');
            div.textContent = i + 1;
            div.onclick = () => { if (!testSubmitted) { currentIndex = i; renderQuestion(); } };
            paletteGrid.appendChild(div);
        }
    }

    // =======================  ACTIONS  =======================
    function selectOption(idx) {
        if (testSubmitted) return;
        if (userAnswers[currentIndex] === idx) userAnswers[currentIndex] = null;
        else userAnswers[currentIndex] = idx;
        renderQuestion();
    }

    function prevQuestion() {
        if (testSubmitted) return;
        if (currentIndex > 0) { currentIndex--; renderQuestion(); }
    }

    function nextQuestion() {
        if (testSubmitted) return;
        if (currentIndex < 119) { currentIndex++; renderQuestion(); }
    }

    function toggleMark() {
        if (testSubmitted) return;
        marked[currentIndex] = !marked[currentIndex];
        renderQuestion();
    }

    function clearResponse() {
        if (testSubmitted) return;
        userAnswers[currentIndex] = null;
        renderQuestion();
    }

    // =======================  TIMER  =======================
    function startTimer() {
        timerInterval = setInterval(() => {
            if (testSubmitted) return;
            timeLeft--;
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                submitTest();
            }
        }, 1000);
    }

    // =======================  SUBMIT  =======================
    function submitTest() {
        if (testSubmitted) return;
        if (timeLeft > 0 && !confirm('Are you sure you want to submit the test?')) return;
        testSubmitted = true;
        clearInterval(timerInterval);
        let correctCount = 0, wrongCount = 0, skipped = 0;
        for (let i = 0; i < 120; i++) {
            if (userAnswers[i] === null) skipped++;
            else if (userAnswers[i] === questions[i].correct) correctCount++;
            else wrongCount++;
        }
        const score = correctCount * 3 - wrongCount;
        const attempted = correctCount + wrongCount;
        const accuracy = attempted > 0 ? (correctCount / attempted * 100) : 0;
        scoreDisplay.textContent = `Score: ${score}`;
        accuracyDisplay.textContent = `Accuracy: ${accuracy.toFixed(2)}%  (${correctCount} correct, ${wrongCount} wrong, ${skipped} skipped)`;
        renderReview('all');
        resultOverlay.classList.add('active');
        updatePalette();
    }

    function renderReview(filter) {
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.filter === filter);
        });
        let html = '';
        let count = 0;
        for (let i = 0; i < 120; i++) {
            const q = questions[i];
            const userAns = userAnswers[i];
            const isCorrect = userAns === q.correct;
            const isSkipped = userAns === null;
            if (filter === 'correct' && !isCorrect) continue;
            if (filter === 'incorrect' && (isCorrect || isSkipped)) continue;
            if (filter === 'unattempted' && !isSkipped) continue;
            count++;
            let itemClass = 'review-item ';
            if (isSkipped) itemClass += 'skipped';
            else if (isCorrect) itemClass += 'correct';
            else itemClass += 'incorrect';

            const userLetter = userAns !== null ? String.fromCharCode(65 + userAns) : '—';
            const correctLetter = String.fromCharCode(65 + q.correct);
            html += `<div class="${itemClass}">
                <div class="review-q">Q${i + 1}. ${q.text}</div>
                <div class="review-ans">
                    <span>Your answer: <span class="${isCorrect ? 'correct-text' : (isSkipped ? '' : 'wrong-text')}">${userLetter} ${userAns !== null ? q.options[userAns] : '(not attempted)'}</span></span>
                    <span>Correct answer: <span class="correct-text">${correctLetter} ${q.options[q.correct]}</span></span>
                </div>
            </div>`;
        }
        if (count === 0) html = '<p style="text-align:center;padding:30px;color:#4a5e7a;">No questions match this filter.</p>';
        reviewList.innerHTML = html;
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise([reviewList]);
        }
    }

    function setFilter(filter) {
        renderReview(filter);
    }

    // =======================  DOWNLOAD  =======================
    function downloadReview() {
        let content = `MCQ Test Performance & Solutions\nScore: ${scoreDisplay.textContent}\n${accuracyDisplay.textContent}\n\n`;
        for (let i = 0; i < 120; i++) {
            const q = questions[i];
            const userAns = userAnswers[i];
            const isSkipped = userAns === null;
            const userLetter = userAns !== null ? String.fromCharCode(65 + userAns) : '—';
            const correctLetter = String.fromCharCode(65 + q.correct);
            content += `Q${i + 1}. ${q.text.replace(/\$/g, '')}\n`;
            content += `Your answer: ${userLetter} ${userAns !== null ? q.options[userAns].replace(/\$/g, '') : '(not attempted)'}\n`;
            content += `Correct answer: ${correctLetter} ${q.options[q.correct].replace(/\$/g, '')}\n\n`;
        }
        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'performance_review.txt';
        a.click();
        URL.revokeObjectURL(url);
    }

    // =======================  INIT  =======================
    function init() {
        renderQuestion();
        startTimer();
        updatePalette();
        document.addEventListener('keydown', (e) => {
            if (testSubmitted) return;
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    }

    init();

    window.selectOption = selectOption;
    window.prevQuestion = prevQuestion;
    window.nextQuestion = nextQuestion;
    window.toggleMark = toggleMark;
    window.clearResponse = clearResponse;
    window.submitTest = submitTest;
    window.setFilter = setFilter;
    window.downloadReview = downloadReview;
</script>
</body>
</html>
