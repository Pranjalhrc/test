<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Test App – Mathematics & GK</title>
    <!-- MathJax for LaTeX rendering -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }
        body {
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .app-container {
            width: 1400px;
            max-width: 100%;
            height: 90vh;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Header */
        .header {
            background: #1e293b;
            color: #fff;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .timer {
            background: #0f172a;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1.3rem;
            font-variant-numeric: tabular-nums;
            border: 1px solid #334155;
        }

        /* Main body: question + palette */
        .main-body {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .question-area {
            flex: 1;
            padding: 28px 32px;
            overflow-y: auto;
            background: #fff;
            display: flex;
            flex-direction: column;
        }
        .question-number {
            font-size: 0.9rem;
            color: #64748b;
            font-weight: 500;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }
        .question-text {
            font-size: 1.2rem;
            font-weight: 500;
            color: #0f172a;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }
        .option {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.15s;
            background: #f8fafc;
            font-size: 1.05rem;
        }
        .option:hover {
            background: #eef2f6;
            border-color: #cbd5e1;
        }
        .option.selected {
            background: #dbeafe;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .option .opt-letter {
            font-weight: 700;
            margin-right: 16px;
            color: #1e293b;
            min-width: 24px;
            text-align: center;
        }
        .option .opt-text {
            flex: 1;
        }

        /* Palette (right side) */
        .palette {
            width: 280px;
            background: #f8fafc;
            border-left: 1px solid #e2e8f0;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow-y: auto;
        }
        .palette-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .palette-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }
        .palette-btn {
            aspect-ratio: 1 / 1;
            border-radius: 10px;
            border: 2px solid #e2e8f0;
            background: #fff;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s;
            color: #1e293b;
        }
        .palette-btn:hover {
            transform: scale(1.05);
        }
        .palette-btn.not-visited {
            background: #f1f5f9;
            border-color: #e2e8f0;
            color: #94a3b8;
        }
        .palette-btn.answered {
            background: #22c55e;
            border-color: #16a34a;
            color: #fff;
        }
        .palette-btn.marked {
            background: #a855f7;
            border-color: #9333ea;
            color: #fff;
        }
        .palette-btn.answered-marked {
            background: #8b5cf6;
            border-color: #7c3aed;
            color: #fff;
            position: relative;
        }
        .palette-btn.answered-marked::after {
            content: "✔";
            font-size: 0.7rem;
            position: absolute;
            bottom: 2px;
            right: 4px;
            color: #fff;
        }
        .palette-legend {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.8rem;
            color: #475569;
            margin-top: 8px;
            border-top: 1px solid #e2e8f0;
            padding-top: 16px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .legend-swatch {
            width: 18px;
            height: 18px;
            border-radius: 6px;
            border: 2px solid #e2e8f0;
        }
        .legend-swatch.not-visited { background: #f1f5f9; }
        .legend-swatch.answered { background: #22c55e; border-color: #16a34a; }
        .legend-swatch.marked { background: #a855f7; border-color: #9333ea; }
        .legend-swatch.answered-marked { background: #8b5cf6; border-color: #7c3aed; }

        /* Footer buttons */
        .footer {
            padding: 14px 24px;
            background: #f1f5f9;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            flex-shrink: 0;
        }
        .btn {
            padding: 10px 22px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.15s;
            background: #fff;
            color: #1e293b;
            border: 1.5px solid #cbd5e1;
        }
        .btn:hover {
            background: #f8fafc;
            border-color: #94a3b8;
        }
        .btn.primary {
            background: #3b82f6;
            border-color: #3b82f6;
            color: #fff;
        }
        .btn.primary:hover {
            background: #2563eb;
        }
        .btn.mark {
            background: #a855f7;
            border-color: #a855f7;
            color: #fff;
        }
        .btn.mark:hover {
            background: #9333ea;
        }
        .btn.danger {
            background: #ef4444;
            border-color: #ef4444;
            color: #fff;
        }
        .btn.danger:hover {
            background: #dc2626;
        }
        .spacer {
            flex: 1;
        }

        /* Overlay / Modal */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .overlay.hidden {
            display: none;
        }
        .modal {
            background: #fff;
            border-radius: 28px;
            width: 100%;
            max-width: 1100px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }
        .modal-header {
            padding: 20px 28px;
            background: #1e293b;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .modal-header h2 {
            font-size: 1.4rem;
            font-weight: 500;
        }
        .modal-body {
            padding: 24px 28px;
            overflow-y: auto;
            flex: 1;
        }
        .score-summary {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            background: #f8fafc;
            border-radius: 20px;
            padding: 20px 28px;
            border: 1px solid #e2e8f0;
        }
        .score-item {
            display: flex;
            flex-direction: column;
        }
        .score-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #64748b;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .score-value {
            font-size: 2rem;
            font-weight: 700;
            color: #0f172a;
        }
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 18px;
            border-radius: 40px;
            border: 1.5px solid #cbd5e1;
            background: #fff;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.1s;
            font-size: 0.9rem;
        }
        .filter-btn.active {
            background: #1e293b;
            color: #fff;
            border-color: #1e293b;
        }
        .solution-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .solution-item {
            border-radius: 16px;
            padding: 16px 20px;
            border-left: 6px solid #cbd5e1;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-left-width: 6px;
        }
        .solution-item.correct {
            border-left-color: #22c55e;
            background: #f0fdf4;
        }
        .solution-item.incorrect {
            border-left-color: #ef4444;
            background: #fef2f2;
        }
        .solution-item.skipped {
            border-left-color: #94a3b8;
            background: #f1f5f9;
        }
        .solution-q {
            font-weight: 600;
            margin-bottom: 8px;
            color: #0f172a;
        }
        .solution-choices {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin: 8px 0;
            font-size: 0.95rem;
        }
        .choice-line {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .choice-line .tag {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .tag.user { background: #dbeafe; color: #1e40af; }
        .tag.correct { background: #dcfce7; color: #166534; }
        .tag.wrong { background: #fee2e2; color: #991b1b; }
        .solution-answer {
            margin-top: 8px;
            font-weight: 500;
            color: #1e293b;
        }
        .modal-footer {
            padding: 16px 28px;
            background: #f1f5f9;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            border-top: 1px solid #e2e8f0;
            flex-shrink: 0;
        }
        .hidden {
            display: none !important;
        }
        .small-note {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 4px;
        }
    </style>
</head>
<body>
<div class="app-container" id="app">
    <!-- Header -->
    <div class="header">
        <h1>📘 MCQ Test – Mathematics (1–90) & GK (91–120)</h1>
        <div class="timer" id="timerDisplay">120:00</div>
    </div>

    <!-- Main body -->
    <div class="main-body">
        <div class="question-area" id="questionArea">
            <!-- rendered by JS -->
        </div>
        <div class="palette" id="palette">
            <div class="palette-title">Question Palette</div>
            <div class="palette-grid" id="paletteGrid"></div>
            <div class="palette-legend">
                <div class="legend-item"><span class="legend-swatch not-visited"></span> Not Visited</div>
                <div class="legend-item"><span class="legend-swatch answered"></span> Answered</div>
                <div class="legend-item"><span class="legend-swatch marked"></span> Marked for Review</div>
                <div class="legend-item"><span class="legend-swatch answered-marked"></span> Answered & Marked</div>
            </div>
        </div>
    </div>

    <!-- Footer buttons -->
    <div class="footer">
        <button class="btn" id="prevBtn">← Previous</button>
        <button class="btn" id="nextBtn">Next →</button>
        <button class="btn" id="clearBtn">Clear Response</button>
        <button class="btn mark" id="markBtn">Mark for Review</button>
        <div class="spacer"></div>
        <button class="btn danger" id="submitBtn">Submit Test</button>
    </div>

    <!-- Overlay for results -->
    <div class="overlay hidden" id="resultOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2>📊 Performance & Solutions</h2>
                <button class="btn" id="closeModalBtn" style="background:transparent;border-color:#475569;color:#fff;">✕</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- dynamically filled -->
            </div>
            <div class="modal-footer">
                <button class="btn primary" id="downloadBtn">⬇ Download Performance (HTML)</button>
                <button class="btn" id="closeModalFooterBtn">Close</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // 1. QUESTION DATA (120 questions: 1–90 math, 91–120 GK)
    // ============================================================
    const questions = [];

    // Helper to add question
    function addQ(text, opts, correct) {
        questions.push({ text, options: opts, correct: correct });
    }

    // ---- Mathematics (1–90) ----
    // Source file 1 (Q1–40) + Source file 2 (Q41–90)
    // We include exactly as given in the document.

    // From Source File 1 (Q1–40)
    addQ("Let $W_{1}$ and $W_{2}$ be two subspaces of a vector space $V(F)$, then which of the following is also a subspace of $V(F)$?",
        ["$W_{1}\\cup W_{2}$", "$W_{1}\\cap W_{2}$", "$W_{1}-W_{2}$", "$V-W_{1}$"], 1);
    addQ("If $\\alpha_{1}$ and $\\alpha_{2}$ are two vectors of the vector space $V(F)$ and $a, b \\in F$, then set of vectors $S=\\{\\alpha_{1}, \\alpha_{2}, a\\alpha_{1}+b\\alpha_{2}\\}$ is:",
        ["Linearly independent", "Linearly dependent", "Basis of $V(F)$", "None of these"], 1);
    addQ("The dimension of the vector space spanned by the vectors: $(1, 0, 2, 0)$, $(2, 3, 1, -1)$, $(1, 1, 1, 1)$, $(0, 0, 0, 4)$ over the field of real numbers is:",
        ["1", "2", "4", "3"], 3);
    addQ("Let $T$ be a linear transformation from a vector space $U(F)$ to vector space $V(F)$. Then:",
        ["$T(\\alpha - \\beta) = T(\\alpha) - T(\\beta), \\forall \\alpha, \\beta \\in U$",
         "$T(-\\alpha) = \\alpha, \\forall \\alpha \\in U$",
         "$T(0) = 0$",
         "$T(5x) = \\frac{1}{5} T(a), (\\forall a \\in U)$"], 0);
    addQ("The rank of the linear transformation $T : \\mathbb{R}^2 \\to \\mathbb{R}^3$, defined by $T(a, b) = (a - b, b - a, -a)$ is:",
        ["2", "3", "0", "1"], 0);
    addQ("If $u = 3t^2 + 5t - 3$ and $v = 6t^2 + 10t - 5$ are two vectors of a vector space $V$, then $u$ and $v$ are:",
        ["Basis of a vector space", "Linearly independent", "Linearly dependent", "None of the above"], 1);
    addQ("The dimension of a vector space $V$ of all scalar matrices of type $n \\times n$ is:",
        ["0", "$n$", "$n \\times n$", "1"], 3);
    addQ("The matrix of linear transformation $T : \\mathbb{R}^2 \\to \\mathbb{R}^2$, defined by $T(x, y) = (4x - 2y, 2x + y)$, with respect to the basis $B = \\{(1, 0), (0, 1)\\}$ is:",
        ["$\\begin{bmatrix} 4 & -2 \\\\ 2 & 1 \\end{bmatrix}$",
         "$\\begin{bmatrix} 4 & 2 \\\\ -2 & 1 \\end{bmatrix}$",
         "$\\begin{bmatrix} 4 & -2 \\\\ 1 & 2 \\end{bmatrix}$",
         "$\\begin{bmatrix} 4 & 1 \\\\ 2 & -2 \\end{bmatrix}$"], 0);
    addQ("If $U_1 = \\left\\{ \\begin{bmatrix} a & b \\\\ 0 & 0 \\end{bmatrix} : a, b \\in \\mathbb{R} \\right\\}$ and $U_2 = \\left\\{ \\begin{bmatrix} a & 0 \\\\ c & 0 \\end{bmatrix} : a, c \\in \\mathbb{R} \\right\\}$ be two subspaces of the vector space of all $2 \\times 2$ matrices, then $\\dim(U_1 + U_2)$ is:",
        ["1", "2", "3", "4"], 2);
    addQ("If $f$ and $g$ be bounded functions defined on $[a, b]$ and $P$ any partition, then which is true?",
        ["$U(P, f+g) \\le U(P, f) + U(P, g)$",
         "$U(P, f+g) \\ge U(P, f) + U(P, g)$",
         "$U(P, f+g) \\le L(P, f) + L(P, g)$",
         "None of the above"], 0);
    addQ("For the curve $x = 3t; y = 3t^2; z = 2t^3$ the radius of curvature ($\\rho$) is:",
        ["$\\frac{3}{2}(1+2t^2)^2$", "$\\frac{3}{2}(1+2t^2)^3$", "$\\frac{1}{2}(1+2t^2)^{3/2}$", "$\\frac{3}{2}(1+2t^2)^{3/2}$"], 3);
    addQ("X and Y each tosses four coins. The probability that both get the same number of heads is:",
        ["$\\frac{17}{64}$", "$\\frac{35}{128}$", "$\\frac{9}{32}$", "$\\frac{69}{256}$"], 1);
    addQ("In rectangular Cartesian coordinate system $(x,y,z)$ if $[g_{ij}] = \\begin{bmatrix} 2xy & 0 & 0 \\\\ 0 & 2yz & 0 \\\\ 0 & 0 & 2zx \\end{bmatrix}$, the $[1\\ 2, 1]$ is:",
        ["$1$", "$0$", "$x + y - z$", "$x$"], 3);
    addQ("If $A_{ij}$ is skew-symmetric tensor, then $(\\delta_i^j \\delta_k^l + \\delta_i^l \\delta_k^j) A_{jl}$ is equal to:",
        ["$A_{ik}$", "$0$", "$2A_{ik}$", "$1$"], 1);
    addQ("For the divided difference table, polynomial of lowest possible degree is:",
        ["$7x^2 - 18x + 21$", "$-7x^2 + 18x + 4$", "$-21x^2 + 18x - 7$", "$12x^2 - 3x - 7$"], 1);
    addQ("Using Stirling's central difference formula, the value of $y(35)$ from the table is:",
        ["$201$ (approximate)", "$573$ (approximate)", "$375$ (approximate)", "$395$ (approximate)"], 3);
    addQ("Hankel transform of which of the following is equal to the Laplace transform of Bessel function $J_0(t)$?",
        ["$e^{-a}$", "$t e^{-at}$", "$e^{-at}$", "None of these"], 2);
    addQ("According to D'Alembert's principle, which is correct?",
        ["$\\sum \\left( -m \\frac{d^2 r}{dt^2} \\right) - \\sum P = 0$",
         "$\\sum P + \\sum \\left( -m \\frac{dr}{dt} \\right) = 0$",
         "$\\sum P - \\sum \\left( -m \\frac{dr}{dt} \\right) = 0$",
         "$\\sum \\left( -m \\frac{d^2 r}{dt^2} \\right) + \\sum P = 0$"], 3);
    addQ("With reference to topological spaces, which statement is incorrect?",
        ["A continuous image of a compact space is compact.",
         "Continuous image of a Bolzano Weierstrass property set need not possess Bolzano Weierstrass property.",
         "A one-one continuous map of a compact space onto Hausdorff space is a homomorphism.",
         "Compactness is a topological invariant."], 1);
    addQ("For Laguerre Polynomial $L_n(x)$, $L_n(0)$ is:",
        ["$n$", "$0$", "$1$", "$-n$"], 3);
    addQ("Using Lagrange's interpolation for $f(0) = 6$, $f(2) = 0$, $f(3) = 0$, the value of $f(1)$ is:",
        ["$-3$", "$2$", "$3$", "$-2$"], 1);
    addQ("The demand for a product has a rectangular distribution between $4000$ and $5000$. Storage cost £$1.00$/unit, shortage cost £$7$/unit. Optimal order quantity is:",
        ["$875$ units", "$4125$ units", "$4875$ units", "$2875$ units"], 2);
    addQ("If $X = \\{x : x = 2n - 1, n \\in \\mathbb{N}, n \\le 8\\}$ and $Y = \\{x^2 : x = 2n - 1, n \\in \\mathbb{N}, n \\le 8\\}$, then the degree of interpolation polynomial is:",
        ["$7$", "$8$", "$15$", "$16$"], 0);
    addQ("A cubic polynomial passes through $(0, 1)$, $(1, 0)$, $(2, 1)$, $(3, 16)$ with $f(0)=1$, $\\Delta f(0)=-1$, $\\Delta^2 f(0)=2$, $\\Delta^3 f(0)=12$. The polynomial is:",
        ["$2x^3 - 5x^2 + 1$", "$2x^3 - 5x^2 + 2x + 1$", "$x^3 - x^2 + 2x + 12$", "$x^3 - 2x^2 + 1$"], 1);
    addQ("Which is correct for Laguerre polynomial?",
        ["$L_n'(x) = \\frac{n}{x} [L_n(x) - L_{n-1}(x)]$",
         "$L_n'(x) = \\frac{x}{n} [L_n(x) - L_{n-1}(x)]$",
         "$L_n'(x) = \\frac{1}{x} [L_n(x) - L_{n-1}(x)]$",
         "$L_n'(x) = \\frac{n}{x} [L_n(x) - L_{n-1}(x)]$"], 1);
    addQ("Every hyperplane is a:",
        ["Convex set", "Hyper sphere", "Convex combination", "Line segment"], 0);
    addQ("For the paraboloid $x = u$, $y = v$, $z = u^2 - v^2$, the value of $H$ is:",
        ["$\\sqrt{(1 + 2(u^2 - v^2))}$", "$\\sqrt{(1 + 2u^2 + 2v^2)}$", "$\\sqrt{(1 + 4u^2 - 4v^2)}$", "$\\sqrt{(1 + 4u^2 + 4v^2)}$"], 3);
    addQ("For $L = q_k \\dot{q}_k - \\sqrt{1 - \\dot{q}_k^2}$, the generalized acceleration is:",
        ["$\\frac{1}{2} g$", "$2g$", "$0$", "$\\frac{2}{3} g$"], 2);
    addQ("Correct relationship between $B^{lp}$ and $B_{pqr}$ is:",
        ["$B^{lp} = g^{lp} g^{qr} B_{pqr}$", "$B^{lp} = g^{lr} g^{pq} g^{kr} B_{pqr}$", "$B^{lp} = g^{lr} g^{pq} g^{ks} B_{pqr}$", "$B^{lp} = \\dots$"], 2);
    addQ("Resolvent kernel for $u(x) = x + \\int_0^{3/4} u(t)\\,dt$ is:",
        ["$4$", "$3$", "$3/4$", "$4/3$"], 0);
    addQ("Mellin transform is:",
        ["Fourier transform of $\\cos x$", "Laplace transform of $1/x$", "Gamma function of $e^{-x}$", "None of these"], 1);
    addQ("If two lines of regression coincide, then the sum of square of deviation from any line of regression is:",

        ["RAM", "Hard disk", "CPU", "Keyboard"], 2);
    addQ("Which file format is commonly used for sharing documents with fixed layout across devices?",
        ["MP3", "JPG", "PDF", "ZIP"], 2);
    addQ("\"MIS\" in the context of ICT stands for:",
        ["Managed Internet System", "Management Information System", "Mobile Information Service", "Multi Interface Standard"], 1);
    addQ("Which of the following is NOT an advantage of e-mail over traditional mail?",
        ["Speed of delivery", "Low cost", "Requires no internet connection", "Easy attachment of files"], 2);
    addQ("One \"byte\" consists of how many bits?",
        ["4", "8", "16", "32"], 1);
    addQ("The \"Chipko Movement\" originated in which state?",
        ["Himachal Pradesh", "Uttarakhand", "Kerala", "Madhya Pradesh"], 1);
    addQ("Which of the following is a biodiversity hotspot in India?",
        ["Thar Desert", "Western Ghats", "Indo-Gangetic Plain", "Rann of Kachchh"], 1);
    addQ("Eutrophication of water bodies is caused mainly by:",
        ["Excess nutrients (nitrates/phosphates) from fertilizers", "Thermal pollution", "Noise pollution", "Radioactive waste"], 0);
    addQ("The Kyoto Protocol is associated with:",
        ["Ozone protection", "Reduction of greenhouse gas emissions", "Wetland conservation", "Wildlife trade"], 1);
    addQ("\"E-waste\" refers to:",
        ["Agricultural waste", "Discarded electronic products", "Sewage water", "Industrial smoke"], 1);
    addQ("The Dandi March (Salt Satyagraha) took place in:",
        ["1928", "1930", "1932", "1934"], 1);
    addQ("Who founded the Arya Samaj?",
        ["Raja Ram Mohan Roy", "Swami Vivekananda", "Swami Dayanand Saraswati", "Ishwar Chandra Vidyasagar"], 2);
    addQ("The \"Permanent Settlement\" of Bengal was introduced by:",
        ["Lord Cornwallis", "Warren Hastings", "Lord Ripon", "Lord Bentinck"], 0);
    addQ("The Gangetic plain of India is mainly formed of:",
        ["Black soil", "Alluvial soil", "Laterite soil", "Red soil"], 1);
    addQ("Which Indian city is called the \"Manchester of India\"?",
        ["Surat", "Ahmedabad", "Kanpur", "Coimbatore"], 1);
    addQ("How many members does the Election Commission of India (as a body) conventionally have for Lok Sabha elections?",
        ["Two", "Three", "Five", "Seven"], 1);
    addQ("The Council of Ministers in a state is collectively responsible to:",
        ["The Governor", "The Legislative Assembly", "The Chief Minister", "The High Court"], 1);
    addQ("The fundamental right against exploitation prohibits:",
        ["Freedom of speech", "Traffic in humans, begar and child labour in hazardous work", "Right to property", "Freedom of religion"], 1);
    addQ("Unemployment that occurs when people move between jobs voluntarily is called:",
        ["Structural unemployment", "Frictional unemployment", "Cyclical unemployment", "Disguised unemployment"], 1);
    addQ("The capital market in India is regulated by:",
        ["RBI", "SEBI", "NABARD", "SBI"], 1);

    // Ensure we have exactly 120 questions
    console.log("Total questions loaded:", questions.length); // Should be 120

    // ============================================================
    // 2. STATE MANAGEMENT
    // ============================================================
    const state = {
        currentIndex: 0,
        answers: new Array(questions.length).fill(null),   // selected option index or null
        visited: new Array(questions.length).fill(false),
        marked: new Array(questions.length).fill(false),
        timeLeft: 120 * 60, // 120 minutes in seconds
        timerInterval: null,
        testSubmitted: false
    };

    // Mark first question as visited
    state.visited[0] = true;

    // DOM elements
    const questionArea = document.getElementById('questionArea');
    const paletteGrid = document.getElementById('paletteGrid');
    const timerDisplay = document.getElementById('timerDisplay');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const clearBtn = document.getElementById('clearBtn');
    const markBtn = document.getElementById('markBtn');
    const submitBtn = document.getElementById('submitBtn');
    const resultOverlay = document.getElementById('resultOverlay');
    const modalBody = document.getElementById('modalBody');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const closeModalFooterBtn = document.getElementById('closeModalFooterBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    // ============================================================
    // 3. RENDER FUNCTIONS
    // ============================================================
    function renderQuestion() {
        const q = questions[state.currentIndex];
        const selected = state.answers[state.currentIndex];
        const isMarked = state.marked[state.currentIndex];

        let html = `
            <div class="question-number">Question ${state.currentIndex + 1} of ${questions.length}</div>
            <div class="question-text">${q.text}</div>
            <div class="options">
        `;
        q.options.forEach((opt, idx) => {
            const letter = String.fromCharCode(65 + idx); // A, B, C, D
            const selectedClass = (selected === idx) ? 'selected' : '';
            html += `
                <div class="option ${selectedClass}" data-opt-index="${idx}">
                    <span class="opt-letter">${letter}</span>
                    <span class="opt-text">${opt}</span>
                </div>
            `;
        });
        html += `</div>`;
        questionArea.innerHTML = html;

        // Attach click handlers to options
        document.querySelectorAll('.option').forEach(el => {
            el.addEventListener('click', (e) => {
                if (state.testSubmitted) return;
                const optIdx = parseInt(el.dataset.optIndex);
                const currentSelected = state.answers[state.currentIndex];
                if (currentSelected === optIdx) {
                    // Deselect
                    state.answers[state.currentIndex] = null;
                } else {
                    state.answers[state.currentIndex] = optIdx;
                }
                // Mark visited
                state.visited[state.currentIndex] = true;
                renderQuestion();   // re-render to update selected class
                renderPalette();
            });
        });

        // Update MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise([questionArea]).catch(err => console.warn(err));
        }

        // Update mark button style
        if (isMarked) {
            markBtn.style.background = '#7c3aed';
            markBtn.style.color = '#fff';
            markBtn.style.borderColor = '#7c3aed';
            markBtn.textContent = 'Unmark Review';
        } else {
            markBtn.style.background = '#a855f7';
            markBtn.style.color = '#fff';
            markBtn.style.borderColor = '#a855f7';
            markBtn.textContent = 'Mark for Review';
        }

        // Update previous/next disabled states
        prevBtn.disabled = (state.currentIndex === 0);
        nextBtn.disabled = (state.currentIndex === questions.length - 1);
        prevBtn.style.opacity = prevBtn.disabled ? '0.5' : '1';
        nextBtn.style.opacity = nextBtn.disabled ? '0.5' : '1';
    }

    function renderPalette() {
        let html = '';
        for (let i = 0; i < questions.length; i++) {
            const answered = state.answers[i] !== null;
            const marked = state.marked[i];
            const visited = state.visited[i];
            let cls = 'palette-btn';
            if (!visited) cls += ' not-visited';
            else if (answered && marked) cls += ' answered-marked';
            else if (answered) cls += ' answered';
            else if (marked) cls += ' marked';
            else cls += ' not-visited'; // default grey

            const active = (i === state.currentIndex) ? ' style="border: 2px solid #1e293b; box-shadow: 0 0 0 2px #3b82f6;"' : '';
            html += `<button class="${cls}" data-index="${i}"${active}>${i + 1}</button>`;
        }
        paletteGrid.innerHTML = html;

        // Add click handlers
        document.querySelectorAll('.palette-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                if (state.testSubmitted) return;
                const idx = parseInt(btn.dataset.index);
                state.currentIndex = idx;
                state.visited[idx] = true;
                renderQuestion();
                renderPalette();
            });
        });

        // Scroll palette into view? Not needed.
    }

    function updateTimerDisplay() {
        const mins = Math.floor(state.timeLeft / 60);
        const secs = state.timeLeft % 60;
        timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        if (state.timeLeft <= 60) {
            timerDisplay.style.color = '#ef4444';
        } else if (state.timeLeft <= 300) {
            timerDisplay.style.color = '#f59e0b';
        } else {
            timerDisplay.style.color = '#fff';
        }
    }

    function startTimer() {
        if (state.timerInterval) clearInterval(state.timerInterval);
        state.timerInterval = setInterval(() => {
            if (state.testSubmitted) return;
            state.timeLeft--;
            updateTimerDisplay();
            if (state.timeLeft <= 0) {
                clearInterval(state.timerInterval);
                state.timeLeft = 0;
                updateTimerDisplay();
                submitTest(true); // auto submit
            }
        }, 1000);
    }

    // ============================================================
    // 4. NAVIGATION & ACTIONS
    // ============================================================
    function goToPrev() {
        if (state.currentIndex > 0) {
            state.currentIndex--;
            state.visited[state.currentIndex] = true;
            renderQuestion();
            renderPalette();
        }
    }

    function goToNext() {
        if (state.currentIndex < questions.length - 1) {
            state.currentIndex++;
            state.visited[state.currentIndex] = true;
            renderQuestion();
            renderPalette();
        }
    }

    function clearResponse() {
        if (state.testSubmitted) return;
        state.answers[state.currentIndex] = null;
        renderQuestion();
        renderPalette();
    }

    function toggleMark() {
        if (state.testSubmitted) return;
        state.marked[state.currentIndex] = !state.marked[state.currentIndex];
        renderQuestion();
        renderPalette();
    }

    // ============================================================
    // 5. SUBMIT & RESULT
    // ============================================================
    function submitTest(auto = false) {
        if (state.testSubmitted) return;
        state.testSubmitted = true;
        clearInterval(state.timerInterval);

        // Calculate score
        let correct = 0, wrong = 0, skipped = 0;
        for (let i = 0; i < questions.length; i++) {
            const ans = state.answers[i];
            const correctIdx = questions[i].correct;
            if (ans === null) {
                skipped++;
            } else if (ans === correctIdx) {
                correct++;
            } else {
                wrong++;
            }
        }
        const totalScore = correct * 3 - wrong * 1; // +3 correct, -1 wrong
        const attempted = correct + wrong;
        const accuracy = attempted > 0 ? ((correct / attempted) * 100).toFixed(1) : 0;

        // Build result HTML
        let html = `
            <div class="score-summary">
                <div class="score-item"><span class="score-label">Total Score</span><span class="score-value">${totalScore}</span></div>
                <div class="score-item"><span class="score-label">Correct</span><span class="score-value" style="color:#22c55e;">${correct}</span></div>
                <div class="score-item"><span class="score-label">Wrong</span><span class="score-value" style="color:#ef4444;">${wrong}</span></div>
                <div class="score-item"><span class="score-label">Skipped</span><span class="score-value" style="color:#94a3b8;">${skipped}</span></div>
                <div class="score-item"><span class="score-label">Accuracy</span><span class="score-value">${accuracy}%</span></div>
            </div>
            <div class="filter-bar" id="filterBar">
                <button class="filter-btn active" data-filter="all">All (${questions.length})</button>
                <button class="filter-btn" data-filter="correct">Correct (${correct})</button>
                <button class="filter-btn" data-filter="incorrect">Incorrect (${wrong})</button>
                <button class="filter-btn" data-filter="skipped">Unattempted (${skipped})</button>
            </div>
            <div class="solution-list" id="solutionList">
        `;

        // Function to render solution items based on filter
        function renderSolutions(filter = 'all') {
            let solHtml = '';
            for (let i = 0; i < questions.length; i++) {
                const q = questions[i];
                const userAns = state.answers[i];
                const correctIdx = q.correct;
                const isSkipped = userAns === null;
                const isCorrect = userAns === correctIdx;
                const status = isSkipped ? 'skipped' : (isCorrect ? 'correct' : 'incorrect');

                // Apply filter
                if (filter === 'correct' && !isCorrect) continue;
                if (filter === 'incorrect' && (isSkipped || isCorrect)) continue;
                if (filter === 'skipped' && !isSkipped) continue;

                // Status class for border
                const statusClass = isSkipped ? 'skipped' : (isCorrect ? 'correct' : 'incorrect');

                solHtml += `<div class="solution-item ${statusClass}">`;
                solHtml += `<div class="solution-q">Q${i + 1}. ${q.text}</div>`;
                solHtml += `<div class="solution-choices">`;
                q.options.forEach((opt, idx) => {
                    const letter = String.fromCharCode(65 + idx);
                    let tag = '';
                    if (idx === correctIdx) tag += `<span class="tag correct">Correct</span>`;
                    if (idx === userAns) {
                        if (idx === correctIdx) tag += `<span class="tag user">Your Choice</span>`;
                        else tag += `<span class="tag wrong">Your Choice</span>`;
                    }
                    solHtml += `<div class="choice-line"><strong>${letter}.</strong> ${opt} ${tag}</div>`;
                });
                solHtml += `</div>`;
                if (isSkipped) {
                    solHtml += `<div class="solution-answer">⚠️ Not Attempted</div>`;
                } else {
                    const userLetter = String.fromCharCode(65 + userAns);
                    const correctLetter = String.fromCharCode(65 + correctIdx);
                    solHtml += `<div class="solution-answer">Your answer: <strong>${userLetter}</strong> &nbsp;|&nbsp; Correct answer: <strong>${correctLetter}</strong></div>`;
                }
                solHtml += `</div>`;
            }
            document.getElementById('solutionList').innerHTML = solHtml || '<p style="padding:20px;color:#64748b;">No questions match this filter.</p>';
            // Re-render MathJax in modal
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([document.getElementById('solutionList')]).catch(err => console.warn(err));
            }
        }

        html += `</div>`; // close solution-list
        modalBody.innerHTML = html;

        // Initial render of all solutions
        renderSolutions('all');

        // Add filter event listeners
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const filter = btn.dataset.filter;
                renderSolutions(filter);
            });
        });

        // Show overlay
        resultOverlay.classList.remove('hidden');

        // Final render palette to reflect submitted state (no more changes)
        renderPalette();
        renderQuestion(); // to disable further interaction? we check testSubmitted in handlers

        // If auto-submitted due to time
        if (auto) {
            // could show a message, but fine
        }
    }

    // ============================================================
    // 6. DOWNLOAD FUNCTION

            else if (ans === correctIdx) correct++;
            else wrong++;
        }
        const totalScore = correct * 3 - wrong;
        const attempted = correct + wrong;
        const accuracy = attempted > 0 ? ((correct / attempted) * 100).toFixed(1) : 0;

                    else tag += `<span class="tag wrong">Your Choice</span>`;

                htmlContent += `<div class="choice-line"><strong>${letter}.</strong> ${opt} ${tag}</div>`;

            if (isSkipped) {

    // ============================================================
    // 7. EVENT LISTENERS & INIT
    // ============================================================
    prevBtn.addEventListener('click', goToPrev);
    nextBtn.addEventListener('click', goToNext);
    clearBtn.addEventListener('click', clearResponse);
    markBtn.addEventListener('click', toggleMark);
    submitBtn.addEventListener('click', () => {
        if (confirm('Are you sure you want to submit the test?')) {
            submitTest(false);
        }
    });

    closeModalBtn.addEventListener('click', () => {
        resultOverlay.classList.add('hidden');
    });
    closeModalFooterBtn.addEventListener('click', () => {
        resultOverlay.classList.add('hidden');
    });
    downloadBtn.addEventListener('click', downloadPerformance);

    // Close overlay on background click? Optional: not implemented.

    // Initialize
    function init() {
        // Ensure exactly 120 questions
        if (questions.length !== 120) {
            console.warn('Question count is ' + questions.length + ', expected 120. Adjusting...');
            // If less than 120, pad with dummy (should not happen)
            while (questions.length < 120) {
                addQ("Placeholder question", ["A", "B", "C", "D"], 0);
            }
            // If more, truncate
            if (questions.length > 120) questions.length = 120;
        }

        // Reset state arrays to match question count
        state.answers = new Array(questions.length).fill(null);
        state.visited = new Array(questions.length).fill(false);
        state.marked = new Array(questions.length).fill(false);
        state.visited[0] = true;
        state.currentIndex = 0;
        state.testSubmitted = false;

        renderQuestion();
        renderPalette();
        updateTimerDisplay();
        startTimer();

        // Re-enable UI in case of previous submission
        resultOverlay.classList.add('hidden');
    }

    init();
