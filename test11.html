<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ Test · 120 Questions · Mathematics & GK</title>
    <!-- MathJax for LaTeX rendering (no external libraries beyond CDN, but we keep it minimal) -->
    <script>
        MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f2f5f9;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ---------- header with timer ---------- */
        .header {
            background: #1e293b;
            color: white;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .timer {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: #0f172a;
            padding: 6px 20px;
            border-radius: 40px;
            font-variant-numeric: tabular-nums;
            border: 1px solid #334155;
        }
        .timer.warning {
            color: #fca5a5;
            border-color: #ef4444;
        }
        .title {
            font-weight: 500;
            font-size: 1.2rem;
            color: #cbd5e1;
        }

        /* ---------- main layout ---------- */
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 1px;
            background: #e2e8f0;
        }

        /* ---------- question area (left) ---------- */
        .question-area {
            flex: 1;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .question-container {
            flex: 1;
            padding: 28px 32px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: #475569;
        }
        .q-number {
            font-weight: 600;
            background: #eef2ff;
            padding: 6px 16px;
            border-radius: 30px;
            color: #1e3a8a;
        }
        .q-text {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 28px;
            color: #0f172a;
            font-weight: 500;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 20px;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            background: #f8fafc;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 1.1rem;
            color: #1e293b;
            user-select: none;
        }
        .option:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
        }
        .option.selected {
            border-color: #2563eb;
            background: #eff6ff;
            box-shadow: 0 0 0 1px #2563eb;
        }
        .option .opt-letter {
            font-weight: 700;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e2e8f0;
            border-radius: 50%;
            color: #1e293b;
            flex-shrink: 0;
        }
        .option.selected .opt-letter {
            background: #2563eb;
            color: white;
        }

        /* ---------- action buttons ---------- */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 16px 32px 24px;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            flex-shrink: 0;
        }
        .btn {
            padding: 12px 26px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.12s;
            background: #f1f5f9;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn:hover {
            background: #e2e8f0;
        }
        .btn-primary {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        .btn-primary:hover {
            background: #1d4ed8;
        }
        .btn-warning {
            background: #f59e0b;
            color: white;
            border-color: #f59e0b;
        }
        .btn-warning:hover {
            background: #d97706;
        }
        .btn-danger {
            background: #dc2626;
            color: white;
            border-color: #dc2626;
        }
        .btn-danger:hover {
            background: #b91c1c;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #cbd5e1;
        }

        /* ---------- palette (right) ---------- */
        .palette {
            width: 300px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-left: 1px solid #e2e8f0;
            flex-shrink: 0;
        }
        .palette-header {
            padding: 18px 16px 12px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .palette-header h3 {
            font-size: 1rem;
            color: #1e293b;
        }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            font-size: 0.7rem;
            padding: 10px 16px;
            border-bottom: 1px solid #e2e8f0;
            flex-shrink: 0;
            background: #f8fafc;
        }
        .legend span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .legend .dot {
            width: 14px;
            height: 14px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
        }
        .dot.notvisited { background: #f1f5f9; }
        .dot.answered { background: #22c55e; border-color: #16a34a; }
        .dot.notanswered { background: #ef4444; border-color: #dc2626; }
        .dot.marked { background: #a855f7; border-color: #9333ea; }

        .palette-grid {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            align-content: start;
        }
        .palette-item {
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            border: 2px solid #e2e8f0;
            background: #f1f5f9;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.1s;
            user-select: none;
        }
        .palette-item:hover {
            border-color: #94a3b8;
            transform: scale(1.02);
        }
        .palette-item.answered {
            background: #22c55e;
            border-color: #16a34a;
            color: white;
        }
        .palette-item.notanswered {
            background: #ef4444;
            border-color: #dc2626;
            color: white;
        }
        .palette-item.marked {
            background: #a855f7;
            border-color: #9333ea;
            color: white;
        }
        .palette-item.current {
            outline: 3px solid #2563eb;
            outline-offset: 2px;
        }

        /* ---------- overlay / results ---------- */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .overlay.hidden {
            display: none;
        }
        .result-card {
            background: white;
            border-radius: 28px;
            max-width: 1100px;
            width: 100%;
            max-height: 92vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .result-header {
            padding: 24px 32px;
            background: #1e293b;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .result-header h2 {
            font-weight: 500;
            font-size: 1.6rem;
        }
        .stats {
            display: flex;
            gap: 28px;
            font-size: 1.1rem;
            flex-wrap: wrap;
        }
        .stats span {
            background: #334155;
            padding: 6px 18px;
            border-radius: 40px;
        }
        .result-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
        }
        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 8px 22px;
            border-radius: 40px;
            border: 1px solid #cbd5e1;
            background: white;
            font-weight: 500;
            cursor: pointer;
        }
        .filter-btn.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        .review-item {
            border-bottom: 1px solid #e2e8f0;
            padding: 20px 0;
        }
        .review-item:last-child {
            border-bottom: none;
        }
        .review-q {
            display: flex;
            gap: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .review-q .idx {
            color: #2563eb;
            min-width: 40px;
        }
        .review-options {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-left: 52px;
            margin-bottom: 8px;
        }
        .review-opt {
            padding: 8px 14px;
            border-radius: 8px;
            background: #f8fafc;
            border-left: 4px solid transparent;
            font-size: 0.95rem;
        }
        .review-opt.correct {
            background: #dcfce7;
            border-left-color: #22c55e;
        }
        .review-opt.wrong {
            background: #fee2e2;
            border-left-color: #ef4444;
        }
        .review-meta {
            margin-left: 52px;
            font-size: 0.9rem;
            color: #475569;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .badge {
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 0.8rem;
        }
        .badge.correct { background: #22c55e; color: white; }
        .badge.wrong { background: #ef4444; color: white; }
        .badge.skipped { background: #94a3b8; color: white; }

        .download-btn {
            margin-left: auto;
            background: #22c55e;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        .download-btn:hover {
            background: #16a34a;
        }
        .close-btn {
            background: #475569;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            cursor: pointer;
        }

        /* scrollbar aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<!-- ========== HEADER ========== -->
<div class="header">
    <div class="title">📘 MCQ Test · Mathematics (1-90) & GK (91-120)</div>
    <div class="timer" id="timerDisplay">120:00</div>
</div>

<!-- ========== MAIN ========== -->
<div class="main" id="mainApp">
    <!-- Question area -->
    <div class="question-area">
        <div class="question-container" id="questionContainer">
            <div class="q-header">
                <span class="q-number" id="qNumber">Question 1 of 120</span>
                <span id="qStatusTag" style="font-size:0.85rem; color:#64748b;">Not visited</span>
            </div>
            <div class="q-text" id="qText"></div>
            <div class="options" id="optionsContainer"></div>
        </div>
        <div class="actions">
            <button class="btn" id="prevBtn">◀ Previous</button>
            <button class="btn btn-primary" id="nextBtn">Next ▶</button>
            <button class="btn btn-outline" id="clearBtn">Clear Response</button>
            <button class="btn btn-warning" id="markBtn">Mark for Review</button>
            <button class="btn btn-danger" id="submitBtn" style="margin-left:auto;">Submit Test</button>
        </div>
    </div>

    <!-- Palette -->
    <div class="palette">
        <div class="palette-header">
            <h3>Question Palette</h3>
            <span style="font-size:0.8rem; color:#64748b;" id="paletteCounter">0 / 120</span>
        </div>
        <div class="legend">
            <span><span class="dot notvisited"></span> Not Visited</span>
            <span><span class="dot answered"></span> Answered</span>
            <span><span class="dot notanswered"></span> Not Answered</span>
            <span><span class="dot marked"></span> Marked</span>
        </div>
        <div class="palette-grid" id="paletteGrid"></div>
    </div>
</div>

<!-- ========== OVERLAY / RESULT ========== -->
<div class="overlay hidden" id="resultOverlay">
    <div class="result-card" id="resultCard">
        <div class="result-header">
            <h2>📊 Performance & Solutions</h2>
            <div class="stats" id="statsContainer"></div>
            <button class="download-btn" id="downloadBtn">⬇ Download Report</button>
            <button class="close-btn" id="closeResultBtn">✕ Close</button>
        </div>
        <div class="result-body" id="resultBody">
            <div class="filter-bar" id="filterBar">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="correct">Correct</button>
                <button class="filter-btn" data-filter="incorrect">Incorrect</button>
                <button class="filter-btn" data-filter="unattempted">Unattempted</button>
            </div>
            <div id="reviewList"></div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // 1.  QUESTIONS DATA  (120 questions: 1-90 Math, 91-120 GK)
    // ============================================================
    const questions = [
        // ---- Mathematics (1–90) ----
        { text: "The Green's function for $y'' + 5y' + 6y = \\cos x$, is--", options: ["$2e^{2(t-x)} + 3e^{3(t-x)}$", "$e^{2(t-x)} - e^{3(t-x)}$", "$2e^{2(t-x)} - 3e^{3(t-x)}$", "$e^{2(t-x)} - e^{3(t-x)}$"], correct: 3 },
        { text: "The plane, that has three points of contact at the origin with the curve $x = t^4 - 1$; $y = t^3 - 1$; $z = t^2 - 1$, is:", options: ["$3x - 8y + z = 0$", "$3x - 8y + 6z = 0$", "$3x + 8y + z = 0$", "$3x + 8y + 6z = 0$"], correct: 2 },
        { text: "The envelope of the plane $lx + my + nz = 0$, where $a^2 l^2 + b^2 m^2 + c^2 n^2 = 0$, is:", options: ["$\\left(\\frac{x}{a}\\right)^{\\frac{2}{3}} + \\left(\\frac{y}{b}\\right)^{\\frac{2}{3}} + \\left(\\frac{z}{c}\\right)^{\\frac{2}{3}} = 0$", "$\\frac{x^2}{a^2} + \\frac{y^2}{b^2} + \\frac{z^2}{c^2} = 0$", "$\\frac{x}{a} + \\frac{y}{b} + \\frac{z}{c} = 0$", "$\\left(\\frac{x}{a}\\right)^2 + \\left(\\frac{y}{b}\\right)^2 + \\left(\\frac{z}{c}\\right)^2 = 0$"], correct: 3 },
        { text: "The rectifying plane at any point on a curve in space contains the unit vectors (in usual notations):", options: ["$\\hat{n}$ and $\\hat{b}$", "$\\hat{t}$ and $\\hat{n}$", "$\\hat{t}$ and $\\hat{b}$", "$\\hat{b}$ and $\\hat{n}$"], correct: 2 },
        { text: "A bag contains 2 white, 4 black and 5 red balls. Three balls are drawn from it at random. What is the probability that two balls are of the same color and the third is different?", options: ["$\\frac{3}{35}$", "$\\frac{37}{55}$", "$\\frac{2}{11}$", "$\\frac{4}{165}$"], correct: 1 },
        { text: "Sturm-Liouville boundary value problem has--", options: ["Only trivial solution", "Only non-trivial solution", "Both trivial and non-trivial solution", "None of these"], correct: 2 },
        { text: "The matrix of the components of the fundamental tensor with respect to three dimensional rectangular axes is--", options: ["Unit matrix", "Row matrix", "Column matrix", "Null matrix"], correct: 0 },
        { text: "A particle of unit mass moves in the $xy$-plane under the influence of a central force depending only on its distance from the origin. If $(r, \\theta)$ be the polar co-ordinates of the particle at a given instant and $V(r)$ the potential due to the given force, then the Lagrangian for such a system is--", options: ["$\\frac{1}{2} m (\\dot{r}^2 + \\dot{\\theta}^2) + V(r)$", "$\\frac{1}{2} m (\\dot{r}^2 + r^2 \\dot{\\theta}^2) + V(r)$", "$\\frac{1}{2} (\\dot{r}^2 + r^2 \\dot{\\theta}^2) - V(r)$", "$r^2 \\dot{\\theta} - V(r)$"], correct: 2 },
        { text: "If $d(x,y) = \\begin{cases} 1, & \\text{if } x \\neq y \\\\ 0, & \\text{if } x = y \\end{cases}$, where $A$ is an arbitrary non empty set, is metric on $A$, then the metric space $(A, d)$ is called--", options: ["Tchebychev metric space", "Euclidean metric space", "Discrete metric space", "None of these"], correct: 2 },
        { text: "For Legendre polynomial, $\\int_{-1}^{1} (1+x) P_2(x) dx =$", options: ["$4/15$", "$4/5$", "$0$", "$2/5$"], correct: 0 },
        { text: "If $E(x) = 4$ and $E(x^2) = 17$, then $P(-1 < x < 9)$ greater than--", options: ["$\\frac{24}{25}$", "$\\frac{4}{25}$", "$\\frac{1}{25}$", "$\\frac{24}{25}$"], correct: 0 },
        { text: "For the metric $ds^2 = (dx^1)^2 + (dx^2)^2 G(x^1, x^2)$, the Christoffel symbol $[22, 2]$ is--", options: ["$\\frac{\\partial}{\\partial x^1} G(x^1, x^2)$", "$2 G(x^1, x^2) \\frac{\\partial G}{\\partial x^2}$", "Unit", "$\\frac{1}{2} \\frac{\\partial}{\\partial x^2} G(x^1, x^2)$"], correct: 3 },
        { text: "Laplace transform of greatest integer function $[t]$, is--", options: ["$\\frac{1}{p(e^p + 1)}$", "$\\frac{1}{p(e^p - 1)}$", "$\\frac{1}{p(e^{-p} + 1)}$", "$\\frac{1}{p(e^{-p} - 1)}$"], correct: 1 },
        { text: "Dual problem of the linear programming problem: $\\text{Max } Z = 3x_1 + 2x_2 + x_3$ s.t. $-3x_1 + 2x_2 + 2x_3 + x_4 = 8$; $-3x_1 + 4x_2 + x_3 + x_5 = 7$; $x_j \\geq 0$ has--", options: ["Unbounded solution", "Infeasible solution", "Degenerate solution", "None of these"], correct: 1 },
        { text: "If $f(\\vec{r}) = 0$ and $\\psi(\\vec{r}) = 0$ represent two surfaces, then, in usual notations, the equation of any plane through the tangent line to the curve of intersection of these two surfaces, is given by--", options: ["$F = (\\vec{R} - \\vec{r}_0) \\cdot [\\nabla f + \\lambda \\nabla \\psi] = 0$", "$F = (\\vec{R} - \\vec{r}_0) \\cdot \\nabla f - \\lambda (\\vec{R} - \\vec{r}_0) = 0$", "$F = (\\vec{R} - \\vec{r}_0) \\cdot \\nabla f \\times \\nabla \\psi = 0$", "$F = (\\vec{R} - \\vec{r}_0) \\times [\\nabla f + \\lambda \\nabla \\psi] = 0$"], correct: 0 },
        { text: "In an assignment problem maximum number of lines covering all zeros in reduced cost matrix of order $n$ can be", options: ["$n+1$", "$n-1$", "$n-2$", "$n$"], correct: 3 },
        { text: "General solution of Gauss hypergeometric equation $x(1-x)\\frac{d^2y}{dx^2} + [c - (a+b+1)x]\\frac{dy}{dx} - aby = 0$, about its singular point $x = 0$ is--", options: ["$y = A x^a {}_2F_1(a, a-c+1; a-b+1; x) + B x^b {}_2F_1(b, b-c+1; b-a+1; x)$", "$y = A {}_2F_1(a, b; a+b-c+1; 1-x) + B(1-x)^{c-a-b} {}_2F_1(c-a, c-b; c-a-b+1; 1-x)$", "$y = A {}_2F_1(a, b, c; x) + B x^{1-c} {}_2F_1(a-c+1, b-c+1, 2-c; x)$", "$y = A {}_2F_1(a, b; c; x)$"], correct: 2 },
        { text: "In a linear programming problem with $m$ restrictions in $n$ variables, ($m \\leq n$), the maximum number of basic feasible solutions can be--", options: ["${}^n C_{m-1}$", "${}^n C_m$", "${}^n C_{m-2}$", "${}^n C_m$"], correct: 3 },
        { text: "The necessary and sufficient condition for the two family of curves given by $P du^2 + 2Q du dv + R dv^2 = 0$, to be orthogonal, is:", options: ["$ER - GP - 2FQ = 0$", "$ER + GP - 2FQ = 0$", "$ER + GP + 2FQ = 0$", "$ER - GP + 2FQ = 0$"], correct: 1 },
        { text: "Resolvent kernel for the integral equation: $u(x) = 1 + \\int_0^x u(t) dt$ is $R(x, t) = e^{(x-t)}$, then its solution is--", options: ["$u(x) = -e^x$", "$u(x) = e^{-x}$", "$u(x) = e^{2x}$", "$u(x) = e^x$"], correct: 3 },
        { text: "For maximization linear programming problem, coefficient for an artificial variable in the objective function is taken as--", options: ["$M$", "$2$", "$-1$", "$-M$"], correct: 3 },
        { text: "For Bessel's functions $\\frac{d}{dx} [x^n J_n(x)] =$", options: ["$J_{n-1}(x) - J_n(x)$", "$J_n(x) - J_{n+1}(x)$", "$J_{n-1}(x) - J_{n+1}(x)$", "$J_{n-1}(x) - J_n(x)$"], correct: 3 },

        { text: "For a $V_2$, $g_{11} = E$; $g_{12} = F = g_{21}$; $g_{22} = G$ then value of $g$ is", options: ["$FG - E^2$", "$E - G^2$", "$FG - F^2$", "$EG - F^2$"], correct: 3 },

        { text: "D' Alembert's principle is used for which one of the following?", options: ["Change a dynamic problem into a static problem.", "To calculate moment of inertia of rigid bodies.", "Change a static problem into a dynamic problem.", "To calculate angular momentum of a system of masses."], correct: 0 },

        { text: "Given a rectangular lamina of side $2a$ and $2b$. Moment of inertia of this rectangular lamina about a line passing through centre and parallel to the side $2b$, is", options: ["$\\frac{1}{3} Ma^2$", "$\\frac{4}{3} Mb^2$", "$\\frac{1}{3} Mb^2$", "$\\frac{4}{3} Ma^2$"], correct: 0 },
        // ---- GK (91–120) ----
        { text: "The 16th BRICS Summit in October 2024, the first after its formal expansion, was hosted under Russia’s chairmanship in which city?", options: ["Moscow", "Saint Petersburg", "Kazan", "Sochi"], correct: 2 },
        { text: "What is the primary scientific objective of ISRO's upcoming 'Shukrayaan-1' mission?", options: ["Surface rover analysis on Mars", "Orbital study of the atmosphere and surface chemistry of Venus", "Deep subsurface exploration of the Moon", "Asteroid redirection and deflection"], correct: 1 },
        { text: "The 2024 ICC Women's T20 World Cup tournament was hosted by which country after being relocated from Bangladesh?", options: ["India", "United Arab Emirates (UAE)", "Sri Lanka", "South Africa"], correct: 1 },
        { text: "The 2024 Nobel Prize in Chemistry was awarded partly to Demis Hassabis and John Jumper for developing which AI system that solved the 50-year-old biological challenge of protein structure prediction?", options: ["AlphaGo", "AlphaFold", "DeepBio", "CRISPR-Net"], correct: 1 },
        { text: "Justice Sanjiv Khanna was appointed as which numbered Chief Justice of India (CJI), succeeding Justice D.Y. Chandrachud?", options: ["50th", "51st", "52nd", "53rd"], correct: 1 },
        { text: "In educational psychology, the instructional technique of providing temporary support to learners that is gradually withdrawn as they develop autonomy is known as:", options: ["Conditioning", "Scaffolding", "Deductive drilling", "Rote memorization"], correct: 1 },
        { text: "A qualitative research method in which a researcher immerses themselves within a social group or cultural setting to observe everyday practices and behavior firsthand is termed:", options: ["Ethnography", "Ex-post facto research", "Meta-analysis", "Correlational modeling"], correct: 0 },
        { text: "In sampling methodology, 'Stratified Random Sampling' is most appropriately chosen when the target population is:", options: ["Completely uniform and homogeneous", "Small and concentrated in one geographic area", "Heterogeneous and divisible into distinct, mutually exclusive subgroups (strata)", "Unknown and impossible to list"], correct: 2 },
        { text: "The National Institutional Ranking Framework (NIRF), which annually ranks Indian higher education institutions across defined parameters, was launched by the Ministry of Education in the year:", options: ["2010", "2012", "2015", "2020"], correct: 2 },
        { text: "When an assessment instrument consistently yields the same results upon repeated administrations under identical conditions, the test is said to possess high:", options: ["Validity", "Reliability", "Objectivity", "Usability"], correct: 1 },
        { text: "In computer storage hardware, what does 'SSD' stand for?", options: ["Static System Disk", "Solid State Drive", "Synchronous Storage Device", "Serial Sector Drive"], correct: 1 },
        { text: "Which unique hardware identifier, permanently assigned to a Network Interface Card (NIC) by its manufacturer, functions as the physical address of a device on a local network?", options: ["IP Address", "MAC Address", "Subnet Mask", "Default Gateway"], correct: 1 },
        { text: "In cloud computing models, what does the service architecture acronym 'SaaS' stand for?", options: ["Storage as a Service", "System as a Solution", "Software as a Service", "Security as a Service"], correct: 2 },
        { text: "When sending an email, which field ensures that a recipient's email address remains invisible to all other recipients of the message?", options: ["CC (Carbon Copy)", "Subject line", "BCC (Blind Carbon Copy)", "Reply-to header"], correct: 2 },
        { text: "Software whose human-readable source code is made freely available to the public for viewing, modification, and redistribution is categorized as:", options: ["Proprietary software", "Open-source software", "Firmware", "Commercial off-the-shelf software"], correct: 1 },
        { text: "'Fly ash', a fine particulate pollutant containing heavy metals like arsenic, lead, and silica, is primarily produced as a waste product of:", options: ["Nuclear power stations", "Coal-based thermal power plants", "Hydroelectric dam operations", "Textile bleaching units"], correct: 1 },
        { text: "In population ecology, the theoretical maximum population size of a given species that a specific habitat can sustainably support without environmental degradation is known as its:", options: ["Biotic potential", "Environmental threshold", "Carrying capacity", "Ecological equilibrium"], correct: 2 },
        { text: "Which international supplementary agreement to the Convention on Biological Diversity (CBD) specifically governs the safe transfer, handling, and use of living modified organisms (LMOs)?", options: ["Basel Convention", "Cartagena Protocol on Biosafety", "Rotterdam Convention", "Minamata Convention"], correct: 1 },
        { text: "The Central Pollution Control Board (CPCB), an apex statutory organization in India, was initially established under the statutory provisions of which Act?", options: ["Water (Prevention and Control of Pollution) Act, 1974", "Air (Prevention and Control of Pollution) Act, 1981", "Environment (Protection) Act, 1986", "National Green Tribunal Act, 2010"], correct: 0 },
        { text: "The process known as 'Bioaccumulation' specifically refers to the:", options: ["Natural decomposition of organic waste by soil microbes", "Gradual buildup of toxic chemicals inside an individual organism over time", "Rapid multiplication of algae across freshwater bodies", "Settling of particulate matter in the lower atmosphere"], correct: 1 },
        { text: "The ancient 'Sangam' literary corpus, composed of anthologies celebrating ethics, heroism, and court life, was written in which classical Indian language?", options: ["Sanskrit", "Prakrit", "Tamil", "Pali"], correct: 2 },
        { text: "The socio-political organization 'Servants of India Society' was founded in Pune in 1905 by which nationalist leader?", options: ["Gopal Krishna Gokhale", "Bal Gangadhar Tilak", "Mahadev Govind Ranade", "Dadabhai Naoroji"], correct: 0 },
        { text: "Which planet in our Solar System currently holds the record for the highest number of recognized natural satellites (moons)?", options: ["Jupiter", "Saturn", "Uranus", "Neptune"], correct: 1 },
        { text: "The 'Duncan Passage' is a navigable strait in the Indian Ocean that separates which two territories?", options: ["North Andaman and Middle Andaman", "South Andaman and Little Andaman", "Little Andaman and Car Nicobar", "Lakshadweep and Minicoy"], correct: 1 },
        { text: "The Kakori Train Action (historically known as the Kakori Conspiracy), organized by the Hindustan Republican Association (HRA), took place in which year?", options: ["1922", "1925", "1928", "1931"], correct: 1 },
        { text: "Which right was repealed as a Fundamental Right under Article 19(1)(f) and Article 31, and reclassified as a Constitutional/Legal Right under Article 300A by the 44th Constitutional Amendment Act, 1978?", options: ["Right to Freedom of Religion", "Right to Property", "Right against Exploitation", "Right to Constitutional Remedies"], correct: 1 },
        { text: "What is the constitutional quorum required to conduct a valid sitting of either House of the Parliament of India?", options: ["One-fifth of the total membership of the House", "One-tenth of the total membership of the House", "One-third of the total membership of the House", "Fifty members present and voting"], correct: 1 },
        { text: "Under which Article of the Indian Constitution does the President constitute the Finance Commission every five years?", options: ["Article 268", "Article 280", "Article 300", "Article 312"], correct: 1 },
        { text: "The interest rate at which the Reserve Bank of India (RBI) borrows liquid funds from domestic commercial banks on a short-term basis against government securities is called the:", options: ["Repo Rate", "Bank Rate", "Reverse Repo Rate", "Marginal Standing Facility (MSF) Rate"], correct: 2 },
        { text: "In classical economics, the Malthusian Theory of Population argues that population grows in a:", options: ["Geometric progression while food production grows in an arithmetic progression", "Arithmetic progression while food production grows in a geometric progression", "Logarithmic curve while food production remains strictly stagnant", "Linear progression matching agricultural yields exactly"], correct: 0 }
    ];

    // ============================================================
    // 2.  STATE
    // ============================================================
    const TOTAL = questions.length; // 120
    let currentIndex = 0;
    let userAnswers = new Array(TOTAL).fill(null);       // selected option index or null
    let visited = new Array(TOTAL).fill(false);
    let marked = new Array(TOTAL).fill(false);
    let timerInterval = null;
    let timeLeft = 120 * 60; // 120 minutes in seconds
    let submitted = false;

    // DOM refs
    const timerDisplay = document.getElementById('timerDisplay');
    const qNumber = document.getElementById('qNumber');
    const qText = document.getElementById('qText');
    const optionsContainer = document.getElementById('optionsContainer');
    const paletteGrid = document.getElementById('paletteGrid');
    const paletteCounter = document.getElementById('paletteCounter');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const clearBtn = document.getElementById('clearBtn');
    const markBtn = document.getElementById('markBtn');
    const submitBtn = document.getElementById('submitBtn');
    const qStatusTag = document.getElementById('qStatusTag');
    const resultOverlay = document.getElementById('resultOverlay');
    const statsContainer = document.getElementById('statsContainer');
    const reviewList = document.getElementById('reviewList');
    const filterBar = document.getElementById('filterBar');
    const closeResultBtn = document.getElementById('closeResultBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    // ============================================================
    // 3.  RENDER FUNCTIONS
    // ============================================================
    function renderQuestion(index) {
        if (index < 0 || index >= TOTAL) return;
        currentIndex = index;
        visited[index] = true;

        const q = questions[index];
        qNumber.textContent = `Question ${index + 1} of ${TOTAL}`;
        qText.innerHTML = q.text;

        // status tag
        if (marked[index]) qStatusTag.textContent = 'Marked for review';
        else if (userAnswers[index] !== null) qStatusTag.textContent = 'Answered';
        else if (visited[index]) qStatusTag.textContent = 'Not answered';
        else qStatusTag.textContent = 'Not visited';

        // options
        optionsContainer.innerHTML = '';
        const letters = ['A', 'B', 'C', 'D'];
        q.options.forEach((opt, i) => {
            const div = document.createElement('div');
            div.className = 'option' + (userAnswers[index] === i ? ' selected' : '');
            div.innerHTML = `<span class="opt-letter">${letters[i]}</span><span>${opt}</span>`;
            div.addEventListener('click', () => toggleOption(i));
            optionsContainer.appendChild(div);
        });

        // Re-render MathJax
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise([qText, optionsContainer]).catch(() => {});
        }

        updatePalette();
        updateButtons();
    }

    function toggleOption(optIndex) {
        if (submitted) return;
        if (userAnswers[currentIndex] === optIndex) {
            userAnswers[currentIndex] = null; // deselect
        } else {
            userAnswers[currentIndex] = optIndex;
        }
        renderQuestion(currentIndex);
    }

    function updatePalette() {
        paletteGrid.innerHTML = '';
        for (let i = 0; i < TOTAL; i++) {
            const div = document.createElement('div');
            div.className = 'palette-item';
            if (i === currentIndex) div.classList.add('current');
            if (userAnswers[i] !== null) div.classList.add('answered');
            else if (marked[i]) div.classList.add('marked');
            else if (visited[i]) div.classList.add('notanswered');
            // else notvisited (default)
            div.textContent = i + 1;
            div.addEventListener('click', () => {
                if (!submitted) renderQuestion(i);
            });
            paletteGrid.appendChild(div);
        }
        const answeredCount = userAnswers.filter(a => a !== null).length;
        paletteCounter.textContent = `${answeredCount} / ${TOTAL}`;
    }

    function updateButtons() {
        prevBtn.disabled = (currentIndex === 0);
        nextBtn.disabled = (currentIndex === TOTAL - 1);
    }

    // ============================================================
    // 4.  TIMER
    // ============================================================
    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (submitted) return;
            timeLeft--;
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            timerDisplay.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            if (timeLeft <= 300) timerDisplay.classList.add('warning');
            else timerDisplay.classList.remove('warning');
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                autoSubmit();
            }
        }, 1000);
    }

    function autoSubmit() {
        if (!submitted) submitTest(true);
    }

    // ============================================================
    // 5.  SUBMIT & RESULTS
    // ============================================================
    function submitTest(auto = false) {
        if (submitted) return;
        submitted = true;
        clearInterval(timerInterval);

        let correct = 0, wrong = 0, skipped = 0;
        for (let i = 0; i < TOTAL; i++) {
            if (userAnswers[i] === null) skipped++;
            else if (userAnswers[i] === questions[i].correct) correct++;
            else wrong++;
        }
        const totalAttempted = correct + wrong;
        const score = correct * 3 - wrong * 1;
        const accuracy = totalAttempted > 0 ? ((correct / totalAttempted) * 100).toFixed(2) : '0.00';

        // stats
        statsContainer.innerHTML = `
            <span>✅ ${correct}</span>
            <span>❌ ${wrong}</span>
            <span>⬜ ${skipped}</span>
            <span>🏆 Score: ${score}</span>
            <span>🎯 Accuracy: ${accuracy}%</span>
        `;

        // build review
        renderReview('all');
        resultOverlay.classList.remove('hidden');
        updatePalette();
    }

    function renderReview(filter) {
        reviewList.innerHTML = '';
        let items = [];
        for (let i = 0; i < TOTAL; i++) {
            const ua = userAnswers[i];
            const correctIdx = questions[i].correct;
            const isCorrect = ua === correctIdx;
            const isSkipped = ua === null;

            if (filter === 'correct' && !isCorrect) continue;
            if (filter === 'incorrect' && (isCorrect || isSkipped)) continue;
            if (filter === 'unattempted' && !isSkipped) continue;

            items.push({ index: i, ua, correctIdx, isCorrect, isSkipped });
        }

        items.forEach(({ index, ua, correctIdx, isCorrect, isSkipped }) => {
            const q = questions[index];
            const letters = ['A', 'B', 'C', 'D'];
            const div = document.createElement('div');
            div.className = 'review-item';

            let statusBadge = '';
            if (isSkipped) statusBadge = '<span class="badge skipped">Unattempted</span>';
            else if (isCorrect) statusBadge = '<span class="badge correct">Correct</span>';
            else statusBadge = '<span class="badge wrong">Incorrect</span>';

            let optionsHtml = '';
            q.options.forEach((opt, oi) => {
                let cls = 'review-opt';
                if (oi === correctIdx) cls += ' correct';
                if (oi === ua && oi !== correctIdx) cls += ' wrong';
                optionsHtml += `<div class="${cls}">${letters[oi]}. ${opt}</div>`;
            });

            const userChoiceText = ua !== null ? `${letters[ua]}. ${q.options[ua]}` : '—';
            const correctChoiceText = `${letters[correctIdx]}. ${q.options[correctIdx]}`;

            div.innerHTML = `
                <div class="review-q">
                    <span class="idx">Q${index + 1}.</span>
                    <span>${q.text}</span>
                </div>
                <div class="review-options">${optionsHtml}</div>
                <div class="review-meta">
                    <span>Your answer: <strong>${userChoiceText}</strong></span>
                    <span>Correct answer: <strong>${correctChoiceText}</strong></span>
                    ${statusBadge}
                </div>
            `;
            reviewList.appendChild(div);
        });

        // MathJax in review
        if (window.MathJax && MathJax.typesetPromise) {
            MathJax.typesetPromise([reviewList]).catch(() => {});
        }
    }

    // ============================================================
    // 6.  FILTER EVENTS
    // ============================================================
    filterBar.addEventListener('click', (e) => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderReview(btn.dataset.filter);
    });

    // ============================================================
    // 7.  DOWNLOAD REPORT
    // ============================================================
    downloadBtn.addEventListener('click', () => {
        const content = document.getElementById('resultCard').cloneNode(true);
        // remove buttons from clone
        content.querySelectorAll('button').forEach(b => b.remove());

        const style = document.querySelector('style').innerHTML;
        const html = `
            <!DOCTYPE html>
            <html>
            <head><meta charset="UTF-8"><title>Performance Report</title>
            <style>${style}</style>
            <script>window.MathJax = { tex: { inlineMath: [['$','$']] } };<\/script>
            <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async><\/script>
            </head>
            <body style="background:#f2f5f9; padding:20px;">
                <div style="max-width:1100px; margin:0 auto;">${content.outerHTML}</div>
            </body>
            </html>
        `;
        const blob = new Blob([html], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'performance_report.html';
        a.click();
        URL.revokeObjectURL(url);
    });

    // ============================================================
    // 8.  EVENT LISTENERS
    // ============================================================
    prevBtn.addEventListener('click', () => { if (currentIndex > 0) renderQuestion(currentIndex - 1); });
    nextBtn.addEventListener('click', () => { if (currentIndex < TOTAL - 1) renderQuestion(currentIndex + 1); });
    clearBtn.addEventListener('click', () => {
        if (submitted) return;
        userAnswers[currentIndex] = null;
        renderQuestion(currentIndex);
    });
    markBtn.addEventListener('click', () => {
        if (submitted) return;
        marked[currentIndex] = !marked[currentIndex];
        renderQuestion(currentIndex);
    });
    submitBtn.addEventListener('click', () => {
        if (!submitted) {
            if (confirm('Are you sure you want to submit the test?')) submitTest();
        }
    });
    closeResultBtn.addEventListener('click', () => {
        resultOverlay.classList.add('hidden');
    });

    // ============================================================
    // 9.  INIT
    // ============================================================
    function init() {
        renderQuestion(0);
        startTimer();
        // Mark first as visited
        visited[0] = true;
        updatePalette();
    }

    init();
</script>
</body>
</html>
