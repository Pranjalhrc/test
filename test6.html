            border-radius: 40px;

            align-self: center;

    <script>

            // Part 1: Mathematics (1-90)
            { text: "Curves \\(f(x,y) = 0\\) and \\(g(x,y) = 0\\) touch each other, then at the point of contact:-", options: ["\\(\\frac{\\partial f}{\\partial x}\\cdot \\frac{\\partial f}{\\partial y} = \\frac{\\partial g}{\\partial x}\\cdot \\frac{\\partial g}{\\partial y}\\)", "\\(\\frac{\\partial f}{\\partial x}\\cdot \\frac{\\partial g}{\\partial y} = \\frac{\\partial f}{\\partial y}\\cdot \\frac{\\partial g}{\\partial x}\\)", "\\(\\frac{\\partial f}{\\partial x}\\cdot \\frac{\\partial g}{\\partial x} = \\frac{\\partial f}{\\partial y}\\cdot \\frac{\\partial g}{\\partial y}\\)", "None of these"], correct: 1 },

            { text: "IF \\(U = f(\\frac{y - x}{xy}) + g(\\frac{z - x}{xz})\\) , then \\(x^2\\frac{\\partial U}{\\partial x} + y^2\\frac{\\partial U}{\\partial y} + z^2\\frac{\\partial U}{\\partial z}\\) is equal to:-", options: ["0", "1", "u", "xyz"], correct: 0 },
            { text: "If \\(U = f(x - y,y - z,z - x)\\) , then \\(\\frac{\\partial u}{\\partial x} + \\frac{\\partial u}{\\partial y} + \\frac{\\partial u}{\\partial z}\\) is equal to:-", options: ["0", "1", "u", "xyz"], correct: 1 },

            { text: "For the function \\(u = x^{3} + y^{3} - 3axy\\) , Which of the following statement is true?", options: ["(0,0) is a point of maxima", "(0,0) is a point of minima", "\\((a,a)\\) is a point of maxima if \\(a< 0\\)", "\\((a,a)\\) is a point of maxima if \\(a > 0\\)"], correct: 2 },
            { text: "Envelope of the Parabola \\(\\frac{x}{a} +\\frac{y}{b} = 1\\) , when \\(ab = 16\\) is:-", options: ["Astroid", "Parabola", "Ellipse", "Hyperbola"], correct: 0 },
            { text: "The asymptotes of the curve \\((x^{2} - y^{2})(x + 2y + 1) + x + y + 1 = 0\\) are:-", options: ["\\(y = x;x + 2y + 1 = 0\\)", "\\(y = x;x + y + 1 = 0\\)", "\\(y = x + 2y + 1 = 0\\) and \\(x + y + 1 = 0\\)", "\\(y = -x;x + 2y + 1 = 0\\) and \\(x + y + 1 = 0\\)"], correct: 0 },
            { text: "The asymptote of the curve \\(r = \\frac{a\\theta}{\\theta - 1}\\) is:-", options: ["\\(r\\sin (\\theta -1) = a\\)", "\\(ra\\sin (\\theta +1) = 0\\)", "\\(r\\cos (\\theta -1) = a\\)", "\\(ra\\cos (\\theta +1) = a\\)"], correct: 0 },
            { text: "Curve which passes through points of intersection of the curve \\(x^{2}y - y^{2}x + 9y^{2} + 4x^{2} - 36 = 0\\) and its asymptotes, is:-", options: ["Circle", "Parabola", "Hyperbola", "Ellipse"], correct: 2 },
            { text: "The value of \\(x\\) for points of inflexion of the curve \\(f(x) = \\sin x + \\cos x\\) in \\([\\frac{\\pi}{2},2\\pi ]\\) are", options: ["\\(\\frac{\\pi}{4},\\frac{7\\pi}{4}\\)", "\\(\\frac{\\pi}{4},\\frac{3\\pi}{4}\\)", "\\(\\frac{3\\pi}{4},\\frac{7\\pi}{4}\\)", "\\(\\frac{5\\pi}{4},\\frac{7\\pi}{4}\\)"], correct: 2 },
            { text: "The point \\((2,1)\\) on the curve \\((x - 2)^2 = y(y - 1)^2\\) is a-", options: ["Cusp", "Node", "Conjugate Point", "Not a double point"], correct: 1 },

            { text: "The length of the arc from the vertex to any point on the cycloid \\(x = a(t + \\sin t)\\) , \\(y = a(1 - \\cos t)\\) is :", options: ["\\(a\\sin (t / 2)\\)", "\\(2a\\sin (t / 2)\\)", "\\(4a\\sin (t / 2)\\)", "\\(4a\\cos (t / 2)\\)"], correct: 2 },

            { text: "The lines \\(x = py + q;z = ry + s\\) and \\(x = ay + b;z = cy + d\\) are perpendicular to each other, if:", options: ["\\(ap + cr = -1\\)", "\\(ap + cr = 1\\)", "\\(ac + pr = 1\\)", "\\(ac + pr = -1\\)"], correct: 0 },
            { text: "The Radius vector of the conic \\(\\frac{l}{r} = 1 - \\cos \\theta\\) be Minimum, if:", options: ["\\(\\theta = 0\\)", "\\(\\theta = \\pi /2\\)", "\\(\\theta = \\pi\\)", "\\(\\theta = 2\\pi\\)"], correct: 2 },
            { text: "The two conics \\(\\frac{2\\sqrt{3}l}{r} = \\sqrt{3} +\\cos \\theta\\) and \\(\\frac{\\sqrt{3}l}{r} = \\sqrt{3} +\\cos (\\theta +\\pi /3)\\) touch each other, if \\(\\theta =\\)", options: ["\\(\\theta = \\pi\\)", "\\(\\theta = \\pi /2\\)", "\\(\\theta = 0\\)", "\\(\\theta = 2\\pi /3\\)"], correct: 1 },
            { text: "A plane is rotated about the straight line \\(lx + my = 0;z = 0\\) through an angle \\(\\alpha\\) . Equation of the plane in new position is:", options: ["\\(lx + my\\pm nz\\tan \\alpha = 0\\)", "\\(lx + my\\pm \\sqrt{l^2 + m^2} z\\tan \\alpha = 0\\)", "\\(lx + my - \\tan \\alpha = 0\\)", "\\(lx + my + \\tan \\alpha = \\sqrt{l^2 + m^2}\\)"], correct: 1 },

            { text: "Which standard internet protocol is primarily used by local email clients to retrieve and sync messages from a remote mail server?", options: ["SMTP", "FTP", "IMAP", "VoIP"], correct: 2 },
            { text: "A 'VPN' is commonly used to establish a secure, encrypted connection over a less secure network. What does VPN stand for?", options: ["Verified Public Node", "Virtual Private Network", "Visual Processing Network", "Variable Protocol Node"], correct: 1 },
            { text: "The practice of utilizing a network of remote servers hosted on the internet to store, manage, and process data, rather than using a local server or a personal computer, is termed:", options: ["Edge computing", "Cloud computing", "Grid computing", "Parallel processing"], correct: 1 },
            { text: "The international treaty known as the 'Convention on Biological Diversity' (CBD) was officially opened for signature at which historic global event?", options: ["1972 Stockholm Conference", "1992 Earth Summit in Rio de Janeiro", "1997 Kyoto Conference", "2015 Paris Climate Agreement"], correct: 1 },
            { text: "Biochemical Oxygen Demand (BOD) is a standard metric used by environmental scientists primarily to evaluate the:", options: ["Level of organic pollution in a body of water", "Concentration of heavy metals in soil", "Amount of ozone depletion in the stratosphere", "Density of particulate matter in the air"], correct: 0 },
            { text: "In the National Air Quality Index (AQI) framework, the pollutant parameter 'PM2.5' refers to fine inhalable particles with a diameter of 2.5:", options: ["Millimeters or less", "Centimeters or less", "Micrometers (microns) or less", "Nanometers or less"], correct: 2 },
            { text: "In ecology, a 'keystone species' is best defined as a species that:", options: ["Has the largest population size in a given ecosystem", "Is the most physically massive organism in a habitat", "Has a disproportionately large and critical effect on its environment relative to its abundance", "Is an invasive species introduced by human activity"], correct: 2 },
            { text: "The environmental phenomenon known as 'ocean acidification' is primarily caused by the ocean's increased absorption of which atmospheric gas?", options: ["Methane", "Carbon dioxide", "Nitrous oxide", "Sulfur dioxide"], correct: 1 },
            { text: "Who was the British Viceroy of India responsible for implementing the controversial partition of Bengal in 1905?", options: ["Lord Dalhousie", "Lord Mountbatten", "Lord Curzon", "Lord Irwin"], correct: 2 },
            { text: "In physical geography, the terms 'Roaring Forties', 'Furious Fifties', and 'Shrieking Sixties' refer to:", options: ["Strong ocean currents in the Atlantic", "Intense localized cyclones in the Bay of Bengal", "Powerful westerly winds in the Southern Hemisphere", "High-altitude jet streams over the Himalayas"], correct: 2 },
            { text: "The ancient University of Nalanda, a prominent center of learning and Buddhist scholarship, was founded during the reign of which dynasty?", options: ["Maurya Empire", "Gupta Empire", "Chola Dynasty", "Kushan Empire"], correct: 1 },
            { text: "The historic 'Poona Pact' of 1932 regarding the reservation of electoral seats for the depressed classes was an agreement signed between Mahatma Gandhi and:", options: ["Jawaharlal Nehru", "B.R. Ambedkar", "Sardar Vallabhbhai Patel", "Lord Irwin"], correct: 1 },
            { text: "In astrobiology, the \"Goldilocks Zone\" around a star refers specifically to the orbital region where:", options: ["The planetary mass is exactly equal to Earth's", "Solar winds are completely deflected", "Temperatures allow liquid water to exist on a planet's surface", "Asteroid impacts are statistically impossible"], correct: 2 },
            { text: "Which prerogative writ is issued by a constitutional court commanding a lower court, tribunal, or public authority to perform a mandatory public duty?", options: ["Habeas Corpus", "Certiorari", "Quo Warranto", "Mandamus"], correct: 3 },
            { text: "In Indian banking, 'CRR' dictates the minimum fraction of total deposits that commercial banks must hold as reserve cash with the RBI. What does CRR stand for?", options: ["Capital Return Ratio", "Cash Reserve Ratio", "Credit Risk Rate", "Currency Retention Ratio"], correct: 1 },
            { text: "Under the constitutional framework of the Indian Parliament, a 'Money Bill' can originate and be introduced only in the:", options: ["Rajya Sabha", "Lok Sabha", "Public Accounts Committee", "Office of the President"], correct: 1 },
            { text: "The 'Lorenz curve' is a graphical representation utilized in economics primarily to illustrate:", options: ["The trade-off between inflation and unemployment", "The relationship between tax rates and tax revenue", "The distribution of income or wealth inequality within a population", "The marginal utility of consumer goods"], correct: 2 },
            { text: "The specific directive to the State to endeavor to secure a 'Uniform Civil Code' for the citizens throughout the territory of India is enshrined in which Article of the Constitution?", options: ["Article 40", "Article 44", "Article 48", "Article 51"], correct: 1 }
        ];

        // ---------- STATE ----------
        const totalQ = questions.length; // 120
        let currentIndex = 0;
        let userAnswers = new Array(totalQ).fill(null); // stores selected option index or null
        let markedForReview = new Array(totalQ).fill(false);
        let visited = new Array(totalQ).fill(false);
        let timeLeft = 120 * 60; // 120 minutes in seconds
        let timerInterval = null;
        let testSubmitted = false;

        // DOM elements
        const questionArea = document.getElementById('questionArea');
        const paletteGrid = document.getElementById('paletteGrid');
        const paletteCount = document.getElementById('paletteCount');
        const timerDisplay = document.getElementById('timerDisplay');
        const resultOverlay = document.getElementById('resultOverlay');
        const resultBody = document.getElementById('resultBody');
        const closeOverlayBtn = document.getElementById('closeOverlayBtn');

        // ---------- RENDER QUESTION ----------
        function renderQuestion() {
            if (testSubmitted) return;
            const q = questions[currentIndex];
            visited[currentIndex] = true;
            const selected = userAnswers[currentIndex];
            const isMarked = markedForReview[currentIndex];

            let optionsHtml = '';
            q.options.forEach((opt, idx) => {
                const selectedClass = (selected === idx) ? 'selected' : '';
                optionsHtml += `
                    <div class="option ${selectedClass}" data-opt-index="${idx}">
                        <span class="letter">${String.fromCharCode(65 + idx)}.</span>
                        <span class="opt-text">${opt}</span>
                    </div>
                `;
            });

            questionArea.innerHTML = `
                <div class="question-number">Question ${currentIndex + 1} of ${totalQ}</div>
                <div class="question-text">${q.text}</div>
                <div class="options" id="optionsContainer">${optionsHtml}</div>
                <div class="nav-buttons">
                    <button class="btn" id="prevBtn" ${currentIndex === 0 ? 'disabled' : ''}>← Previous</button>
                    <button class="btn" id="nextBtn">Next →</button>
                    <button class="btn outline" id="clearBtn">Clear Response</button>
                    <button class="btn warning" id="markBtn">${isMarked ? 'Unmark' : 'Mark for Review'}</button>
                    <button class="btn danger" id="submitBtn" style="margin-left:auto;">Submit Test</button>
                </div>
            `;

            // Attach option listeners
            document.querySelectorAll('.option').forEach(el => {
                el.addEventListener('click', (e) => {
                    const idx = parseInt(el.dataset.optIndex);
                    if (userAnswers[currentIndex] === idx) {
                        // deselect
                        userAnswers[currentIndex] = null;
                    } else {
                        userAnswers[currentIndex] = idx;
                    }
                    renderQuestion();
                    renderPalette();
                });
            });

            // Nav buttons
            document.getElementById('prevBtn')?.addEventListener('click', () => {
                if (currentIndex > 0) { currentIndex--; renderQuestion(); renderPalette(); }
            });
            document.getElementById('nextBtn')?.addEventListener('click', () => {
                if (currentIndex < totalQ - 1) { currentIndex++; renderQuestion(); renderPalette(); }
            });
            document.getElementById('clearBtn')?.addEventListener('click', () => {
                userAnswers[currentIndex] = null;
                renderQuestion();
                renderPalette();
            });
            document.getElementById('markBtn')?.addEventListener('click', () => {
                markedForReview[currentIndex] = !markedForReview[currentIndex];
                renderQuestion();
                renderPalette();
            });
            document.getElementById('submitBtn')?.addEventListener('click', () => {
                if (confirm('Are you sure you want to submit the test?')) {
                    submitTest();
                }
            });

            // Re-render MathJax
            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([questionArea]).catch(console.error);
            }
            updatePaletteCount();
        }

        // ---------- RENDER PALETTE ----------
        function renderPalette() {
            let html = '';
            for (let i = 0; i < totalQ; i++) {
                let stateClass = '';
                const answered = userAnswers[i] !== null;
                const marked = markedForReview[i];
                const wasVisited = visited[i];

                if (marked) {
                    stateClass = 'marked';
                } else if (answered) {
                    stateClass = 'answered';
                } else if (wasVisited) {
                    stateClass = 'visited'; // not answered but visited -> orange
                } else {
                    stateClass = 'not-visited';
                }

                const activeClass = (i === currentIndex) ? 'active' : '';
                html += `<div class="palette-btn ${stateClass} ${activeClass}" data-index="${i}">${i + 1}</div>`;
            }
            paletteGrid.innerHTML = html;

            document.querySelectorAll('.palette-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (testSubmitted) return;
                    currentIndex = parseInt(btn.dataset.index);
                    renderQuestion();
                    renderPalette();
                });
            });
            updatePaletteCount();
        }

        function updatePaletteCount() {
            const answeredCount = userAnswers.filter(a => a !== null).length;
            paletteCount.textContent = `${answeredCount}/${totalQ}`;
        }

        // ---------- TIMER ----------
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (testSubmitted) return;
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    submitTest(true);
                }
            }, 1000);
        }

        // ---------- SUBMIT TEST ----------
        function submitTest(auto = false) {
            if (testSubmitted) return;
            testSubmitted = true;
            if (timerInterval) clearInterval(timerInterval);
            if (!auto) {
                // no confirm again
            }
            // calculate score
            let correct = 0, wrong = 0, skipped = 0;
            for (let i = 0; i < totalQ; i++) {
                const userAns = userAnswers[i];
                const correctAns = questions[i].correct;
                if (userAns === null) {
                    skipped++;
                } else if (userAns === correctAns) {
                    correct++;
                } else {
                    wrong++;
                }
            }
            const totalScore = correct * 3 - wrong * 1;
            const attempted = correct + wrong;
            const accuracy = attempted > 0 ? ((correct / attempted) * 100).toFixed(2) : '0.00';

            // Build result overlay content
            let summaryHtml = `
                <div class="score-summary">
                    <div class="score-item"><div class="label">Score</div><div class="value">${totalScore}</div></div>
                    <div class="score-item"><div class="label">Correct</div><div class="value" style="color:#22c55e;">${correct}</div></div>
                    <div class="score-item"><div class="label">Wrong</div><div class="value" style="color:#dc2626;">${wrong}</div></div>
                    <div class="score-item"><div class="label">Skipped</div><div class="value" style="color:#64748b;">${skipped}</div></div>
                    <div class="score-item"><div class="label">Accuracy</div><div class="value">${accuracy}%</div></div>
                </div>
                <div class="filter-bar" id="filterBar">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="correct">Correct</button>
                    <button class="filter-btn" data-filter="incorrect">Incorrect</button>
                    <button class="filter-btn" data-filter="unattempted">Unattempted</button>
                </div>
                <div class="solution-list" id="solutionList"></div>
            `;
            resultBody.innerHTML = summaryHtml;

            // Render solutions based on filter
            function renderSolutions(filter = 'all') {
                const listEl = document.getElementById('solutionList');
                if (!listEl) return;
                let itemsHtml = '';
                for (let i = 0; i < totalQ; i++) {
                    const q = questions[i];
                    const userAns = userAnswers[i];
                    const correctAns = q.correct;
                    let status = 'unattempted';
                    if (userAns === null) status = 'unattempted';
                    else if (userAns === correctAns) status = 'correct';
                    else status = 'incorrect';

                    if (filter !== 'all' && status !== filter) continue;

                    let choicesHtml = '';
                    q.options.forEach((opt, idx) => {
                        let cls = '';
                        if (idx === correctAns) cls = 'correct-ans';
                        if (idx === userAns && userAns !== correctAns) cls = 'user-wrong';
                        if (idx === userAns && userAns === correctAns) cls = 'user-correct';
                        choicesHtml += `<div class="solution-choice ${cls}">${String.fromCharCode(65+idx)}. ${opt}</div>`;
                    });

                    let statusText = status === 'correct' ? '✅ Correct' : (status === 'incorrect' ? '❌ Incorrect' : '⏭️ Unattempted');
                    itemsHtml += `
                        <div class="solution-item ${status}">
                            <div class="solution-q">Q${i+1}. ${q.text}</div>
                            <div class="solution-choices">${choicesHtml}</div>
                            <div style="font-size:0.85rem; color:#475569; margin-top:6px;">Your answer: ${userAns !== null ? String.fromCharCode(65+userAns) : '—'} | Correct: ${String.fromCharCode(65+correctAns)} | ${statusText}</div>
                        </div>
                    `;
                }
                listEl.innerHTML = itemsHtml || '<p style="color:#64748b; text-align:center;">No questions match this filter.</p>';
                if (window.MathJax && MathJax.typesetPromise) {
                    MathJax.typesetPromise([listEl]).catch(console.error);
                }
            }

            renderSolutions('all');

            // Attach filter listeners
            document.querySelectorAll('#filterBar .filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('#filterBar .filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderSolutions(btn.dataset.filter);
                });
            });

            // Show overlay
            resultOverlay.classList.add('show');
        }

        // ---------- DOWNLOAD RESULT ----------
        function downloadResult() {
            const correct = userAnswers.filter((ans, i) => ans !== null && ans === questions[i].correct).length;
            const wrong = userAnswers.filter((ans, i) => ans !== null && ans !== questions[i].correct).length;
            const skipped = userAnswers.filter(ans => ans === null).length;
            const totalScore = correct * 3 - wrong;
            const attempted = correct + wrong;
            const accuracy = attempted > 0 ? ((correct / attempted) * 100).toFixed(2) : '0.00';

            let content = `MCQ Test Performance & Solutions\n`;
            content += `================================\n`;
            content += `Total Score: ${totalScore}  (Correct: ${correct}, Wrong: ${wrong}, Skipped: ${skipped})\n`;
            content += `Accuracy: ${accuracy}%\n\n`;

            for (let i = 0; i < totalQ; i++) {
                const q = questions[i];
                const userAns = userAnswers[i];
                const correctAns = q.correct;
                let status = userAns === null ? 'Unattempted' : (userAns === correctAns ? 'Correct' : 'Incorrect');
                content += `Q${i+1}. ${q.text}\n`;
                q.options.forEach((opt, idx) => {
                    let marker = '';
                    if (idx === correctAns) marker = ' [Correct]';
                    if (idx === userAns && userAns !== correctAns) marker = ' [Your choice]';
                    if (idx === userAns && userAns === correctAns) marker = ' [Your choice, Correct]';
                    content += `   ${String.fromCharCode(65+idx)}. ${opt}${marker}\n`;
                });
                content += `   Status: ${status}\n\n`;
            }

            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'MCQ_Test_Result.txt';
            a.click();
            URL.revokeObjectURL(url);
        }

        // ---------- INIT ----------
        function init() {
            renderQuestion();
            renderPalette();
            startTimer();

            closeOverlayBtn.addEventListener('click', () => {
                resultOverlay.classList.remove('show');
            });

            document.getElementById('downloadBtn')?.addEventListener('click', downloadResult);

            // Ensure MathJax re-renders on palette click after new question
            // Already handled in renderQuestion
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
