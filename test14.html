<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test 14 cancelled · attempt 15</title>
  <style>
    /* simple, creative & clean */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #f7f0eb 0%, #e8dfd9 100%);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      max-width: 620px;
      width: 100%;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 2.5rem;
      padding: 3rem 2.5rem 2.8rem;
      box-shadow: 
        0 30px 45px -20px rgba(0, 0, 0, 0.25),
        0 0 0 1px rgba(255, 255, 255, 0.7) inset,
        0 0 0 1px rgba(180, 140, 120, 0.15);
      text-align: center;
      transition: transform 0.25s ease;
      animation: gentlePop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1);
    }

    @keyframes gentlePop {
      0% { opacity: 0; transform: scale(0.96) translateY(8px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* cancelled badge */
    .status-badge {
      display: inline-block;
      background: #fbeee9;
      color: #a1452c;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.4px;
      padding: 0.45rem 1.2rem;
      border-radius: 60px;
      border: 1px solid #e7c9be;
      box-shadow: 0 2px 6px rgba(190, 110, 80, 0.1);
      margin-bottom: 1.6rem;
      text-transform: uppercase;
      backdrop-filter: blur(2px);
    }

    .status-badge span {
      font-weight: 400;
      opacity: 0.75;
      margin-right: 0.25rem;
    }

    /* main heading */
    h1 {
      font-size: 2.8rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #2b1e17;
      line-height: 1.2;
      margin-bottom: 0.6rem;
    }

    h1 .test-number {
      display: inline-block;
      background: #2b1e17;
      color: #f7f0eb;
      font-weight: 500;
      font-size: 1.8rem;
      padding: 0.2rem 1rem;
      border-radius: 60px;
      margin-left: 0.25rem;
      vertical-align: middle;
      transform: translateY(-2px);
    }

    .cancelled-text {
      font-size: 1.25rem;
      font-weight: 400;
      color: #6b4f42;
      margin-top: 0.4rem;
      margin-bottom: 1.8rem;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .cancelled-text .line-through {
      text-decoration: line-through;
      text-decoration-thickness: 2px;
      text-decoration-color: #b87e6a;
      opacity: 0.7;
    }

    /* attempt 15 callout */
    .attempt-box {
      background: #ffffffd9;
      border-radius: 3rem;
      padding: 1.3rem 1.8rem;
      margin: 2rem 0 1.8rem;
      border: 1px solid #eadcd3;
      box-shadow: 0 6px 16px -8px rgba(90, 60, 45, 0.15);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.8rem 1.2rem;
    }

    .attempt-box .arrow {
      font-size: 2rem;
      line-height: 1;
      color: #b87e6a;
      transition: transform 0.2s ease;
    }

    .attempt-box .arrow:hover {
      transform: translateX(5px);
    }

    .attempt-box .attempt-label {
      font-size: 1.4rem;
      font-weight: 500;
      color: #3b2b22;
    }

    .attempt-box .attempt-label span {
      background: #d9c8bd;
      padding: 0.25rem 1rem;
      border-radius: 50px;
      margin-left: 0.4rem;
      font-weight: 600;
      color: #2b1e17;
      font-size: 1.5rem;
      display: inline-block;
    }

    /* button */
    .btn-attempt {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: #2b1e17;
      color: white;
      border: none;
      padding: 1.2rem 3rem;
      border-radius: 60px;
      font-size: 1.2rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 12px 22px -10px rgba(43, 30, 23, 0.4);
      border: 1px solid #43352c;
      letter-spacing: -0.2px;
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
    }

    .btn-attempt:hover {
      background: #3d2c22;
      transform: scale(1.02);
      box-shadow: 0 18px 28px -12px rgba(43, 30, 23, 0.5);
    }

    .btn-attempt:active {
      transform: scale(0.98);
      background: #1f140f;
    }

    /* subtle bottom note */
    .footnote {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #a48e82;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .footnote .dot {
      display: inline-block;
      width: 4px;
      height: 4px;
      background: #c4ada1;
      border-radius: 50%;
    }

    /* responsive */
    @media (max-width: 480px) {
      .card {
        padding: 2.2rem 1.5rem 2rem;
        border-radius: 2rem;
      }

      h1 {
        font-size: 2.1rem;
      }

      h1 .test-number {
        font-size: 1.4rem;
        padding: 0.1rem 0.7rem;
      }

      .cancelled-text {
        font-size: 1rem;
        flex-wrap: wrap;
      }

      .attempt-box {
        padding: 1rem 1.2rem;
      }

      .attempt-box .attempt-label {
        font-size: 1.15rem;
      }

      .btn-attempt {
        padding: 1rem 1.5rem;
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- small status chip -->
    <div class="status-badge">
      <span>⏺</span> status update
    </div>

    <!-- main message -->
    <h1>
      Test 14 <span class="test-number">cancelled</span>
    </h1>
    <div class="cancelled-text">
      <span class="line-through">cancelled</span> 
      <span aria-hidden="true">·</span> 
      <span>you can attempt test 15</span>
    </div>

    <!-- attempt area (creative flex) -->
    <div class="attempt-box">
      <div class="arrow" aria-hidden="true">↳</div>
      <div class="attempt-label">
        attempt <span>15</span>
      </div>
    </div>

    <!-- button now links to your GitHub test 15 page -->
    <a href="https://pranjalhrc.github.io/test/test15.html" class="btn-attempt" role="button" target="_blank" rel="noopener">
      ⚡ attempt test 15
    </a>

    <!-- subtle footnote (creative) -->
    <div class="footnote">
      <span>test 14 cancelled</span>
      <span class="dot"></span>
      <span>you can attempt test 15</span>
    </div>
  </div>
</body>
</html>
