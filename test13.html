<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mock Test – Mathematics &amp; GK</title>
<style id="appcss">
:root{--ink:#17212b;--mut:#64707d;--line:#d9e0e7;--bg:#eef2f5;--card:#fff;--pri:#0f766e;--pri-soft:#e1f3f1;--ok:#1e9e5a;--ok-soft:#e5f6ec;--bad:#d64550;--bad-soft:#fcebec;--mark:#7c4dff;--warn:#d98a00}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;font-size:15px}
body.standalone{display:block;height:auto;overflow:auto}
math{font-family:"Cambria Math","STIX Two Math","Latin Modern Math","Noto Sans Math","DejaVu Math TeX Gyre",serif;font-size:1.15em;math-style:normal}
math[display=block]{margin:.6em 0}
mtd{text-align:left;padding:.12em .4em}
button{font:inherit;cursor:pointer}
button:focus-visible,.opt:focus-visible,.pb:focus-visible{outline:3px solid #7fb8b2;outline-offset:2px}

/* header */
#top{flex:none;height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:12px}
#top .brand{font-weight:700;font-size:17px}
#top .brand small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.timer{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:8px;padding:6px 14px}
.timer span{font-size:12px;opacity:.75}
.timer b{font-variant-numeric:tabular-nums;font-size:20px;letter-spacing:.03em}
.timer.warn{background:var(--warn)}
.timer.danger{background:var(--bad)}
#palToggle{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-weight:600}

/* layout */
#app{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px}
#qpane{display:flex;flex-direction:column;min-height:0;min-width:0}
#qhead{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 22px;border-bottom:1px solid var(--line);background:#fff}
#qhead .qn{font-weight:700;font-size:17px}
#qhead .meta{color:var(--mut);font-size:13px;text-align:right}
#qbody{flex:1;min-height:0;overflow:auto;padding:22px 26px}
.qtext{font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.6;max-width:880px}
.dt{border-collapse:collapse;margin:12px 0;background:#fff}
.dt th,.dt td{border:1px solid #aab4be;padding:6px 14px;text-align:center}
.dt th{background:#f1f4f7}
.opts{max-width:880px;margin-top:16px}
.opt{display:flex;gap:12px;align-items:center;padding:12px 14px;margin:9px 0;background:#fff;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;user-select:none}
.opt:hover{border-color:#8fb9b4}
.opt .ol{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid #b5c0ca;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--mut)}
.opt .ot{font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.5}
.opt.sel{border-color:var(--pri);background:var(--pri-soft)}
.opt.sel .ol{background:var(--pri);border-color:var(--pri);color:#fff}
.hint{color:var(--mut);font-size:12.5px;margin-top:6px}
#qfoot{flex:none;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;padding:12px 22px;border-top:1px solid var(--line);background:#fff}
#qfoot .g{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:9px 16px;font-weight:600}
.btn:hover:not(:disabled){border-color:#8fb9b4;background:#f6fbfa}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover:not(:disabled){background:#0b5f58}
.btn.mk{border-color:var(--mark);color:var(--mark)}
.btn.mk.on{background:var(--mark);color:#fff}
.btn.sub{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.sub:hover{background:#000}

/* palette: scrolls on its own */
#palette{display:flex;flex-direction:column;min-height:0;background:#fff;border-left:1px solid var(--line)}
#palette h3{flex:none;margin:0;padding:14px 16px 8px;font-size:15px}
.legend{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;padding:0 16px 12px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line)}
.legend div{display:flex;align-items:center;gap:7px}
.lg{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;border:1.5px solid #aab4be;background:#fff;position:relative}
#pgrid{flex:1;min-height:0;overflow-y:auto;padding:12px 16px;overscroll-behavior:contain}
#pgrid h4{margin:10px 0 8px;font-size:12.5px;color:var(--mut);font-weight:600}
#pgrid h4:first-child{margin-top:0}
.pg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pb{aspect-ratio:1;border:1.5px solid #aab4be;background:#fff;border-radius:7px;font-weight:600;font-size:13px;color:var(--ink);padding:0;position:relative}
.pb.na,.lg.na{background:var(--bad);border-color:var(--bad);color:#fff}
.pb.an,.lg.an{background:var(--ok);border-color:var(--ok);color:#fff}
.pb.mk,.lg.mk,.pb.am,.lg.am{background:var(--mark);border-color:var(--mark);color:#fff;border-radius:50%}
.pb.am::after,.lg.am::after{content:"";position:absolute;right:-2px;bottom:-2px;width:10px;height:10px;border-radius:50%;background:var(--ok);border:2px solid #fff}
.pb.cur{box-shadow:0 0 0 3px rgba(15,118,110,.45)}
.pfoot{flex:none;padding:12px 16px;border-top:1px solid var(--line)}
.pfoot .btn{width:100%}

/* modal */
#modal{position:fixed;inset:0;background:rgba(18,28,38,.55);display:none;place-items:center;z-index:40;padding:16px}
#modal.show{display:grid}
.mbox{background:#fff;border-radius:14px;padding:24px;max-width:430px;width:100%}
.mbox h2{margin:0 0 6px;font-size:20px}
.mbox p{margin:0 0 14px;color:var(--mut)}
.mstats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.mstats div{border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--mut)}
.mstats b{display:block;font-size:20px;color:var(--ink)}
.mbtn{display:flex;gap:8px;justify-content:flex-end}

/* result / report */
#result{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:50;display:none}
#result.show{display:block}
.rep{max-width:980px;margin:0 auto;padding:26px 16px 70px}
.rep h1{margin:0 0 4px;font-size:27px}
.rep .sub{color:var(--mut);margin-bottom:6px}
.rep .actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}
.sc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.sc span{font-size:13px;color:var(--mut)}
.sc b{display:block;font-size:28px;margin-top:2px}
.sc small{color:var(--mut)}
.sc.main{background:var(--ink);border-color:var(--ink);color:#fff}
.sc.main span,.sc.main small{color:#b9c6d2}
.sc.c b{color:var(--ok)}.sc.w b{color:var(--bad)}
table.secs{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:18px}
.secs th,.secs td{padding:9px 12px;text-align:center;border-bottom:1px solid var(--line)}
.secs th:first-child,.secs td:first-child{text-align:left}
.secs th{background:#f4f7f9;font-size:13px;color:var(--mut)}
.filters{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .btn.active{background:var(--pri);border-color:var(--pri);color:#fff}
.key{margin-left:auto;font-size:12.5px;color:var(--mut);display:flex;gap:12px}
.key i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sol{background:#fff;border:1px solid var(--line);border-left:5px solid #aab4be;border-radius:10px;padding:16px 18px;margin:14px 0}
.sol[data-s=c]{border-left-color:var(--ok)}
.sol[data-s=w]{border-left-color:var(--bad)}
.sol-h{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.sol-h .qn{font-weight:700;font-size:16px}
.badge{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:#eceff2;color:var(--mut)}
.badge.c{background:var(--ok-soft);color:#157a43}
.badge.w{background:var(--bad-soft);color:#b02a34}
.tag{font-size:12.5px;color:var(--mut);margin-left:auto}
.sol .qtext{font-size:17px}
.sol .o{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;margin:6px 0;border:1.5px solid var(--line);border-radius:9px;background:#fff}
.sol .o b{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid #b5c0ca;display:grid;place-items:center;font-size:12px;color:var(--mut)}
.sol .o .ot{font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:1.5}
.sol .o.correct{background:var(--ok-soft);border-color:var(--ok)}
.sol .o.correct b{background:var(--ok);border-color:var(--ok);color:#fff}
.sol .o.wrong{background:var(--bad-soft);border-color:var(--bad)}
.sol .o.wrong b{background:var(--bad);border-color:var(--bad);color:#fff}
.note{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap;padding-left:8px}
.o.correct .note{color:#157a43}.o.wrong .note{color:#b02a34}
.ansline{margin-top:10px;font-size:14px;color:var(--mut)}
.ansline b{color:var(--ink)}
.empty{display:none;text-align:center;color:var(--mut);padding:40px 0}

@media(max-width:900px){
  #app{grid-template-columns:1fr}
  #palToggle{display:inline-block}
  #palette{position:fixed;top:56px;right:0;bottom:0;width:min(340px,92vw);transform:translateX(105%);transition:transform .2s;z-index:30;box-shadow:-8px 0 24px rgba(0,0,0,.15)}
  #palette.open{transform:none}
  #qbody{padding:16px}
  .qtext{font-size:17px}
  .timer span{display:none}
  .key{margin-left:0}
}
@media(prefers-reduced-motion:reduce){#palette{transition:none}}
</style>
</head>
<body>

<header id="top">
  <div class="brand">Mock Test<small>Mathematics (Q1–90) · General Knowledge (Q91–120)</small></div>
  <div class="timer" id="timerBox"><span>Time left</span><b id="timer">02:00:00</b></div>
  <button id="palToggle" type="button">Questions</button>
</header>

<main id="app">
  <section id="qpane">
    <div id="qhead"></div>
    <div id="qbody"></div>
    <div id="qfoot">
      <div class="g">
        <button class="btn mk" id="bMark" type="button">Mark for Review</button>
        <button class="btn" id="bClear" type="button">Clear Response</button>
      </div>
      <div class="g">
        <button class="btn" id="bPrev" type="button">Previous</button>
        <button class="btn pri" id="bNext" type="button">Next</button>
        <button class="btn sub" id="bSubmit" type="button">Submit</button>
      </div>
    </div>
  </section>
  <aside id="palette">
    <h3>Question Palette</h3>
    <div class="legend" id="legend"></div>
    <div id="pgrid"></div>
    <div class="pfoot"><button class="btn sub" id="bSubmit2" type="button">Submit Test</button></div>
  </aside>
</main>

<div id="modal"><div class="mbox" id="mbox"></div></div>
<div id="result"></div>

<script>
const R=String.raw;
const Q=(t,o,a,x)=>Object.assign({t,o,a},x||{});

/* ---------------- QUESTIONS (120): text, 4 options, correct index ---------------- */
const QS=[
/* 1 */ Q(R`Uttarakhand Public Service Commission Assistant Professor (GDC) 2017 Solved Paper\\
Two eigen values of a $3\times3$ non-singular matrix are 2 and 3. If the sum products of two eigen values taken at a time is 11 then the characteristic equation of the matrix is:`,[R`$\lambda^{3}-5\lambda^{2}+6\lambda=0$`,R`$\lambda^{3}-6\lambda^{2}+11\lambda-6=0$`,R`$\lambda^{3}+6\lambda^{2}-11\lambda+6=0$`,R`$\lambda^{3}-4\lambda^{2}+\lambda+6=0$`],1),
/* 2 */ Q(R`The quadratic form $x^{2}+y^{2}+3xy$ can be reduced to the canonical form:`,[R`$\frac{5}{2}x_{1}^{2}+\frac{1}{2}x_{2}^{2}$`,R`$\frac{5}{2}x_{1}^{2}-\frac{3}{2}x_{2}^{2}$`,R`$-\frac{1}{2}x_{1}^{2}+\frac{3}{2}x_{2}^{2}$`,R`$-\frac{1}{2}x_{1}^{2}+\frac{5}{2}x_{2}^{2}$`],3),
/* 3 */ Q(R`Which of the following series in $\mathbb{R}$ is not uniformly convergent?`,[R`$\sum_{n=1}^{\infty}\frac{\cos nx}{\sqrt{n}}$`,R`$\sum_{n=1}^{\infty}\frac{\cos nx}{n^{3/2}}$`,R`$\sum_{n=1}^{\infty}\frac{\cos nx}{n^{2}}$`,R`$\sum_{n=1}^{\infty}\frac{\cos nx}{n^{p}},p>1$`],0),
/* 4 */ Q(R`The function $f(x)=\lim_{n\rightarrow\infty}\frac{x^{n}}{1+x^{n}e^{x}}\forall x\in[0,\infty)$ at $x=1$:`,[R`Is continuous`,R`Is uniformly continuous`,R`Has discontinuity of first kind`,R`Has discontinuity of second kind`],1),
/* 5 */ Q(R`The directional derivative of the surface $x^{2}-5y^{2}+2z^{2}=12$ at the point $(3, 1, 2)$ in the direction of the vector $(\hat{i}+\hat{j}+\hat{k})$ is:`,[R`$\frac{1}{\sqrt{3}}$`,R`$\frac{2}{\sqrt{3}}$`,R`$\sqrt{3}$`,R`$\frac{4}{\sqrt{3}}$`],3),
/* 6 */ Q(R`The order of the element 4 in the group $(\{0, 1, 2, 3, 4, 5\}, +_{6})$ is:`,[R`1`,R`2`,R`3`,R`4`],2),
/* 7 */ Q(R`If in a ring $(R,+,\cdot)$, $x^{2}=x, \forall x\in R$, then $(x+x)$ is:`,[R`$x^{2}$`,R`0`,R`$-x$`,R`$-2x$`],1),
/* 8 */ Q(R`The generators of the multiplicative cyclic group $\{1, \omega, \omega^{2}\}$, where $\omega$ is the cube root of unity are:`,[R`1 and $\omega$`,R`$\omega$ and $\omega^{2}$`,R`1 and $\omega^{2}$`,R`Only $\omega$`],1),
/* 9 */ Q(R`A subgroup $H$ of a group $G$ is normal if and only if:`,[R`$xHx=xH$`,R`$x^{-1}Hx=Hx^{-1}, \forall x\in G$`,R`$xHx^{-1}=H, \forall x\in G$`,R`$x^{2}Hx^{-1}=Hx^{3}, \forall x\in G$`],2),
/* 10 */ Q(R`A division ring is:`,[R`A field`,R`An integral domain`,R`A ring with division as one operation`,R`None of the above`],1),
/* 11 */ Q(R`If $H$ is a normal subgroup of a finite group $G$ and $O(G/H)=3, O(G)=12$, then $O(H)$ is:`,[R`4`,R`3`,R`2`,R`1`],0),
/* 12 */ Q(R`If $x, y$ are elements of a group $G$ and $O(y)=3$, then $O(xyx^{-1})$ is:`,[R`1`,R`2`,R`3`,R`5`],2),
/* 13 */ Q(R`Every finite group is isomorphic to which of the following?`,[R`An abelian group`,R`A permutation group`,R`A cyclic group`,R`The group $(Z, +)$`],1),
/* 14 */ Q(R`The value of $\frac{1}{2\pi i}\int_{|z|=3}\frac{e^{z}}{z-2}dz$ is:`,[R`$e$`,R`$2\pi i e^{2}$`,R`$2\pi i e^{1}$`,R`$e^{2}$`],3),
/* 15 */ Q(R`If $f(z)$ is an analytic function of $z$ and if $f'(z)$ is continuous within and on a closed contour $C$, then $\int_{C} f(z)dz$ is equal to:`,[R`$2\pi i$`,R`$\pi i$`,R`$\frac{1}{2}\pi i$`,R`0`],3),
/* 16 */ Q(R`The bilinear transformation, which maps the points $z=1,0,-1$ of $z$-plane into the points $w=i, 0, -i$, respectively, of the $w$-plane, is:`,[R`$w=12z$`,R`$w=iz$`,R`$w=-iz$`,R`$w=-\frac{1}{2}iz$`],1),
/* 17 */ Q(R`The value of $\int_{0}^{\infty}\frac{x\sin x}{x^{2}+9}dx$ is:`,[R`$\frac{\pi}{2}e^{-3}$`,R`$\frac{\pi}{2}e^{3}$`,R`$\pi e^{-3}$`,R`$\pi e^{3}$`],0),
/* 18 */ Q(R`The value of the integral $\int_{C}\frac{3z+4}{z(2z+1)}dz$ where $C$ is the circle $|z|=1$, is:`,[R`$2\pi i$`,R`$4\pi i$`,R`$3\pi i$`,R`$-4\pi i$`],2),
/* 19 */ Q(R`The theorem: "A bounded entire function is constant", is named after which of the following mathematician?`,[R`Cauchy`,R`Schwarz`,R`Liouville`,R`Morera`],2),
/* 20 */ Q(R`The value of the integral $\int_{C}\frac{e^{2z}}{(z+1)^{4}}dz$ where $C$ is the circle $|z|=2$ is:`,[R`$\frac{8}{3}\pi i e^{-3}$`,R`$\frac{8}{3}\pi i e^{-2}$`,R`$8\pi i e^{-2}$`,R`$5\pi i e^{-2}$`],1),
/* 21 */ Q(R`The locus of the complex number satisfying $\arg\left(\frac{z-1}{z+1}\right)=\frac{\pi}{3}$ is a:`,[R`Straight line`,R`Circle`,R`Parabola`,R`Hyperbola`],1),
/* 22 */ Q(R`In the Argand diagram the point $z$ satisfying $|z+5|^{2}+|z-5|^{2}=75$ lies on:`,[R`A circle`,R`An ellipse`,R`A hyperbola`,R`A straight line`],0),
/* 23 */ Q(R`If $w=f(re^{i\theta})$, then $\frac{dw}{dz}$ is:`,[R`$(\cos\theta+i\sin\theta)\frac{\partial w}{\partial r}$`,R`$(\sin\theta+i\cos\theta)\frac{\partial w}{\partial r}$`,R`$(\sin\theta-i\cos\theta)\frac{\partial w}{\partial r}$`,R`$(\cos\theta-i\sin\theta)\frac{\partial w}{\partial r}$`],3),
/* 24 */ Q(R`The fixed points of the bilinear transformation $w=\frac{5z+4}{z+5}$ are:`,[R`$2, -2$`,R`$2, 2i$`,R`$-2, -3$`,R`$-4, -5$`],0),
/* 25 */ Q(R`Laurent's series expansion of the function $\frac{1}{1-z}$ in the region $1<|z|$ is:`,[R`$-\sum_{n=0}^{\infty}\frac{1}{z^{n}}$`,R`$\sum_{n=0}^{\infty}\frac{1}{z^{n+1}}$`,R`$-\sum_{n=0}^{\infty}\frac{1}{z^{n+1}}$`,R`$\sum_{n=0}^{\infty}z^{n}$`],3),
/* 26 */ Q(R`Value of $\int_{C}\frac{dz}{z^{2}+4}$, where $C$ is the unit circle, is:`,[R`$2i$`,R`$-2i$`,R`$\pi i$`,R`0`],3),
/* 27 */ Q(R`In the Taylor's series expansion of $f(z)=\log_{e}z$ about point $z=1$, the coefficient of $(z-1)^{4}$ is:`,[R`1`,R`$-\frac{1}{4}$`,R`$\frac{1}{4}$`,R`$\frac{1}{4!}$`],1),
/* 28 */ Q(R`The image of the region $|z-i|<2$ under the mapping $w=\frac{1+i}{z+i}$ in the $w$-plane is:`,[R`$u<v$`,R`$2u<v+1$`,R`$u+v<1$`,R`$2v-2u+1<0$`],2),
/* 29 */ Q(R`Let $m$ be a positive integer and $x, y$ be integers then which of the following is not true:`,[R`$(x+y)\pmod m = ((x\pmod m)+(y\pmod m))\pmod m$`,R`$(x-y)\pmod m = ((x\pmod m)-(y\pmod m))\pmod m$`,R`$(xy)\pmod m = ((x\pmod m)(y\pmod m))\pmod m$`,R`$(x-y)\pmod m = (x\pmod m(-y\pmod m))\pmod m$`],2),
/* 30 */ Q(R`The residue at the simple pole $z=i$ of the function $f(z)=\frac{9z+i}{z^{3}+z}$ is:`,[R`$5i$`,R`$-5i$`,R`$-10i$`,R`$10i$`],1),
/* 31 */ Q(R`Solution of the differential equation $(D-D'-1)(D+D'-2)z=e^{2x-y}$ is:`,[R`$z=e^{x}\phi(y+x)+e^{2x}\psi(y+x)+\frac{1}{2}e^{2x-y}$`,R`$z=e^{-x}\phi(y+x)+e^{-2x}\psi(y+x)+\frac{1}{2}e^{2x-y}$`,R`$z=e^{-x}\phi(y-x)+e^{-2x}\psi(y-x)+\frac{1}{2}e^{2x-y}$`,R`$z=e^{x}\phi(y+x)+e^{2x}\psi(y-x)-\frac{1}{2}e^{2x-y}$`],3),
/* 32 */ Q(R`Particular integral of the differential equation $(D^{2}-4D+4)y=x e^{2x}$ is:`,[R`$\frac{1}{6}x^{2}e^{2x}$`,R`$\frac{1}{6}x^{4}e^{2x}$`,R`$\frac{1}{2}x^{3}e^{2x}$`,R`$\frac{1}{6}x^{3}e^{2x}$`],3),
/* 33 */ Q(R`Solution of the differential equation $\frac{dy}{dx}=\frac{x+2y-3}{2x+y-3}$ is:`,[R`$x-y+2=a(x+y)^{2}$`,R`$x+y-2=a(x-y)^{3}$`,R`$x+y-2=b(x+y)^{3}$`,R`$x+y+2=a(x-y)^{2}$`],1),

/* ---------------- LaTeX -> MathML (no libraries) ---------------- */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const GREEK={alpha:'α',beta:'β',gamma:'γ',delta:'δ',epsilon:'ε',theta:'θ',lambda:'λ',mu:'μ',pi:'π',rho:'ρ',sigma:'σ',phi:'φ',psi:'ψ',omega:'ω',tau:'τ',eta:'η',xi:'ξ',nu:'ν',kappa:'κ',zeta:'ζ',chi:'χ'};
const UGREEK={Delta:'Δ',Sigma:'Σ',Omega:'Ω',Gamma:'Γ',Theta:'Θ',Lambda:'Λ',Phi:'Φ',Psi:'Ψ',Pi:'Π'};
const OPSYM={le:'≤',leq:'≤',ge:'≥',geq:'≥',ne:'≠',neq:'≠',pm:'±',mp:'∓',cdot:'⋅',times:'×',div:'÷',rightarrow:'→',to:'→',leftarrow:'←',in:'∈',notin:'∉',forall:'∀',exists:'∃',cup:'∪',cap:'∩',subset:'⊂',approx:'≈',equiv:'≡',dots:'…',ldots:'…',cdots:'⋯',langle:'⟨',rangle:'⟩'};
const FUNCS=new Set(['sin','cos','tan','cot','sec','csc','log','ln','exp','min','max','arg','cosh','sinh','tanh','det','sup','inf','lim']);

function tex2mml(src,display){
  let i=0;const n=src.length;
  const ws=()=>{while(i<n&&/\s/.test(src[i]))i++;};
  const mrow=a=>a.length===1?a[0]:'<mrow>'+a.join('')+'</mrow>';
  const EMPTY='<mrow></mrow>';
  const chr=c=>{
    if(/[a-zA-Z]/.test(c))return '<mi>'+c+'</mi>';
    if(c==='-')return '<mo>−</mo>';
    if(c==="'")return '<mo>′</mo>';
    if(c==='*')return '<mo>∗</mo>';
    return '<mo>'+esc(c)+'</mo>';
  };
  function atTerm(t){
    if(i>=n)return true;
    const c=src[i];
    if(t.has('}')&&c==='}')return true;
    if(t.has('&')&&c==='&')return true;
    if(t.has('//')&&src.startsWith('\\\\',i))return true;
    if(t.has('right')&&/^\\right(?![a-zA-Z])/.test(src.slice(i,i+7)))return true;
    if(t.has('end')&&/^\\end(?![a-zA-Z])/.test(src.slice(i,i+5)))return true;
    return false;
  }
  function seq(t){const out=[];for(;;){ws();if(atTerm(t))break;const m=atomS();if(m)out.push(m);}return out;}
  function group(){i++;const a=seq(new Set(['}']));if(src[i]==='}')i++;return mrow(a.length?a:[EMPTY]);}
  function arg(){
    ws();
    if(src[i]==='{')return group();
    if(src[i]==='\\')return atom().m||EMPTY;
    const c=src[i++]||'';
    if(/[0-9]/.test(c))return '<mn>'+c+'</mn>';
    return chr(c);
  }
  function rawGroup(){
    ws();let s='';
    if(src[i]==='{'){let d=1,j=i+1;while(j<n&&d>0){if(src[j]==='{')d++;else if(src[j]==='}')d--;j++;}s=src.slice(i+1,j-1);i=j;}
    else s=src[i++]||'';
    return s;
  }
  function delim(){
    ws();let d=src[i];
    if(d==='\\'){i++;const mm=/^[a-zA-Z]+/.exec(src.slice(i));
      if(mm){d=mm[0];i+=d.length;d=({langle:'⟨',rangle:'⟩',lbrace:'{',rbrace:'}',vert:'|'})[d]||'';}
      else{d=src[i];i++;}}
    else i++;
    return d==='.'?'':(d||'');
  }
  function atomS(){
    const a=atom();let sub=null,sup=null,pr=0;
    for(;;){
      ws();const c=src[i];
      if(c==='^'){i++;sup=arg();}
      else if(c==='_'){i++;sub=arg();}
      else if(c==="'"){i++;pr++;}
      else break;
    }
    if(pr){const parts=[];for(let k=0;k<pr;k++)parts.push('<mo>′</mo>');if(sup!==null)parts.push(sup);sup=mrow(parts);}
    let m=a.m;
    if(!m)return '';
    if(sub!==null||sup!==null){
      const u=a.lim==='u';
      if(sub!==null&&sup!==null)m=u?`<munderover>${m}${sub}${sup}</munderover>`:`<msubsup>${m}${sub}${sup}</msubsup>`;
      else if(sub!==null)m=u?`<munder>${m}${sub}</munder>`:`<msub>${m}${sub}</msub>`;
      else m=u?`<mover>${m}${sup}</mover>`:`<msup>${m}${sup}</msup>`;
    }
    if(a.fn)m+='<mo>&#x2061;</mo>';
    return m;
  }
  function atom(){
    const c=src[i];
    if(c==='{')return {m:group()};
    if(c==='}'){i++;return {m:''};}
    if(c==='\\')return cmd();
    if(/[0-9]/.test(c)||(c==='.'&&/[0-9]/.test(src[i+1]||''))){
      let j=i;while(j<n&&(/[0-9]/.test(src[j])||(src[j]==='.'&&/[0-9]/.test(src[j+1]||''))))j++;
      const s=src.slice(i,j);i=j;return {m:'<mn>'+s+'</mn>'};
    }
    i++;return {m:chr(c)};
  }
  function cmd(){
    i++;
    let name;const mm=/^[a-zA-Z]+/.exec(src.slice(i,i+24));
    if(mm){name=mm[0];i+=name.length;}else{name=src[i]||'';i++;}
    if(GREEK[name])return {m:'<mi>'+GREEK[name]+'</mi>'};
    if(UGREEK[name])return {m:'<mi mathvariant="normal">'+UGREEK[name]+'</mi>'};
    if(OPSYM[name])return {m:'<mo>'+OPSYM[name]+'</mo>'};
    if(FUNCS.has(name))return name==='lim'?{m:'<mi>lim</mi>',lim:'u'}:{m:'<mi>'+name+'</mi>',fn:true};
    switch(name){
      case 'infty':return {m:'<mi mathvariant="normal">∞</mi>'};
      case 'partial':return {m:'<mi mathvariant="normal">∂</mi>'};
      case 'sum':return {m:'<mo>∑</mo>',lim:'u'};
      case 'int':return {m:'<mo>∫</mo>'};
      case 'frac':{const a=arg(),b=arg();return {m:`<mfrac>${a}${b}</mfrac>`};}
      case 'sqrt':{const a=arg();return {m:`<msqrt>${a}</msqrt>`};}
      case 'text':case 'mathrm':case 'textrm':{const s=rawGroup();return {m:'<mtext>'+esc(s).replace(/ /g,'\u00A0')+'</mtext>'};}
      case 'mathbb':{const s=rawGroup();const mp={R:'ℝ',Z:'ℤ',N:'ℕ',Q:'ℚ',C:'ℂ'};return {m:'<mi mathvariant="normal">'+(mp[s]||esc(s))+'</mi>'};}
      case 'hat':case 'dot':case 'bar':case 'vec':{const a=arg();const ch={hat:'\u02C6',dot:'\u02D9',bar:'\u00AF',vec:'→'}[name];return {m:`<mover accent="true">${a}<mo>${ch}</mo></mover>`};}
      case 'pmod':{const a=arg();return {m:`<mrow><mspace width="0.9em"></mspace><mo>(</mo><mi>mod</mi><mspace width="0.25em"></mspace>${a}<mo>)</mo></mrow>`};}
      case '{':case '}':return {m:'<mo>'+name+'</mo>'};
      case '%':return {m:'<mo>%</mo>'};
      case ',':return {m:'<mspace width="0.17em"></mspace>'};
      case ';':return {m:'<mspace width="0.28em"></mspace>'};
      case ' ':return {m:'<mspace width="0.25em"></mspace>'};
      case 'quad':return {m:'<mspace width="1em"></mspace>'};
      case 'qquad':return {m:'<mspace width="2em"></mspace>'};
      case 'left':{
        const l=delim();const a=seq(new Set(['right']));let r='';
        if(/^\\right(?![a-zA-Z])/.test(src.slice(i,i+7))){i+=6;r=delim();}
        const f=d=>d?`<mo fence="true" stretchy="true">${esc(d)}</mo>`:'';
        return {m:`<mrow>${f(l)}${a.join('')}${f(r)}</mrow>`};
      }
      case 'begin':{
        const env=rawGroup();const rows=[];let row=[];
        for(;;){
          const cell=seq(new Set(['&','//','end']));row.push(cell);
          if(src[i]==='&'){i++;continue;}
          if(src.startsWith('\\\\',i)){i+=2;rows.push(row);row=[];continue;}
          if(/^\\end(?![a-zA-Z])/.test(src.slice(i,i+5))){i+=4;rawGroup();rows.push(row);break;}
          rows.push(row);break;
        }
        const body=rows.filter(r=>r.some(c=>c.length)).map(r=>'<mtr>'+r.map(c=>'<mtd>'+mrow(c.length?c:[EMPTY])+'</mtd>').join('')+'</mtr>').join('');
        const tab=`<mtable>${body}</mtable>`;
        return env==='cases'?{m:`<mrow><mo fence="true" stretchy="true">{</mo>${tab}</mrow>`}:{m:tab};
      }
      case '\\':case '!':return {m:''};
      default:return {m:'<mi>'+esc(name)+'</mi>'};
    }
  }
  const nodes=seq(new Set());
  return '<math display="'+(display?'block':'inline')+'">'+nodes.join('')+'</math>';
}

/* text with $...$ (inline) and $$...$$ (display) math */
function fmt(s){
  let out='',last=0,m;
  const re=/\$\$([\s\S]+?)\$\$|\$([^$]+?)\$/g;
  const plain=t=>esc(t.replace(/\\\\[ \t]*\n?/g,'\n')).replace(/\n/g,'<br>');
  while((m=re.exec(s))){
    out+=plain(s.slice(last,m.index));
    out+=tex2mml(m[1]!==undefined?m[1]:m[2],m[1]!==undefined);
    last=m.index+m[0].length;
  }
  return out+plain(s.slice(last));
}
function tblHTML(t){
  if(!t)return '';
  return '<table class="dt">'+t.rows.map((r,ri)=>'<tr>'+r.map(c=>{const tg=(t.head&&ri===0)?'th':'td';return '<'+tg+'>'+fmt(String(c))+'</'+tg+'>';}).join('')+'</tr>').join('')+'</table>';
}
/* cached rendered HTML per question */
function qHTML(k){
  const q=QS[k];
  if(!q._h)q._h={t:fmt(q.t),tb:tblHTML(q.tbl),t2:q.t2?fmt(q.t2):'',o:q.o.map(fmt)};
  return q._h;
}

/* ---------------- test state ---------------- */
const TOTAL=QS.length,DURATION=120*60,LET=['A','B','C','D'];

const $=id=>document.getElementById(id);

function pState(k){
  if(marked[k])return ans[k]>=0?'am':'mk';
  if(ans[k]>=0)return 'an';
  return visited[k]?'na':'nv';
}
/* palette */
function buildPalette(){
  let h='<h4>Mathematics (Q1–90)</h4><div class="pg">';
  for(let k=0;k<TOTAL;k++){
    if(k===90)h+='</div><h4>General Knowledge (Q91–120)</h4><div class="pg">';

  }

  $('legend').innerHTML=
    '<div><span class="lg an"></span>Answered <b id="c_an">0</b></div>'+
    '<div><span class="lg na"></span>Not answered <b id="c_na">0</b></div>'+

function updatePalette(){
  const btns=$('pgrid').querySelectorAll('.pb'),cnt={an:0,na:0,mk:0,nv:0,am:0};
  btns.forEach((b,k)=>{const s=pState(k);cnt[s]++;b.className='pb '+s+(k===cur?' cur':'');});
  for(const s in cnt)$('c_'+s).textContent=cnt[s];
}
/* question view */
function render(){
  visited[cur]=true;
  const q=QS[cur],h=qHTML(cur);
  $('qhead').innerHTML='<span class="qn">Question '+(cur+1)+' of '+TOTAL+'</span><span class="meta">'+esc(secOf(cur))+' · +3 correct, −1 wrong</span>';
  let b='<div class="qtext">'+h.t+'</div>'+h.tb+(h.t2?'<div class="qtext">'+h.t2+'</div>':'');
  b+='<div class="opts" role="radiogroup">';
  h.o.forEach((o,i)=>{b+='<div class="opt'+(ans[cur]===i?' sel':'')+'" role="radio" tabindex="0" aria-checked="'+(ans[cur]===i)+'" data-i="'+i+'"><span class="ol">'+LET[i]+'</span><span class="ot">'+o+'</span></div>';});
  b+='</div><div class="hint">Click a selected option again to deselect it.</div>';
  $('qbody').innerHTML=b;$('qbody').scrollTop=0;
  refreshControls();updatePalette();
}
function refreshControls(){
  $('bPrev').disabled=cur===0;$('bNext').disabled=cur===TOTAL-1;
  const m=$('bMark');m.classList.toggle('on',marked[cur]);m.textContent=marked[cur]?'Unmark Review':'Mark for Review';
  $('bClear').disabled=ans[cur]<0;
}
function select(i){
  ans[cur]=ans[cur]===i?-1:i;
  $('qbody').querySelectorAll('.opt').forEach((o,j)=>{o.classList.toggle('sel',ans[cur]===j);o.setAttribute('aria-checked',ans[cur]===j);});
  refreshControls();updatePalette();
}
function go(k){if(k<0||k>=TOTAL)return;cur=k;render();}

$('qbody').addEventListener('click',e=>{const o=e.target.closest('.opt');if(o&&!submitted)select(+o.dataset.i);});
$('qbody').addEventListener('keydown',e=>{const o=e.target.closest('.opt');if(o&&(e.key==='Enter'||e.key===' ')){e.preventDefault();select(+o.dataset.i);}});
$('pgrid').addEventListener('click',e=>{const b=e.target.closest('.pb');if(b){go(+b.dataset.k);$('palette').classList.remove('open');}});
$('bPrev').onclick=()=>go(cur-1);
$('bNext').onclick=()=>go(cur+1);
$('bClear').onclick=()=>{ans[cur]=-1;render();};
$('bMark').onclick=()=>{marked[cur]=!marked[cur];refreshControls();updatePalette();};
$('palToggle').onclick=()=>$('palette').classList.toggle('open');

/* timer */
const pad=n=>String(n).padStart(2,'0');
function tick(){
  if(submitted)return;
  const rem=Math.max(0,Math.ceil((endAt-Date.now())/1000));
  $('timer').textContent=pad(Math.floor(rem/3600))+':'+pad(Math.floor(rem%3600/60))+':'+pad(rem%60);
  $('timerBox').className='timer'+(rem<=300?' danger':rem<=900?' warn':'');
  if(rem<=0){autoSubmitted=true;finish();}
}
const timerId=setInterval(tick,250);tick();

/* submit */
function counts(){const c={an:0,na:0,mk:0,nv:0,am:0};for(let k=0;k<TOTAL;k++)c[pState(k)]++;return c;}
function askSubmit(){
  if(submitted)return;
  const c=counts(),answered=ans.filter(a=>a>=0).length,mk=c.mk+c.am;
  $('mbox').innerHTML='<h2>Submit the test?</h2><p>You cannot change answers after submitting.</p><div class="mstats">'+
    '<div><b>'+answered+'</b>Answered</div><div><b>'+(TOTAL-answered)+'</b>Not answered</div>'+
    '<div><b>'+mk+'</b>Marked for review</div><div><b>'+c.nv+'</b>Not visited</div></div>'+
    '<div class="mbtn"><button class="btn" id="mNo" type="button">Keep working</button><button class="btn pri" id="mYes" type="button">Yes, submit</button></div>';
  $('modal').classList.add('show');
  $('mNo').onclick=()=>$('modal').classList.remove('show');
  $('mYes').onclick=()=>{$('modal').classList.remove('show');finish();};
  $('mYes').focus();
}
$('bSubmit').onclick=askSubmit;$('bSubmit2').onclick=askSubmit;

/* results */
function evaluate(){
  let c=0,w=0,s=0;const st=[],sec=[{c:0,w:0,s:0,n:90},{c:0,w:0,s:0,n:30}];
  for(let k=0;k<TOTAL;k++){
    const g=k<90?0:1;let x;
    if(ans[k]<0){x='s';s++;sec[g].s++;}
    else if(ans[k]===QS[k].a){x='c';c++;sec[g].c++;}
    else{x='w';w++;sec[g].w++;}
    st.push(x);
  }
  return {c,w,s,st,sec,score:3*c-w,attempted:c+w};
}
function reportHTML(forFile,ev,spent,auto){
  const acc=ev.attempted?(ev.c/ev.attempted*100).toFixed(1)+'%':'0.0%';
  const mm=Math.floor(spent/60),ss=spent%60;
  let h='<h1>Performance &amp; Solutions</h1><div class="sub">'+(auto?'Time was up – the test was submitted automatically. ':'')+'Marking: +3 correct, −1 wrong, 0 skipped.</div>';
  if(!forFile)h+='<div class="actions"><button class="btn pri" id="bDl" type="button">Download Performance &amp; Solutions</button><button class="btn" id="bRe" type="button">Start a new attempt</button></div>';
  h+='<div class="cards">'+
    '<div class="sc main"><span>Total score</span><b>'+ev.score+'</b><small>out of '+TOTAL*3+'</small></div>'+
    '<div class="sc"><span>Accuracy</span><b>'+acc+'</b><small>'+ev.c+' of '+ev.attempted+' attempted</small></div>'+
    '<div class="sc c"><span>Correct</span><b>'+ev.c+'</b><small>+'+ev.c*3+' marks</small></div>'+
    '<div class="sc w"><span>Wrong</span><b>'+ev.w+'</b><small>−'+ev.w+' marks</small></div>'+
    '<div class="sc"><span>Skipped</span><b>'+ev.s+'</b><small>0 marks</small></div>'+
    '<div class="sc"><span>Time taken</span><b>'+mm+'m '+pad(ss)+'s</b><small>of 120 minutes</small></div></div>';
  const row=(nm,o)=>'<tr><td>'+nm+'</td><td>'+o.c+'</td><td>'+o.w+'</td><td>'+o.s+'</td><td><b>'+(3*o.c-o.w)+'</b> / '+o.n*3+'</td></tr>';
  h+='<table class="secs"><tr><th>Section</th><th>Correct</th><th>Wrong</th><th>Skipped</th><th>Score</th></tr>'+row('Mathematics (Q1–90)',ev.sec[0])+row('General Knowledge (Q91–120)',ev.sec[1])+'</table>';
  h+='<div class="filters"><button class="btn active" data-f="all" type="button">All ('+TOTAL+')</button>'+
    '<button class="btn" data-f="c" type="button">Correct ('+ev.c+')</button>'+
    '<button class="btn" data-f="w" type="button">Incorrect ('+ev.w+')</button>'+
    '<button class="btn" data-f="s" type="button">Unattempted ('+ev.s+')</button>'+
    '<span class="key"><span><i style="background:#1e9e5a"></i>Correct answer</span><span><i style="background:#d64550"></i>Your wrong answer</span></span></div>';
  h+='<div class="empty">No questions in this category.</div>';
  for(let k=0;k<TOTAL;k++){
    const q=QS[k],x=ev.st[k],hh=qHTML(k),u=ans[k];
    const badge=x==='c'?'<span class="badge c">Correct +3</span>':x==='w'?'<span class="badge w">Incorrect −1</span>':'<span class="badge">Unattempted 0</span>';
    h+='<article class="sol" data-s="'+x+'"><div class="sol-h"><span class="qn">Q'+(k+1)+'</span>'+badge+'<span class="tag">'+esc(secOf(k))+(marked[k]?' · marked for review':'')+'</span></div>'+
      '<div class="qtext">'+hh.t+'</div>'+hh.tb+(hh.t2?'<div class="qtext">'+hh.t2+'</div>':'')+'<div class="opts">';
    hh.o.forEach((o,i)=>{
      let cls='',note='';
      if(i===q.a){cls=' correct';note=u===i?'Your answer · Correct':'Correct answer';}
      else if(i===u){cls=' wrong';note='Your answer';}
      h+='<div class="o'+cls+'"><b>'+LET[i]+'</b><span class="ot">'+o+'</span>'+(note?'<span class="note">'+note+'</span>':'')+'</div>';
    });
    h+='</div><div class="ansline">Your answer: <b>'+(u<0?'Not attempted':LET[u])+'</b> &nbsp;·&nbsp; Correct answer: <b>'+LET[q.a]+'</b></div></article>';
  }
  return h;
}
/* ES5, self-contained: it is also copied into the downloaded file */
function initFilters(root){
  root.addEventListener('click',function(e){
    var b=e.target.closest?e.target.closest('[data-f]'):null;if(!b)return;
    var f=b.getAttribute('data-f'),btns=root.querySelectorAll('[data-f]'),i,shown=0;
    for(i=0;i<btns.length;i++)btns[i].classList.toggle('active',btns[i]===b);
    var sols=root.querySelectorAll('.sol');
    for(i=0;i<sols.length;i++){var ok=(f==='all'||sols[i].getAttribute('data-s')===f);sols[i].style.display=ok?'':'none';if(ok)shown++;}
    var em=root.querySelector('.empty');if(em)em.style.display=shown?'none':'block';
  });
}
let lastEv=null,lastSpent=0;
function finish(){
  if(submitted)return;
  submitted=true;clearInterval(timerId);
  $('modal').classList.remove('show');$('palette').classList.remove('open');
  lastEv=evaluate();
  lastSpent=Math.min(DURATION,Math.round((Date.now()-startAt)/1000));
  const r=$('result');
  r.innerHTML='<div class="rep">'+reportHTML(false,lastEv,lastSpent,autoSubmitted)+'</div>';
  r.classList.add('show');r.scrollTop=0;
  initFilters(r);
  $('bDl').onclick=downloadReport;
  $('bRe').onclick=()=>location.reload();
}
function downloadReport(){
